apiVersion: batch/v1
kind: Job
metadata:
  name: ${JOB_NAME}
  namespace: ${NAMESPACE}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: ${JOB_TIMEOUT}
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: mcpchecker
          image: ${IMAGE}
          imagePullPolicy: Always
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail

              mkdir -p /tmp/tasks
              envsubst < /opt/suites/mcp/default/eval.yaml > /tmp/eval.yaml
              cp /opt/suites/mcp/default/tasks/*.yaml /tmp/tasks/
              envsubst < /opt/suites/mcp/default/mcp-config.yaml > /tmp/mcp-config.yaml

              cd /tmp
              mcpchecker check eval.yaml \
                --mcp-config-file mcp-config.yaml \
                -o json || echo "mcpchecker exited with code $?"
          workingDir: /tmp
          env:
            - name: HOME
              value: /tmp
            - name: MCP_URL
              value: "${MCP_URL}"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ${AGENT_SECRET}
                  key: openai-api-key
            - name: OPENAI_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: ${AGENT_SECRET}
                  key: openai-base-url
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ${AGENT_SECRET}
                  key: anthropic-api-key
            - name: ANTHROPIC_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: ${AGENT_SECRET}
                  key: anthropic-base-url
            - name: AGENT_LLM_MODEL
              valueFrom:
                secretKeyRef:
                  name: ${AGENT_SECRET}
                  key: model-name
            - name: JUDGE_LLM_MODEL
              valueFrom:
                secretKeyRef:
                  name: ${JUDGE_SECRET}
                  key: model-name
