# Dedicated MLflow artifact + sqlite store for Agentic Eval Flow.
# Apply into the target namespace (default matches shared cluster config):
#   oc apply -n <namespace> -f config/mlflow/
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: abevalflow-mlflow-data
  labels:
    app.kubernetes.io/part-of: abevalflow
    app.kubernetes.io/name: mlflow
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  # Omit storageClassName so the cluster default applies. Uncomment/adjust
  # for a specific class (e.g. AWS EBS gp3):
  # storageClassName: gp3
