apiVersion: batch/v1
kind: CronJob
metadata:
  name: mcp-evidence-recovery
spec:
  schedule: '*/5 * * * *'
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          serviceAccountName: mcp-lifecycle
          restartPolicy: Never
          containers:
          - name: recover
            image: image-registry.openshift-image-registry.svc:5000/ab-eval-flow/harbor-mcp-ci@sha256:734aab23853c5e42ca152614f3562b6e22fabc258caa8af8e537d9e6700399a3
            command:
            - python
            - -m
            - abevalflow.mcp_ci
            - sweep
            - --image
            - image-registry.openshift-image-registry.svc:5000/ab-eval-flow/harbor-mcp-ci@sha256:734aab23853c5e42ca152614f3562b6e22fabc258caa8af8e537d9e6700399a3
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
            env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
  suspend: true
