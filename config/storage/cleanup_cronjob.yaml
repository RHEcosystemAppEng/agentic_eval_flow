apiVersion: batch/v1
kind: CronJob
metadata:
  name: abevalflow-cleanup
  labels:
    app.kubernetes.io/part-of: abevalflow
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: pipeline
          restartPolicy: OnFailure
          containers:
            - name: cleanup
              image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
              command: ["/bin/bash", "/scripts/cleanup.sh"]
              env:
                - name: NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: POD_AGE_HOURS
                  value: "24"
                - name: PIPELINERUN_KEEP_COUNT
                  value: "7"
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "200m"
                  memory: "128Mi"
              securityContext:
                runAsNonRoot: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: scripts
              configMap:
                name: cleanup-script
                defaultMode: 0755

# NOTE: The cleanup-script ConfigMap is NOT bundled in this file.
# Create it from the canonical script before applying this CronJob:
#
#   oc create configmap cleanup-script \
#     --from-file=cleanup.sh=scripts/cleanup.sh \
#     -n <namespace> --dry-run=client -o yaml | oc apply -f -
