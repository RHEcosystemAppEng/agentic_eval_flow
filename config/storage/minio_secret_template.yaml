apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: ab-eval-flow
  labels:
    app.kubernetes.io/part-of: abevalflow
    app.kubernetes.io/name: minio
type: Opaque
stringData:
  root-user: "<replace-with-access-key>"
  root-password: "<replace-with-secret-key>"
  endpoint-url: "http://minio.ab-eval-flow.svc:9000"
  # Optional. Set to "1" only when endpoint-url above is reached through a
  # Route/Ingress presenting a self-signed or internal-CA certificate (e.g.
  # an OpenShift cluster's default router cert) -- skips TLS cert
  # verification for the minio SDK client in the CLI S3 publisher.
  # insecure-skip-tls-verify: "1"
