apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: gz-forge-eval
  labels:
    app.kubernetes.io/part-of: abevalflow
    app.kubernetes.io/name: litellm
data:
  config.yaml: |
    model_list:
      - model_name: rits/zai-org/glm-5-3
        litellm_params:
          model: openai/rits/zai-org/glm-5-3
          api_base: os.environ/INFERENCE_ENDPOINT_URL
          api_key: os.environ/INFERENCE_API_KEY
      - model_name: rits/zai-org/GLM-5-3-Flash
        litellm_params:
          model: openai/rits/zai-org/GLM-5-3-Flash
          api_base: os.environ/INFERENCE_ENDPOINT_URL
          api_key: os.environ/INFERENCE_API_KEY

    litellm_settings:
      drop_params: true
      set_verbose: false
      num_retries: 2
      request_timeout: 120

    general_settings:
      # Internal-only proxy; upstream authentication is supplied by inference.
