apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: gz-forge-eval
  labels:
    app.kubernetes.io/part-of: abevalflow
    app.kubernetes.io/name: litellm
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm
        app.kubernetes.io/part-of: abevalflow
    spec:
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-latest
          ports:
            - containerPort: 4000
              name: http
          args:
            - "--config"
            - "/app/config/config.yaml"
            - "--port"
            - "4000"
          env:
            - name: INFERENCE_ENDPOINT_URL
              valueFrom:
                secretKeyRef:
                  name: inference
                  key: endpoint_url
            - name: INFERENCE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: inference
                  key: api_key
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 30
            timeoutSeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 45
            timeoutSeconds: 5
            periodSeconds: 30
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: config
          configMap:
            name: litellm-config
