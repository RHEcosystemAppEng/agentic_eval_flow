# NetworkPolicies for OpenShell OpenClaw evals when SAW VMs and the Tekton
# pipeline share one namespace (Forge workspace style).
#
# Select evaluate pods by either:
#   - tekton.dev/pipeline=abevalflow-pipeline-openshell  (canonical Pipeline name)
#   - app.kubernetes.io/part-of=abevalflow               (set on PipelineRun labels)
#
# Do NOT rename/copy the Pipeline to an ad-hoc name without also labeling the
# PipelineRun with app.kubernetes.io/part-of=abevalflow — otherwise default-deny
# blocks TCP to the gateway on :17670 and evaluate fails preflight.
#
# Apply after substituting NAMESPACE (and AGENT_VM / INTEG_VM if different):
#   sed "s/NAMESPACE/forge-nommen/g" networkpolicy-ci-openshell.yaml | oc apply -f -
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: abevalflow-allow-ci-agent-gateway
  namespace: NAMESPACE
  labels:
    app.kubernetes.io/part-of: abevalflow
    app.kubernetes.io/component: forge-saw
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openshell-saw-agent
      vm.kubevirt.io/name: openshell-saw-agent
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              tekton.dev/pipeline: abevalflow-pipeline-openshell
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: abevalflow
      ports:
        - protocol: TCP
          port: 17670
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: abevalflow-allow-ci-integ-gateway
  namespace: NAMESPACE
  labels:
    app.kubernetes.io/part-of: abevalflow
    app.kubernetes.io/component: forge-saw
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openshell-saw-integ
      vm.kubevirt.io/name: openshell-saw-integ
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              tekton.dev/pipeline: abevalflow-pipeline-openshell
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: abevalflow
      ports:
        - protocol: TCP
          port: 17670
        - protocol: TCP
          port: 18082
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: abevalflow-allow-ci-egress-by-pipeline
  namespace: NAMESPACE
  labels:
    app.kubernetes.io/part-of: abevalflow
    app.kubernetes.io/component: forge-saw
spec:
  podSelector:
    matchLabels:
      tekton.dev/pipeline: abevalflow-pipeline-openshell
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openshell-saw-agent
              vm.kubevirt.io/name: openshell-saw-agent
      ports:
        - protocol: TCP
          port: 17670
        - protocol: TCP
          port: 8443
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openshell-saw-integ
              vm.kubevirt.io/name: openshell-saw-integ
      ports:
        - protocol: TCP
          port: 17670
        - protocol: TCP
          port: 18082
        - protocol: TCP
          port: 8443
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      ports:
        - protocol: TCP
          port: 4000
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mlflow
              app.kubernetes.io/part-of: abevalflow
      ports:
        - protocol: TCP
          port: 5000
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: minio
              app.kubernetes.io/part-of: abevalflow
      ports:
        - protocol: TCP
          port: 9000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 5353
        - protocol: TCP
          port: 5353
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: abevalflow-allow-ci-egress-by-part-of
  namespace: NAMESPACE
  labels:
    app.kubernetes.io/part-of: abevalflow
    app.kubernetes.io/component: forge-saw
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: abevalflow
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openshell-saw-agent
              vm.kubevirt.io/name: openshell-saw-agent
      ports:
        - protocol: TCP
          port: 17670
        - protocol: TCP
          port: 8443
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openshell-saw-integ
              vm.kubevirt.io/name: openshell-saw-integ
      ports:
        - protocol: TCP
          port: 17670
        - protocol: TCP
          port: 18082
        - protocol: TCP
          port: 8443
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      ports:
        - protocol: TCP
          port: 4000
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mlflow
              app.kubernetes.io/part-of: abevalflow
      ports:
        - protocol: TCP
          port: 5000
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: minio
              app.kubernetes.io/part-of: abevalflow
      ports:
        - protocol: TCP
          port: 9000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 5353
        - protocol: TCP
          port: 5353
