# Allow evaluate Task pods to reach the OpenShell gateway on :17670.
# bootstrap.sh rewrites namespace / from-namespace (SAW_NS, EVAL_NS).
# Apply in the SAW namespace, not from the evaluate PipelineRun.
#
# Prefer matching Tekton pods by the canonical Pipeline name or the
# app.kubernetes.io/part-of=abevalflow label on PipelineRuns. A bare
# podSelector: {} from the whole EVAL_NS is broader than needed when SAW
# and eval share a Forge workspace namespace — see networkpolicy-ci-openshell.yaml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-from-abeval
  namespace: guy-ziv-evalflow
  labels:
    app.kubernetes.io/part-of: abevalflow
    app.kubernetes.io/component: forge-saw
spec:
  podSelector:
    matchLabels:
      vm.kubevirt.io/name: abeval-saw
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: guy-ziv-evalflow
          podSelector:
            matchLabels:
              tekton.dev/pipeline: abevalflow-pipeline-openshell
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: guy-ziv-evalflow
          podSelector:
            matchLabels:
              app.kubernetes.io/part-of: abevalflow
      ports:
        - protocol: TCP
          port: 17670
