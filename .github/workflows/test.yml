name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install uv
          uv sync --locked --extra dev --extra observability

      - name: Run tests, coverage, and lint
        run: make test

      - name: Verify unchanged upstream AEH integration
        run: |
          uv run --locked abeval runtime install --directory /tmp/abeval-aeh
          ABEVAL_TEST_AEH_ROOT=/tmp/abeval-aeh/source uv run --locked --extra dev pytest tests/test_native_aeh.py -q

      - name: Build and verify standalone wheel
        run: |
          uv build
          uv venv /tmp/abeval-wheel --python 3.12
          uv pip install --python /tmp/abeval-wheel/bin/python dist/*.whl
          cd /tmp
          /tmp/abeval-wheel/bin/abeval --version
          /tmp/abeval-wheel/bin/abeval validate skill "$GITHUB_WORKSPACE/submissions/aeh-pairwise-example/skills/aeh-pairwise-example"
          /tmp/abeval-wheel/bin/python -c "from abevalflow.certification import get_available_profiles; assert 'skill' in get_available_profiles()"
          skill="$GITHUB_WORKSPACE/submissions/aeh-pairwise-example/skills/aeh-pairwise-example"
          env PATH=/usr/bin:/bin /tmp/abeval-wheel/bin/abeval run "$skill" --source "$skill" --output /tmp/abeval-tier1 > /tmp/abeval-tier1.json || test "$?" -eq 1
          /tmp/abeval-wheel/bin/python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/abeval-tier1.json').read_text())
          assert result['exit_code'] in (0, 1), result
          assert {s['name'] for s in result['steps']} == {'prepare', 'structure', 'security', 'quality', 'report'}
          assert all(s['status'] == 'completed' for s in result['steps']), result
          PY
