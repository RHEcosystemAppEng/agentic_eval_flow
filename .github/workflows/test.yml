name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install uv
          uv sync --locked --extra dev --extra observability

      - name: Run linter (ruff)
        run: |
          uv run --locked --extra dev --extra observability ruff check abevalflow/ scripts/ tests/ containers/
          uv run --locked --extra dev --extra observability ruff format --check abevalflow/ scripts/ tests/ containers/

      - name: Run tests
        run: uv run --locked --extra dev --extra observability pytest tests/ -v --tb=short
