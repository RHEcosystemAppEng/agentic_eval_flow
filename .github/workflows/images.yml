name: Build runtime images

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [agent-eval-harness, aeh-trial]
    steps:
      - uses: actions/checkout@v4
      - name: Build and check image
        run: make "${{ matrix.image }}" IMAGE_REPOSITORY=localhost/aeh-ci VERSION=check

      - name: Verify installed application
        if: matrix.image != 'aeh-trial'
        run: |
          purpose="${{ matrix.image }}"
          case "$purpose" in
            agent-eval-harness) purpose=runner ;;
          esac
          podman run --rm "localhost/aeh-ci:check-${purpose}" abeval --version

      - name: Verify task generation
        if: matrix.image == 'agent-eval-harness'
        run: |
          podman run --rm --network=none -v "$PWD/submissions:/input:ro" localhost/aeh-ci:check-runner \
            python3 -c 'from pathlib import Path; from abevalflow.execution.harbor import HarborRunner; r=HarborRunner(model="test-model",image="trial:test"); r._prepare_enriched_tasks(Path("/input/aeh-pairwise-example/eval-treatment.yaml"),Path("/tmp/tasks")); assert list(Path("/tmp/tasks").glob("*/task.toml"))'
