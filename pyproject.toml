[project]
name = "abevalflow"
version = "0.7.1"
description = "Installable skill validation and AEH evaluation workflows"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "cisco-ai-skill-scanner==2.3.1",
    "harness-eval==8.0.1",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "tenacity>=8.2",
    "tomli-w>=1.1,<2",
]

[project.scripts]
abeval = "abevalflow.cli.main:main"

[project.optional-dependencies]
llm = ["openai>=1.0"]
storage = ["sqlalchemy>=2.0", "psycopg[binary]>=3.1", "minio>=7.0"]
runner = [
    "harbor==0.25.0",
    "kubernetes>=32.0.0,<37",
    "anthropic[vertex]",
    "jinja2>=3.1",
    "truststore>=0.9,<1",
]
all = ["abevalflow[llm,storage,runner,observability]"]
observability = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20",
]
dev = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "minio>=7.0",
    "openai>=1.0",
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[tool.hatch.build.targets.wheel]
packages = ["abevalflow"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
