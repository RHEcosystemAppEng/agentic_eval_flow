[project]
name = "abevalflow"
version = "0.1.0"
description = "Automated Tekton pipeline on OpenShift for A/B evaluation of AI submissions"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "scipy>=1.11",
    "seaborn>=0.13",
    "kubernetes>=28.0",
    "tenacity>=8.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "minio>=7.0",
    "openai>=1.0",
    "tomlkit>=0.13",
]

[project.optional-dependencies]
observability = [
    "mlflow>=3.17.2",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.45.1",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "httpx>=0.27",  # scripts/pyrit_crescendo unit tests
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E402"]  # Allow imports after registry setup in __init__.py

[tool.hatch.build.targets.wheel]
packages = ["abevalflow"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
