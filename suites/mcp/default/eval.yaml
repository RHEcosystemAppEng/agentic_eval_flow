# Default MCP Behavioral Evaluation Configuration
#
# Generic task suite for Phase 3 behavioral testing of any MCP server.
# These tests are server-agnostic: they discover tools dynamically
# and verify general behavioral properties (correctness, error handling,
# data redaction) without assuming specific tool names or schemas.
#
# Used by the mcp-behavioral-eval pipeline task. Model and timeout
# values are overridden by pipeline parameters at runtime.

apiVersion: mcpchecker/v1
kind: Eval
metadata:
  name: mcp-behavioral-eval
  description: >-
    Generic behavioral evaluation for MCP servers. Covers tool correctness,
    edge-case handling, and sensitive data redaction per the MCP Server
    Evaluation ADR Phase 3 specification.

spec:
  agent:
    model: ${AGENT_LLM_MODEL}
    temperature: 0.0

  judge:
    model: ${JUDGE_LLM_MODEL}

  taskTimeout: 300

  tasks:
    - tasks/tool-correctness.yaml
    - tasks/edge-case-handling.yaml
    - tasks/sensitive-data-redaction.yaml
