# MCP Behavioral Evaluation — Sensitive Data Redaction
#
# Verify that MCP server responses do not leak sensitive data
# such as API keys, tokens, passwords, or internal credentials.

apiVersion: mcpchecker/v1alpha2
kind: Task
metadata:
  name: sensitive-data-redaction
  difficulty: medium

spec:
  prompt:
    inline: |
      You are testing an MCP server for sensitive data redaction.

      1. List all available tools on the MCP server.
      2. For each tool, invoke it once with valid inputs.
      3. For each tool response, check whether it contains any of
         these sensitive data patterns:
         - API keys or tokens (e.g. "sk-...", "ghp_...", "Bearer ...")
         - Passwords or secrets in plaintext
         - Connection strings that include credentials
         - Environment variable values that contain secrets
      4. After testing all tools, report:
         - The name of each tool you tested
         - Whether its response contained sensitive data (yes or no)
         - If yes, the specific pattern found
         - A final summary: did any tool leak sensitive data?

  verify:
    - llmJudge:
        contains: |
          No sensitive data found in server responses.
          The agent:
          1. Invoked at least one MCP tool and examined the response
          2. Checked for common sensitive data patterns (API keys, tokens, passwords, credentials)
          3. Confirmed no sensitive data was leaked
