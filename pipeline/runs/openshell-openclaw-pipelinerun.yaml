# OpenShell OpenClaw profile — prepare → evaluate → analyze → store (no test cube).
# Apply the Pipeline first: oc apply -f pipeline/pipelines/ci-pipeline-openshell.yaml
# Do not put M365 tokens in this file; use Secret openshell-credentials in the namespace.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: aeh-openshell-openclaw-
  labels:
    # Required when NetworkPolicies select on part-of (and recommended always).
    # Keep pipelineRef.name=abevalflow-pipeline-openshell so tekton.dev/pipeline
    # also matches the canonical CI NetworkPolicies.
    app.kubernetes.io/part-of: abevalflow
spec:
  pipelineRef:
    name: abevalflow-pipeline-openshell
  params:
    # [Optional] Add a submission repository for this run; this replaces the deployed Pipeline default.
    # - name: repo-url
    #   value: "<submission-repo-url>"
    - name: submission-dir
      value: "openclaw-forge"
    - name: eval-engine
      value: "aeh_openshell_openclaw"
    # This example targets the merged upstream main for both submission and
    # Pipeline helper source. Replace either value with a commit SHA to pin a run.
    - name: revision
      value: "main"
    - name: pipeline-repo-revision
      value: "main"
    # [Optional] Add a harness repository or revision for this run; these replace Pipeline defaults.
    # - name: agent-eval-harness-repo-url
    #   value: "<harness-repo-url>"
    # - name: agent-eval-harness-repo-revision
    #   value: "<harness-commit-or-branch>"
    - name: openshell-gateway-endpoint
      # Certificate-valid hostname, resolved to this namespace's Service below.
      value: "https://host.containers.internal:17670"
    - name: openshell-mtls-secret
      value: "openshell-gateway-mtls"
    - name: openshell-ai-gateway-ca-secret
      value: "forge-agent-upstream-tls"
    # To use another sandbox image, replace the value below with <image@sha256:digest>.
    - name: openshell-sandbox-image
      value: "ghcr.io/rh-forge/openclaw-saw-agent@sha256:b47b92a6b3fd03327c1f2093a5c28aba0fdf3cb620e9154335688900191fe2b9"
    - name: openshell-provider
      value: "forge-ai-gateway,m365-read-intervm,slack-read-proxy,drafts-service-agent"
    - name: aeh-openshell-image
      value: "registry.access.redhat.com/ubi9/python-311:9.6"
    - name: llm-model
      value: "rits/zai-org/glm-5-3"
    - name: llm-api-base
      value: "http://litellm.gz-forge-eval.svc.cluster.local:4000"
    - name: llm-api-key
      value: "mock"
    - name: aeh-model-override
      value: "inference/rits/zai-org/glm-5-3"
    - name: aeh-judge-model-override
      value: "rits/zai-org/glm-5-3"
    - name: enable-mlflow
      value: "true"
    - name: mlflow-tracking-uri
      value: "http://abevalflow-mlflow.gz-forge-eval.svc.cluster.local:5000"
  taskRunTemplate:
    serviceAccountName: pipeline
    podTemplate:
      hostAliases:
        - ip: "172.30.183.80"
          hostnames: ["host.containers.internal"]
  timeouts:
    pipeline: 2h0m0s
    tasks: 1h30m0s
  workspaces:
    - name: shared-workspace
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 5Gi
