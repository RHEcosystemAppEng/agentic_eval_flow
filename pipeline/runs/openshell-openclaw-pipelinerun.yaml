# OpenShell OpenClaw profile — prepare → evaluate → analyze → store (no test cube).
# Apply the Pipeline first: oc apply -f pipeline/pipelines/ci-pipeline-openshell.yaml
# Do not put M365 tokens in this file; use Secret openshell-credentials in the namespace.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: aeh-openshell-openclaw-
spec:
  pipelineRef:
    name: abevalflow-pipeline-openshell
  params:
    - name: submission-dir
      value: "openclaw-forge"
    - name: eval-engine
      value: "aeh_openshell_openclaw"
    # Until this branch is merged, pass the feature revision so store/parse scripts match.
    # After merge to main, omit these (Pipeline defaults are main).
    - name: revision
      value: "feat/aeh-openshell-openclaw"
    - name: pipeline-repo-revision
      value: "feat/aeh-openshell-openclaw"
    - name: openshell-gateway-endpoint
      # Certificate-valid hostname, resolved to this namespace's Service below.
      value: "https://host.containers.internal:17670"
    - name: openshell-mtls-secret
      value: "openshell-gateway-mtls"
    - name: openshell-ai-gateway-ca-secret
      value: "forge-agent-upstream-tls"
    - name: openshell-sandbox-image
      value: "ghcr.io/rh-forge/openclaw-saw-agent@sha256:bcc55e9b7a36d5f65e8ffc75962496f8b3617762a4cdb37fd1cf54611b72d41a"
    - name: openshell-provider
      value: "forge-ai-gateway,m365-read-intervm,slack-read-proxy,drafts-service-agent"
    - name: aeh-openshell-image
      value: "registry.access.redhat.com/ubi9/python-311:9.6"
    - name: llm-model
      value: "rits/zai-org/glm-5-3"
    - name: llm-api-base
      value: "http://litellm.gz-forge-eval.svc.cluster.local:4000"
    - name: llm-api-key
      value: "mock"
    - name: aeh-model-override
      value: "inference/rits/zai-org/glm-5-3"
    - name: aeh-judge-model-override
      value: "rits/zai-org/glm-5-3"
    - name: enable-mlflow
      value: "true"
    - name: mlflow-tracking-uri
      value: "http://abevalflow-mlflow.gz-forge-eval.svc.cluster.local:5000"
  taskRunTemplate:
    serviceAccountName: pipeline
    podTemplate:
      hostAliases:
        - ip: "172.30.183.80"
          hostnames: ["host.containers.internal"]
  timeouts:
    pipeline: 2h0m0s
    tasks: 1h30m0s
  workspaces:
    - name: shared-workspace
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 5Gi
