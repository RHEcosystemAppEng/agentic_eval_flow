# OpenShell OpenClaw profile — prepare → evaluate → analyze → store (no test cube).
#
#   oc apply  -n <namespace> -f pipeline/pipelines/ci-pipeline-openshell.yaml
#   oc create -n <namespace> -f pipeline/runs/openshell-openclaw-pipelinerun.yaml
#
# Service endpoints below use short names, which resolve inside the namespace
# the run is created in, so this file is namespace-agnostic. Change
# openshell-gateway-endpoint to <your-helm-release>-gateway.
# Do not put M365 tokens in this file; use Secret openshell-credentials in the namespace.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: aeh-openshell-openclaw-
spec:
  pipelineRef:
    name: abevalflow-pipeline-openshell
  params:
    - name: submission-dir
      value: "openclaw-forge"
    - name: eval-engine
      value: "aeh_openshell_openclaw"
    # Until this branch is merged, pass the feature revision so store/parse scripts match.
    # After merge to main, omit these (Pipeline defaults are main).
    - name: revision
      value: "feat/aeh-openshell-openclaw"
    - name: pipeline-repo-revision
      value: "feat/aeh-openshell-openclaw"
    - name: openshell-gateway-endpoint
      # Use the namespace-local SAW gateway with OIDC + mTLS.
      value: "https://saw-gateway:17670"   # <helm-release>-gateway
    - name: openshell-sandbox-image
      value: "ghcr.io/rh-forge/openclaw-saw-agent@sha256:bcc55e9b7a36d5f65e8ffc75962496f8b3617762a4cdb37fd1cf54611b72d41a"
    - name: openshell-provider
      value: ""   # saw-bom providers; empty on a standalone eval gateway
    - name: aeh-openshell-image
      value: "registry.access.redhat.com/ubi9/python-311:9.6"
    - name: llm-model
      value: "rits/zai-org/glm-5-3"
    - name: llm-api-base
      value: "http://litellm:4000"
    - name: llm-api-key
      value: "mock"
    - name: aeh-model-override
      value: ""   # inherit models.skill from the submission
    - name: aeh-judge-model-override
      value: "rits/zai-org/glm-5-3"
    - name: enable-mlflow
      value: "true"
    - name: mlflow-tracking-uri
      value: "http://abevalflow-mlflow:5000"
  taskRunTemplate:
    serviceAccountName: pipeline
  timeouts:
    pipeline: 2h0m0s
    tasks: 1h30m0s
  workspaces:
    - name: shared-workspace
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 5Gi
