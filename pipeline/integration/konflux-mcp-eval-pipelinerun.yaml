# MCP Server Deployment Pipeline for Konflux
#
# Deploys an MCP server into an ephemeral namespace on a remote target
# cluster, waits for readiness, and reports status.
#
# The target cluster is separate from the Konflux build cluster.
# A kubeconfig Secret must exist in the Konflux namespace to allow
# the pipeline tasks to reach the target cluster.
#
# Pipeline stages:
#   parse-snapshot → fetch-mcp-repo → mcp-static-eval ──────────────┐
#   parse-snapshot → create-namespace → deploy-mcp → wait-ready     │
#     → mcp-conformance-eval → mcp-behavioral-eval ─────────────────┤
#   all evals ──→ generate-compass-facts → publish-to-compass
#   finally: teardown-namespace
#
# PREREQUISITES:
#   1. Secret "mcp-eval-target-kubeconfig" in the Konflux tenant namespace
#      containing the kubeconfig for the target cluster (key: "kubeconfig")
#   2. ClusterRole "mcp-eval-namespace-manager" on the TARGET cluster
#      bound to the ServiceAccount referenced in the kubeconfig
#   3. (Optional) Credentials Secret on the target cluster if the MCP
#      server requires backend auth — see CREDENTIALS_SECRET param
#   4. Secrets "mcp-eval-llm-agent" and "mcp-eval-llm-judge" in the
#      default namespace on the TARGET cluster, each containing api-key
#      and endpoint for the respective LLM model (behavioral
#      evaluation).
#   5. VPN connectivity between Konflux cluster and target cluster
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: abevalflow-mcp-eval
spec:
  taskRunSpecs:
    - pipelineTaskName: check-label
      podTemplate:
        env:
          - name: CONTEXT_PR_NUMBER
            valueFrom:
              fieldRef:
                fieldPath: metadata.labels['pac.test.appstudio.openshift.io/pull-request']
  timeouts:
    pipeline: "1h"
    tasks: "45m"
  pipelineSpec:
    params:
      # === Konflux integration ===
      - name: SNAPSHOT
        type: string
        description: Konflux Snapshot JSON with component details (provided automatically)

      # === MCP server deployment ===
      - name: HELM_CHART_PATH
        type: string
        default: "chart"
        description: Path to the Helm chart directory within the MCP server repo
      - name: VALUES_TEST_PATH
        type: string
        default: "values-test.yaml"
        description: Path to the test values file within the MCP server repo
      - name: SERVICE_NAME
        type: string
        default: "mcp-server"
        description: Kubernetes Service name for the deployed MCP server
      - name: SERVICE_PORT
        type: string
        default: "8080"
        description: Port on which the MCP server listens
      - name: READINESS_TIMEOUT
        type: string
        default: "120"
        description: Maximum seconds to wait for MCP server readiness
      - name: CREDENTIALS_SECRETS
        type: string
        default: ""
        description: >-
          Comma-separated names of Secrets in the Konflux namespace to
          copy into the ephemeral namespace (e.g. backend API keys).
          If empty, only the image pull secret is copied.
      - name: BACKEND_ENDPOINTS
        type: string
        default: ""
        description: >-
          Comma-separated host:port pairs for sandbox backend endpoints
          allowed through the namespace NetworkPolicy.
      - name: IMAGE_KEY
        type: string
        default: "image.repository"
        description: Helm value key for the container image repository
      - name: IMAGE_REF_KEY
        type: string
        default: "image.ref"
        description: Helm value key for the container image ref (tag or digest)
      - name: IMAGE_PULL_SECRET
        type: string
        default: "image-pull-secret"
        description: >-
          Name of the image pull Secret in the Konflux namespace to copy
          into the ephemeral namespace for registry authentication.

      # === MCP Behavioral evaluation ===
      - name: JOB_TIMEOUT
        type: string
        default: "1800"
        description: Timeout in seconds for the mcpchecker Job
      - name: PASS_THRESHOLD
        type: string
        default: "0.7"
        description: Minimum overall score (0.0–1.0) for a pass recommendation
      - name: LLM_AGENT_SECRET
        type: string
        default: "mcp-eval-llm-agent"
        description: >-
          Name of the Secret on the target cluster (in the default
          namespace) containing the agent LLM api-key, endpoint, and model.
      - name: LLM_JUDGE_SECRET
        type: string
        default: "mcp-eval-llm-judge"
        description: >-
          Name of the Secret on the target cluster (in the default
          namespace) containing the judge LLM model name. Credentials
          come from the agent secret.
      - name: MCP_EVAL_IMAGE
        type: string
        default: "quay.io/ecosystem-appeng/konflux-skill-evaluation/abevalflow-mcp-eval:0.1"
        description: >-
          MCP eval image with mcpchecker binary, task suite files, and
          aggregation scripts baked in.
      - name: MCPCHECKER_LABEL
        type: string
        default: "mcpchecker"
        description: PR label that enables the MCP behavioral evaluation task

      # === Compass SoundCheck publishing ===
      - name: COMPASS_DRY_RUN
        type: string
        default: "false"
        description: >-
          Set to "false" to publish facts to Compass. Default is dry-run.

    workspaces:
      - name: shared-workspace
      - name: target-kubeconfig
        description: >-
          Workspace backed by the kubeconfig Secret for the target cluster.
          Mounted read-only into tasks that interact with the remote cluster.
    tasks:
      # ================================================================
      # Stage 1: Parse the Konflux Snapshot
      # ================================================================
      - name: parse-snapshot
        taskRef:
          resolver: bundles
          params:
            - name: name
              value: parse-snapshot
            - name: bundle
              value: quay.io/ecosystem-appeng/konflux-skill-evaluation/parse-snapshot:0.1.0
            - name: kind
              value: task
        params:
          - name: SNAPSHOT
            value: $(params.SNAPSHOT)

      # ================================================================
      # Stage 2: Fetch MCP server source repository
      # ================================================================
      - name: fetch-mcp-repo
        runAfter: [parse-snapshot]
        taskRef:
          resolver: cluster
          params:
            - name: name
              value: git-clone
            - name: namespace
              value: openshift-pipelines
            - name: kind
              value: task
        params:
          - name: URL
            value: $(tasks.parse-snapshot.results.git-url)
          - name: REVISION
            value: $(tasks.parse-snapshot.results.git-revision)
          - name: SSL_VERIFY
            value: "false"
        workspaces:
          - name: output
            workspace: shared-workspace
            subPath: mcp-server-repo

      # ================================================================
      # Stage 3: MCP Static Evaluation
      # ================================================================
      - name: mcp-static-eval
        runAfter: [fetch-mcp-repo]
        taskRef:
          resolver: bundles
          params:
            - name: name
              value: mcp-static-eval
            - name: bundle
              value: quay.io/ecosystem-appeng/konflux-skill-evaluation/mcp-static-eval:0.1.0
            - name: kind
              value: task
        params:
          - name: mcp-eval-image
            value: $(params.MCP_EVAL_IMAGE)
          - name: mode
            value: "block"
        workspaces:
          - name: source
            workspace: shared-workspace

      # ================================================================
      # Stage 4: Create ephemeral namespace on target cluster
      # ================================================================
      - name: create-namespace
        runAfter: [parse-snapshot]
        taskRef:
          resolver: bundles
          params:
            - name: name
              value: create-namespace
            - name: bundle
              value: quay.io/ecosystem-appeng/konflux-skill-evaluation/create-namespace:0.1.0
            - name: kind
              value: task
        params:
          - name: pipeline-run-id
            value: $(context.pipelineRun.name)
          - name: backend-endpoints
            value: $(params.BACKEND_ENDPOINTS)
        workspaces:
          - name: target-kubeconfig
            workspace: target-kubeconfig

      # ================================================================
      # Stage 5: Deploy MCP server into ephemeral namespace
      # ================================================================
      - name: deploy-mcp
        runAfter: [fetch-mcp-repo, create-namespace]
        taskRef:
          resolver: bundles
          params:
            - name: name
              value: deploy-mcp
            - name: bundle
              value: quay.io/ecosystem-appeng/konflux-skill-evaluation/deploy-mcp:0.1.0
            - name: kind
              value: task
        params:
          - name: namespace-name
            value: $(tasks.create-namespace.results.namespace-name)
          - name: component-image
            value: $(tasks.parse-snapshot.results.component-image)
          - name: helm-chart-path
            value: $(params.HELM_CHART_PATH)
          - name: values-test-path
            value: $(params.VALUES_TEST_PATH)
          - name: service-name
            value: $(params.SERVICE_NAME)
          - name: service-port
            value: $(params.SERVICE_PORT)
          - name: credentials-secrets
            value: $(params.CREDENTIALS_SECRETS)
          - name: image-key
            value: $(params.IMAGE_KEY)
          - name: image-ref-key
            value: $(params.IMAGE_REF_KEY)
          - name: image-pull-secret
            value: $(params.IMAGE_PULL_SECRET)
        workspaces:
          - name: source
            workspace: shared-workspace
          - name: target-kubeconfig
            workspace: target-kubeconfig

      # ================================================================
      # Stage 6: Wait for MCP server readiness
      # ================================================================
      - name: wait-ready
        runAfter: [deploy-mcp]
        taskRef:
          resolver: bundles
          params:
            - name: name
              value: wait-ready
            - name: bundle
              value: quay.io/ecosystem-appeng/konflux-skill-evaluation/wait-ready:0.1.0
            - name: kind
              value: task
        params:
          - name: namespace-name
            value: $(tasks.create-namespace.results.namespace-name)
          - name: readiness-timeout
            value: $(params.READINESS_TIMEOUT)
        workspaces:
          - name: target-kubeconfig
            workspace: target-kubeconfig

      # ================================================================
      # Stage 7: MCP Conformance Evaluation
      # ================================================================
      - name: mcp-conformance-eval
        runAfter: [wait-ready]
        taskRef:
          resolver: bundles
          params:
            - name: name
              value: mcp-conformance-eval
            - name: bundle
              value: quay.io/ecosystem-appeng/konflux-skill-evaluation/mcp-conformance-eval:0.1.0
            - name: kind
              value: task
        params:
          - name: mcp-eval-image
            value: $(params.MCP_EVAL_IMAGE)
          - name: namespace-name
            value: $(tasks.create-namespace.results.namespace-name)
          - name: service-name
            value: $(params.SERVICE_NAME)
          - name: service-port
            value: $(params.SERVICE_PORT)
          - name: mode
            value: "block"
          - name: timeout
            value: "30"
        workspaces:
          - name: source
            workspace: shared-workspace
          - name: target-kubeconfig
            workspace: target-kubeconfig

      # ================================================================
      # Stage 7b: Check whether the gating PR label is present
      # ================================================================
      - name: check-label
        runAfter: [parse-snapshot]
        taskRef:
          resolver: bundles
          params:
            - name: name
              value: check-label
            - name: bundle
              value: quay.io/ecosystem-appeng/konflux-skill-evaluation/check-label:0.2.0@sha256:b8e8679e310a12bcd30e33936344321a52a71b11b52e5c63a94c9db5cc306edb
            - name: kind
              value: task
        params:
          - name: git-url
            value: $(tasks.parse-snapshot.results.git-url)
          - name: git-revision
            value: $(tasks.parse-snapshot.results.git-revision)
          - name: target-label
            value: $(params.MCPCHECKER_LABEL)

      # ================================================================
      # Stage 8: MCP Behavioral Evaluation (mcpchecker)
      # ================================================================
      - name: mcp-behavioral-eval
        runAfter: [wait-ready, check-label]
        when:
          - input: "$(tasks.check-label.results.has-label)"
            operator: in
            values: ["true"]
        taskRef:
          resolver: bundles
          params:
            - name: name
              value: mcp-behavioral-eval
            - name: bundle
              value: quay.io/ecosystem-appeng/konflux-skill-evaluation/mcp-behavioral-eval:0.1.0
            - name: kind
              value: task
        params:
          - name: namespace-name
            value: $(tasks.create-namespace.results.namespace-name)
          - name: service-name
            value: $(params.SERVICE_NAME)
          - name: service-port
            value: $(params.SERVICE_PORT)
          - name: job-timeout
            value: $(params.JOB_TIMEOUT)
          - name: pass-threshold
            value: $(params.PASS_THRESHOLD)
          - name: llm-agent-secret
            value: $(params.LLM_AGENT_SECRET)
          - name: llm-judge-secret
            value: $(params.LLM_JUDGE_SECRET)
          - name: mcp-eval-image
            value: $(params.MCP_EVAL_IMAGE)
          - name: pipeline-run-id
            value: $(context.pipelineRun.name)
          - name: submission-name
            value: $(tasks.parse-snapshot.results.component-name)
        workspaces:
          - name: source
            workspace: shared-workspace
          - name: target-kubeconfig
            workspace: target-kubeconfig

      # ================================================================
      # Stage 9: Generate Compass fact payloads from phase summaries
      # ================================================================
      - name: generate-compass-facts
        runAfter: [mcp-static-eval, mcp-conformance-eval, mcp-behavioral-eval]
        taskRef:
          resolver: bundles
          params:
            - name: name
              value: generate-compass-facts
            - name: bundle
              value: quay.io/ecosystem-appeng/konflux-skill-evaluation/generate-compass-facts:0.1.0
            - name: kind
              value: task
        params:
          - name: mcp-eval-image
            value: $(params.MCP_EVAL_IMAGE)
          - name: component-name
            value: $(tasks.parse-snapshot.results.component-name)
        workspaces:
          - name: source
            workspace: shared-workspace

      # ================================================================
      # Stage 9b: Debug - Print facts and reports directory contents
      # ================================================================
      - name: debug-print-facts-reports
        runAfter: [generate-compass-facts]
        taskSpec:
          workspaces:
            - name: source
          steps:
            - name: print-directory-tree
              image: $(params.MCP_EVAL_IMAGE)
              script: |
                #!/bin/bash
                set -e

                WORKSPACE_PATH="$(workspaces.source.path)"
                FACTS_DIR="${WORKSPACE_PATH}/facts"
                REPORTS_DIR="${WORKSPACE_PATH}/reports"

                echo "========================================="
                echo "Workspace path: ${WORKSPACE_PATH}"
                echo "========================================="

                echo ""
                echo "--- Listing workspace root ---"
                ls -la "${WORKSPACE_PATH}" || echo "Failed to list workspace"

                echo ""
                echo "========================================="
                echo "Directory listings for facts and reports:"
                echo "========================================="

                if [ -d "${FACTS_DIR}" ]; then
                  echo ""
                  echo "--- ls -la facts/ ---"
                  ls -la "${FACTS_DIR}"
                  echo ""
                  echo "--- facts/ directory tree ---"
                  find "${FACTS_DIR}" -type f -o -type d | sort
                else
                  echo "facts/ directory not found at ${FACTS_DIR}"
                fi

                if [ -d "${REPORTS_DIR}" ]; then
                  echo ""
                  echo "--- ls -la reports/ ---"
                  ls -la "${REPORTS_DIR}"
                  echo ""
                  echo "--- reports/ directory tree ---"
                  find "${REPORTS_DIR}" -type f -o -type d | sort
                else
                  echo "reports/ directory not found at ${REPORTS_DIR}"
                fi

                echo ""
                echo "========================================="
                echo "File contents:"
                echo "========================================="

                if [ -d "${FACTS_DIR}" ]; then
                  echo ""
                  echo "--- Contents of files in facts/ ---"
                  for file in $(find "${FACTS_DIR}" -type f | sort); do
                    echo ""
                    echo "=== $file ==="
                    cat "$file"
                    echo ""
                  done
                fi

                if [ -d "${REPORTS_DIR}" ]; then
                  echo ""
                  echo "--- Contents of files in reports/ ---"
                  for file in $(find "${REPORTS_DIR}" -type f | sort); do
                    echo ""
                    echo "=== $file ==="
                    cat "$file"
                    echo ""
                  done
                fi

                echo "========================================="
                echo "Debug output complete"
                echo "========================================="
        workspaces:
          - name: source
            workspace: shared-workspace

      # ================================================================
      # Stage 10: Publish fact payloads to Compass SoundCheck
      # ================================================================
      - name: publish-to-compass
        runAfter: [generate-compass-facts]
        taskRef:
          resolver: bundles
          params:
            - name: name
              value: publish-to-compass
            - name: bundle
              value: quay.io/ecosystem-appeng/konflux-skill-evaluation/publish-to-compass:0.1.0
            - name: kind
              value: task
        params:
          - name: mcp-eval-image
            value: $(params.MCP_EVAL_IMAGE)
          - name: namespace-name
            value: $(tasks.create-namespace.results.namespace-name)
          - name: dry-run
            value: $(params.COMPASS_DRY_RUN)
        workspaces:
          - name: source
            workspace: shared-workspace
          - name: target-kubeconfig
            workspace: target-kubeconfig

    # ================================================================
    # Finally: Teardown ephemeral namespace (always runs)
    # ================================================================
    finally:
      - name: teardown-namespace
        taskRef:
          resolver: bundles
          params:
            - name: name
              value: teardown-namespace
            - name: bundle
              value: quay.io/ecosystem-appeng/konflux-skill-evaluation/teardown-namespace:0.1.0
            - name: kind
              value: task
        params:
          - name: namespace-name
            value: $(tasks.create-namespace.results.namespace-name)
        workspaces:
          - name: target-kubeconfig
            workspace: target-kubeconfig

  workspaces:
    - name: shared-workspace
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 1Gi
    - name: target-kubeconfig
      secret:
        secretName: mcp-eval-target-kubeconfig
