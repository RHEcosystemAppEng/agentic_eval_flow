# Agentic Eval Flow Generic Evaluation Pipeline for Konflux
#
# This is a REFERENCE pipeline that any Konflux application can use for
# AI evaluation (agents, MCP servers, skills). It provides 7 core stages:
#   parse-snapshot → prepare → test → evaluate → analyze → store → emit-result
#
# USAGE:
# 1. For pre-deployed targets (agents, MCP servers): use this pipeline directly
#    via an IntegrationTestScenario and pass the target endpoint as a parameter.
# 2. For targets that need deployment: create your own pipeline that wraps this
#    one, adding deploy/cleanup tasks specific to your application.
#    See https://github.com/ikrispin/abevalflow-konflux-example for a full example.
#
# NOTE: Dual-publish requirement
# This PipelineRun is resolved from git (via IntegrationTestScenario), but
# the tasks it references are published as Tekton Bundles to Quay.io.
# When updating task logic:
#   1. Edit task YAML in pipeline/tasks/konflux/
#   2. Push bundles: cd pipeline/integration && make bundles
#   3. Commit and push to git
# Pushing to git alone does NOT update the task logic inside bundles.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: abevalflow-eval
spec:
  timeouts:
    pipeline: "4h"
    tasks: "3h"
  pipelineSpec:
    params:
      # === Konflux integration ===
      - name: SNAPSHOT
        type: string
        description: Konflux Snapshot JSON with component details (provided automatically)

      # === Evaluation target ===
      - name: EVAL_ENGINE
        type: string
        default: "a2a"
        description: "Evaluation engine: harbor, ase, mcpchecker, a2a, aeh"
      - name: SUBMISSION_REPO_URL
        type: string
        default: "https://github.com/RHEcosystemAppEng/agentic_eval_flow.git"
        description: Git repo containing the submission definition
      - name: SUBMISSION_DIR
        type: string
        default: ""
        description: Submission directory name under submissions/
      - name: SUBMISSION_REVISION
        type: string
        default: "main"
        description: Git branch/tag/SHA of the submission repo

      # === LLM credentials ===
      - name: LLM_API_KEY
        type: string
        default: "sk-dummy"
        description: >-
          LLM API key. When using LiteLLM proxy (which handles real auth),
          keep as "sk-dummy". For direct LLM API calls, set the real key
          or provision llm-credentials Secret (preferred).

      # === Target endpoints (provide based on engine) ===
      - name: AGENT_ENDPOINT
        type: string
        default: ""
        description: "For a2a engine: HTTP endpoint of the deployed agent"
      - name: MCP_URL
        type: string
        default: ""
        description: "For mcpchecker engine: URL of the MCP server"

      # === LLM infrastructure ===
      - name: LLM_API_BASE
        type: string
        default: ""
        description: LLM proxy base URL for judging (e.g. http://litellm.ns.svc:4000)
      - name: LLM_MODEL
        type: string
        default: "claude-sonnet"
        description: Model for LLM-as-judge

      # === Execution mode ===
      - name: EVAL_MODE
        type: string
        default: "local"
        description: >-
          "local" runs eval directly in the task step (target must be reachable
          from the pipeline cluster). "remote" submits an eval Pod to the
          workload cluster.
      - name: WORKLOAD_CLUSTER_URL
        type: string
        default: ""
        description: API URL of the workload cluster (required when EVAL_MODE=remote)
      - name: WORKLOAD_NAMESPACE
        type: string
        default: ""
        description: Namespace on the workload cluster (required when EVAL_MODE=remote)
      - name: WORKLOAD_CREDENTIALS_SECRET
        type: string
        default: "workload-cluster-credentials"
        description: >-
          Name of the Secret containing 'token' key for the workload cluster.
          Only used when EVAL_MODE=remote.

      # === AEH (Agent-Eval-Harness) ===
      - name: AEH_MODE
        type: string
        default: "single"
        description: "AEH evaluation mode: single or pairwise"
      - name: AEH_IMAGE
        type: string
        default: "quay.io/ecosystem-appeng/agent-eval-harness:v1.1.8"
        description: Container image for AEH trial pods
      - name: AEH_MODEL_OVERRIDE
        type: string
        default: ""
        description: Override models.skill from eval.yaml (empty = use eval.yaml value)
      - name: AEH_JUDGE_MODEL_OVERRIDE
        type: string
        default: ""
        description: Override models.judge from eval.yaml (empty = use eval.yaml value)
      - name: AEH_RUNNER
        type: string
        default: "harbor"
        description: "AEH execution backend: harbor or vanilla"
      - name: AEH_CONTROL_CONFIG
        type: string
        default: "eval-control.yaml"
        description: Control variant eval.yaml filename for pairwise mode
      - name: AEH_TREATMENT_CONFIG
        type: string
        default: "eval-treatment.yaml"
        description: Treatment variant eval.yaml filename for pairwise mode
      - name: AEH_KUBECONFIG_SECRET
        type: string
        default: ""
        description: >-
          Name of a Secret containing a 'kubeconfig' key for an external cluster
          where AEH trial pods should run. When empty, AEH uses in-cluster
          credentials. Use with WORKLOAD_NAMESPACE to target a specific namespace.

      # === Red team (adversarial testing) ===
      - name: ENABLE_RED_TEAM
        type: string
        default: "false"
        description: "Enable red team adversarial evaluation (runs Promptfoo against the target)"
      - name: RED_TEAM_MODE
        type: string
        default: "smoke"
        description: >-
          "smoke" generates a quick suite from metadata (~25 tests, basic strategy, ~2 min).
          "full" generates comprehensive attacks with all strategies (~1750 tests, ~90 min).
      - name: RED_TEAM_CONCURRENCY
        type: string
        default: "12"
        description: Number of parallel Promptfoo evaluations
      - name: RED_TEAM_CRESCENDO_MAX_TURNS
        type: string
        default: "7"
        description: Max turns per PyRIT Crescendo objective (full mode only)

      # === Pipeline repo (for scripts) ===
      - name: PIPELINE_REPO_URL
        type: string
        default: "https://github.com/RHEcosystemAppEng/agentic_eval_flow.git"
        description: URL of the Agentic Eval Flow pipeline repo containing evaluation scripts
      - name: PIPELINE_REPO_REVISION
        type: string
        default: "main"
        description: Branch or SHA of the pipeline repo

    workspaces:
      - name: shared-workspace
    results:
      - name: TEST_OUTPUT
        description: Standardized Konflux test output
        value: $(tasks.emit-result.results.TEST_OUTPUT)

    tasks:
      # ================================================================
      # Stage 1: Parse the Konflux Snapshot
      # ================================================================
      - name: parse-snapshot
        taskRef:
          resolver: bundles
          params:
            - name: name
              value: parse-snapshot
            - name: bundle
              value: quay.io/ecosystem-appeng/abevalflow-task-parse-snapshot:AEH
            - name: kind
              value: task
        params:
          - name: SNAPSHOT
            value: $(params.SNAPSHOT)

      # ================================================================
      # Stage 2: Prepare (clone + validate submission)
      # ================================================================
      - name: prepare
        runAfter: [parse-snapshot]
        taskRef:
          resolver: bundles
          params:
            - name: name
              value: prepare
            - name: bundle
              value: quay.io/ecosystem-appeng/abevalflow-task-prepare:AEH
            - name: kind
              value: task
        params:
          - name: repo-url
            value: $(params.SUBMISSION_REPO_URL)
          - name: revision
            value: $(params.SUBMISSION_REVISION)
          - name: submission-dir
            value: $(params.SUBMISSION_DIR)
          - name: eval-engine
            value: $(params.EVAL_ENGINE)
          - name: pipeline-repo-url
            value: $(params.PIPELINE_REPO_URL)
          - name: pipeline-repo-revision
            value: $(params.PIPELINE_REPO_REVISION)
          - name: pipeline-run-name
            value: $(context.pipelineRun.name)
          - name: enable-generation
            value: "false"
          - name: aeh-mode
            value: $(params.AEH_MODE)
          - name: aeh-control-config
            value: $(params.AEH_CONTROL_CONFIG)
          - name: aeh-treatment-config
            value: $(params.AEH_TREATMENT_CONFIG)
        workspaces:
          - name: source
            workspace: shared-workspace

      # ================================================================
      # Stage 3: Test (security scan + quality review)
      # ================================================================
      - name: test
        runAfter: [prepare]
        taskRef:
          resolver: bundles
          params:
            - name: name
              value: test
            - name: bundle
              value: quay.io/ecosystem-appeng/abevalflow-task-test:AEH
            - name: kind
              value: task
        params:
          - name: submission-dir
            value: $(params.SUBMISSION_DIR)
          - name: submission-name
            value: $(tasks.prepare.results.submission-name)
          - name: eval-engine
            value: $(params.EVAL_ENGINE)
          - name: report-prefix
            value: $(tasks.prepare.results.report-prefix)
          - name: pipeline-run-name
            value: $(context.pipelineRun.name)
          - name: pipeline-repo-url
            value: $(params.PIPELINE_REPO_URL)
          - name: pipeline-repo-revision
            value: $(params.PIPELINE_REPO_REVISION)
          # Security and quality are disabled in this reference pipeline.
          # For a stricter gate, set security-scan-mode to "warn" or "block"
          # and enable-quality-review to "true".
          - name: security-scan-mode
            value: disabled
          - name: submission-security-scan
            value: $(tasks.prepare.results.security-scan)
          - name: submission-skip-quality-review
            value: $(tasks.prepare.results.skip-quality-review)
          - name: enable-quality-review
            value: "false"
          - name: llm-base-url
            value: $(params.LLM_API_BASE)
        workspaces:
          - name: source
            workspace: shared-workspace

      # ================================================================
      # Stage 3.5: Red Team (adversarial testing, optional)
      # ================================================================
      - name: red-team
        runAfter: [test]
        when:
          - input: $(params.ENABLE_RED_TEAM)
            operator: in
            values: ["true"]
        taskRef:
          resolver: bundles
          params:
            - name: name
              value: red-team
            - name: bundle
              value: quay.io/ecosystem-appeng/abevalflow-task-red-team:AEH
            - name: kind
              value: task
        params:
          - name: eval-engine
            value: $(params.EVAL_ENGINE)
          - name: submission-dir
            value: $(params.SUBMISSION_DIR)
          - name: submission-name
            value: $(tasks.prepare.results.submission-name)
          - name: agent-endpoint
            value: $(params.AGENT_ENDPOINT)
          - name: mcp-url
            value: $(params.MCP_URL)
          - name: red-team-mode
            value: $(params.RED_TEAM_MODE)
          - name: llm-api-base
            value: $(params.LLM_API_BASE)
          - name: llm-model
            value: $(params.LLM_MODEL)
          - name: pipeline-run-id
            value: $(context.pipelineRun.name)
          - name: pipeline-repo-url
            value: $(params.PIPELINE_REPO_URL)
          - name: pipeline-repo-revision
            value: $(params.PIPELINE_REPO_REVISION)
          - name: concurrency
            value: $(params.RED_TEAM_CONCURRENCY)
          - name: crescendo-max-turns
            value: $(params.RED_TEAM_CRESCENDO_MAX_TURNS)
        workspaces:
          - name: source
            workspace: shared-workspace

      # ================================================================
      # Stage 4: Evaluate
      # ================================================================
      - name: evaluate
        runAfter: [red-team, test]
        timeout: "3h"
        taskRef:
          resolver: bundles
          params:
            - name: name
              value: evaluate
            - name: bundle
              value: quay.io/ecosystem-appeng/abevalflow-task-evaluate:AEH
            - name: kind
              value: task
        params:
          - name: eval-engine
            value: $(params.EVAL_ENGINE)
          - name: submission-dir
            value: $(params.SUBMISSION_DIR)
          - name: submission-name
            value: $(tasks.prepare.results.submission-name)
          - name: commit-sha
            value: $(tasks.parse-snapshot.results.git-revision)
          - name: pipeline-run-id
            value: $(context.pipelineRun.name)
          - name: pipeline-repo-url
            value: $(params.PIPELINE_REPO_URL)
          - name: pipeline-repo-revision
            value: $(params.PIPELINE_REPO_REVISION)
          - name: llm-model
            value: $(params.LLM_MODEL)
          - name: llm-api-base
            value: $(params.LLM_API_BASE)
          - name: agent-endpoint
            value: $(params.AGENT_ENDPOINT)
          - name: mcp-url
            value: $(params.MCP_URL)
          - name: submission-repo-url
            value: $(params.SUBMISSION_REPO_URL)
          - name: submission-repo-revision
            value: $(params.SUBMISSION_REVISION)
          - name: eval-mode
            value: $(params.EVAL_MODE)
          - name: workload-cluster-url
            value: $(params.WORKLOAD_CLUSTER_URL)
          - name: workload-namespace
            value: $(params.WORKLOAD_NAMESPACE)
          - name: workload-credentials-secret
            value: $(params.WORKLOAD_CREDENTIALS_SECRET)
          # AEH params
          - name: aeh-mode
            value: $(params.AEH_MODE)
          - name: aeh-image
            value: $(params.AEH_IMAGE)
          - name: aeh-model-override
            value: $(params.AEH_MODEL_OVERRIDE)
          - name: aeh-judge-model-override
            value: $(params.AEH_JUDGE_MODEL_OVERRIDE)
          - name: aeh-runner
            value: $(params.AEH_RUNNER)
          - name: aeh-control-config
            value: $(params.AEH_CONTROL_CONFIG)
          - name: aeh-treatment-config
            value: $(params.AEH_TREATMENT_CONFIG)
          - name: aeh-kubeconfig-secret
            value: $(params.AEH_KUBECONFIG_SECRET)
        workspaces:
          - name: source
            workspace: shared-workspace

      # ================================================================
      # Stage 5: Analyze + Scorecard
      # ================================================================
      - name: analyze-scorecard
        runAfter: [evaluate]
        taskRef:
          resolver: bundles
          params:
            - name: name
              value: analyze-scorecard
            - name: bundle
              value: quay.io/ecosystem-appeng/abevalflow-task-analyze-scorecard:AEH
            - name: kind
              value: task
        params:
          - name: submission-name
            value: $(tasks.prepare.results.submission-name)
          - name: eval-engine
            value: $(params.EVAL_ENGINE)
          - name: commit-sha
            value: $(tasks.parse-snapshot.results.git-revision)
          - name: pipeline-run-id
            value: $(context.pipelineRun.name)
          - name: uplift-threshold
            value: "0.0"
          - name: pipeline-repo-url
            value: $(params.PIPELINE_REPO_URL)
          - name: pipeline-repo-revision
            value: $(params.PIPELINE_REPO_REVISION)
          - name: enable-scorecard
            value: "true"
          - name: enable-degradation-check
            value: "false"
        workspaces:
          - name: source
            workspace: shared-workspace

      # ================================================================
      # Stage 6: Store (optional -- graceful when secrets missing)
      # ================================================================
      - name: store
        runAfter: [analyze-scorecard]
        taskRef:
          resolver: bundles
          params:
            - name: name
              value: store
            - name: bundle
              value: quay.io/ecosystem-appeng/abevalflow-task-store:AEH
            - name: kind
              value: task
        params:
          - name: submission-name
            value: $(tasks.prepare.results.submission-name)
          - name: pipeline-run-id
            value: $(context.pipelineRun.name)
          - name: report-prefix
            value: $(tasks.prepare.results.report-prefix)
          - name: recommendation
            value: $(tasks.evaluate.results.recommendation)
          - name: eval-engine
            value: $(params.EVAL_ENGINE)
          - name: commit-sha
            value: $(tasks.parse-snapshot.results.git-revision)
          - name: pipeline-repo-url
            value: $(params.PIPELINE_REPO_URL)
          - name: pipeline-repo-revision
            value: $(params.PIPELINE_REPO_REVISION)
        workspaces:
          - name: source
            workspace: shared-workspace

      # ================================================================
      # Stage 7: Emit Konflux TEST_OUTPUT
      # ================================================================
      - name: emit-result
        runAfter: [store]
        taskRef:
          resolver: bundles
          params:
            - name: name
              value: emit-result
            - name: bundle
              value: quay.io/ecosystem-appeng/abevalflow-task-emit-result:AEH
            - name: kind
              value: task
        params:
          - name: submission-name
            value: $(tasks.prepare.results.submission-name)
        workspaces:
          - name: source
            workspace: shared-workspace

  workspaces:
    - name: shared-workspace
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 1Gi
