apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: abevalflow-pipeline-harbor-mcp
  labels:
    app.kubernetes.io/name: abevalflow
spec:
  description: Native Harbor skill/control pair with a fresh optional catalog mock
    per condition, verified archival and storage. Opt into this profile for managed
    mocks; generic Harbor is unchanged.
  params:
  - name: repo-url
    type: string
    description: Git URL of the submissions repository
  - name: revision
    type: string
    description: Git commit SHA or branch to evaluate
  - name: submission-dir
    type: string
    description: Submission directory name under submissions/
  - name: pipeline-repo-url
    type: string
    default: https://github.com/RHEcosystemAppEng/agentic_eval_flow.git
  - name: pipeline-repo-revision
    type: string
    default: main
  - name: llm-api-key
    type: string
    default: mock
  - name: llm-base-url
    type: string
    default: http://litellm.ab-eval-flow.svc:4000/v1
  - name: llm-generation-model
    type: string
    default: claude-sonnet
  - name: enable-ai-generation
    type: string
    default: 'false'
  - name: enable-test-quality-review
    type: string
    default: 'false'
  - name: agent-type
    type: string
    default: api
  - name: max-generation-retries
    type: string
    default: '3'
  - name: quay-uplift-threshold
    type: string
    default: '-1.0'
  - name: security-scan
    type: string
    default: ''
  - name: quay-repo
    type: string
    default: ''
  - name: quay-ttl-days
    type: string
    default: '7'
  - name: repo-name
    type: string
    default: ''
  - name: pr-number
    type: string
    default: ''
  - name: harbor-agent-image
    type: string
  - name: harbor-case
    type: string
    default: create-uncertain
  - name: harbor-model
    type: string
    default: claude-sonnet
  - name: mcp-catalog-configmap
    type: string
  - name: retain-debug-workspace
    type: string
    default: 'true'
    description: Keep Tekton Task Pods and workspace after archival for console debugging.
      Disable only when ready to release evidence.
  results:
  - name: treatment-mean-reward
    value: $(tasks.evaluate-harbor.results.treatment-mean-reward)
  - name: control-mean-reward
    value: $(tasks.evaluate-harbor.results.control-mean-reward)
  - name: recommendation
    value: $(tasks.evaluate-harbor.results.recommendation)
  - name: results-dir
    value: $(tasks.evaluate-harbor.results.results-dir)
  workspaces:
  - name: shared-workspace
    description: Shared PVC for all pipeline artifacts
  tasks:
  - name: prepare
    taskRef:
      name: prepare
    params:
    - name: repo-url
      value: $(params.repo-url)
    - name: revision
      value: $(params.revision)
    - name: submission-dir
      value: $(params.submission-dir)
    - name: eval-engine
      value: harbor
    - name: pipeline-repo-url
      value: $(params.pipeline-repo-url)
    - name: pipeline-repo-revision
      value: $(params.pipeline-repo-revision)
    - name: pipeline-run-name
      value: $(context.pipelineRun.name)
    - name: enable-generation
      value: $(params.enable-ai-generation)
    - name: llm-base-url
      value: $(params.llm-base-url)
    - name: llm-model
      value: $(params.llm-generation-model)
    - name: agent-type
      value: $(params.agent-type)
    - name: max-generation-retries
      value: $(params.max-generation-retries)
    workspaces:
    - name: source
      workspace: shared-workspace
  - name: test
    runAfter:
    - prepare
    taskRef:
      name: test
    params:
    - name: submission-dir
      value: $(params.submission-dir)
    - name: submission-name
      value: $(tasks.prepare.results.submission-name)
    - name: eval-engine
      value: harbor
    - name: report-prefix
      value: $(tasks.prepare.results.report-prefix)
    - name: pipeline-run-name
      value: $(context.pipelineRun.name)
    - name: pipeline-repo-url
      value: $(params.pipeline-repo-url)
    - name: pipeline-repo-revision
      value: $(params.pipeline-repo-revision)
    - name: security-scan-mode
      value: $(params.security-scan)
    - name: submission-security-scan
      value: $(tasks.prepare.results.security-scan)
    - name: submission-skip-quality-review
      value: $(tasks.prepare.results.skip-quality-review)
    - name: security-scan-use-llm
      value: $(tasks.prepare.results.security-scan-use-llm)
    - name: enable-quality-review
      value: $(params.enable-test-quality-review)
    - name: llm-base-url
      value: $(params.llm-base-url)
    - name: llm-model
      value: $(params.llm-generation-model)
    - name: llm-api-key
      value: $(params.llm-api-key)
    workspaces:
    - name: source
      workspace: shared-workspace
  - name: start-mcp
    runAfter:
    - test
    taskRef:
      name: start-harbor-mcp
    params:
    - name: submission-dir
      value: $(params.submission-dir)
    - name: pipeline-run-uid
      value: $(context.pipelineRun.uid)
    - name: pipeline-run-id
      value: $(context.pipelineRun.name)
    - name: submission-name
      value: $(tasks.prepare.results.submission-name)
    - name: mcp-catalog-configmap
      value: $(params.mcp-catalog-configmap)
    workspaces:
    - name: source
      workspace: shared-workspace
  - name: evaluate-harbor
    runAfter:
    - start-mcp
    timeout: 3h
    taskRef:
      name: evaluate-harbor-mcp
    params:
    - name: submission-dir
      value: $(params.submission-dir)
    - name: pipeline-run-uid
      value: $(context.pipelineRun.uid)
    - name: pipeline-run-id
      value: $(context.pipelineRun.name)
    - name: submission-name
      value: $(tasks.prepare.results.submission-name)
    - name: harbor-agent-image
      value: $(params.harbor-agent-image)
    - name: harbor-case
      value: $(params.harbor-case)
    - name: harbor-model
      value: $(params.harbor-model)
    - name: mcp-catalog-configmap
      value: $(params.mcp-catalog-configmap)
    workspaces:
    - name: source
      workspace: shared-workspace
  - name: store
    runAfter:
    - evaluate-harbor
    taskRef:
      name: store-harbor-mcp
    params:
    - name: submission-name
      value: $(tasks.prepare.results.submission-name)
    - name: pipeline-run-uid
      value: $(context.pipelineRun.uid)
    workspaces:
    - name: source
      workspace: shared-workspace
  finally:
  - name: cleanup
    taskRef:
      name: cleanup-harbor-mcp
    params:
    - name: pipelinerun-name
      value: $(context.pipelineRun.name)
    - name: pipeline-run-uid
      value: $(context.pipelineRun.uid)
    - name: retain-debug-workspace
      value: $(params.retain-debug-workspace)
