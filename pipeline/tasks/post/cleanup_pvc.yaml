apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup-pvc
spec:
  description: Archive and verify evidence using a temporary worker, then release run resources and workspace. The finalizer
    never mounts the PVC it deletes. Archive failure retains evidence; MCP infrastructure failures are visible.
  params:
  - name: pipelinerun-name
    type: string
    description: Name of the PipelineRun whose PVCs should be cleaned up
  - name: delete-retained-pods
    type: string
    default: 'true'
    description: Release retained DAG Pods and the Affinity Assistant after verified archival. Set false to retain holders
      for debugging.
  - name: pipeline-run-uid
    type: string
    default: legacy
  - name: eval-engine
    type: string
    default: harbor
  results:
  - name: cleanup-status
    description: 'deleted: all owned PVCs confirmed removed; none: no owned PVCs found; api-unavailable: the lookup could
      not reach the API, deletion unverified; failed: one or more PVCs were still present after deletion (labelled abevalflow.io/cleanup-failed=true).'
  steps:
  - name: archive-evidence
    image: image-registry.openshift-image-registry.svc:5000/ab-eval-flow/mcpchecker-ci@sha256:02e170f421ab6f5b3d4a4d301e489a9a817f3b8434593984a7ece46c544bbb99
    computeResources: &id001
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    volumeMounts:
    - name: archive-gate
      mountPath: /archive-gate
    script: |
      #!/usr/bin/env bash
      set -euo pipefail
      echo failed > "$(results.cleanup-status.path)"
      if python -m abevalflow.mcp_ci finish --uid "$(params.pipeline-run-uid)" --run-name "$(params.pipelinerun-name)" --image "image-registry.openshift-image-registry.svc:5000/ab-eval-flow/mcpchecker-ci@sha256:02e170f421ab6f5b3d4a4d301e489a9a817f3b8434593984a7ece46c544bbb99"; then
        touch /archive-gate/complete
      else
        echo "Evidence archival failed; retaining resources and workspace for recovery"
        if [ "${EVAL_ENGINE}" = mcpchecker ]; then exit 1; fi
      fi
    env:
    - name: MINIO_ENDPOINT
      valueFrom:
        secretKeyRef:
          name: minio-credentials
          key: endpoint-url
          optional: true
    - name: MINIO_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: minio-credentials
          key: root-user
          optional: true
    - name: MINIO_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: minio-credentials
          key: root-password
          optional: true
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: ab-eval-db-credentials
          key: database-url
          optional: true
    - name: POD_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
    - name: EVAL_ENGINE
      value: $(params.eval-engine)
  - name: delete-pvc
    image: image-registry.openshift-image-registry.svc:5000/ab-eval-flow/mcpchecker-ci@sha256:02e170f421ab6f5b3d4a4d301e489a9a817f3b8434593984a7ece46c544bbb99
    env:
    - name: EVAL_ENGINE
      value: $(params.eval-engine)
    - name: POD_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
    script: "#!/usr/bin/env bash\nset -uo pipefail\nif [ ! -f /archive-gate/complete ]; then\n  echo \"failed\" > \"$(results.cleanup-status.path)\"\
      \n  echo \"Skipping release: evidence archive did not complete\"\n  exit 0\nfi\nif [ \"$EVAL_ENGINE\" = mcpchecker ];\
      \ then\n  if python -m abevalflow.mcp_ci release --uid \"$(params.pipeline-run-uid)\" --run-name \"$(params.pipelinerun-name)\"\
      ; then\n    exit 0\n  fi\n  echo failed > \"$(results.cleanup-status.path)\"\n  exit 1\nfi\n# Get current namespace\
      \ from service account\nNAMESPACE=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)\nRESULT_PATH=\"$(results.cleanup-status.path)\"\
      \n\necho \"Cleaning up PVCs for PipelineRun $(params.pipelinerun-name) in namespace ${NAMESPACE}...\"\npvcs=\"\"\nlookup_ok=0\n\
      for attempt in 1 2 3; do\n  if pvcs=$(oc get pvc -n \"${NAMESPACE}\" --request-timeout=20s \\\n    -o jsonpath='{range\
      \ .items[?(@.metadata.ownerReferences[0].name==\"$(params.pipelinerun-name)\")]}{.metadata.name}{\"\\n\"}{end}'); then\n\
      \    lookup_ok=1\n    break\n  fi\n  echo \"WARNING: PVC lookup attempt ${attempt}/3 failed\"\n  sleep $((attempt *\
      \ 5))\ndone\n\n# Non-blocking by design: the run stays green, but the outcome is\n# reported so an operator can see\
      \ the PVC may still exist.\nif [ \"$lookup_ok\" -ne 1 ]; then\n  echo \"api-unavailable\" > \"$RESULT_PATH\"\n  echo\
      \ \"WARNING: PVC lookup failed; the API remained unavailable, deletion unverified\"\n  exit 0\nfi\n\nif [ -z \"$pvcs\"\
      \ ]; then\n  pvcs=$(oc get pvc -n \"${NAMESPACE}\" -l \"abevalflow.io/mcp-run=$(params.pipeline-run-uid)\" --request-timeout=20s\
      \ -o jsonpath='{range .items[*]}{.metadata.name}{\"\\n\"}{end}') || exit 1\nfi\nif [ -z \"$pvcs\" ]; then\n  echo \"\
      none\" > \"$RESULT_PATH\"\n  echo \"No owned PVCs found; nothing to clean up\"\n  exit 0\nfi\n\n# Release everything\
      \ that mounts the workspace PVC before deleting\n# it, or the pvc-protection finalizer never clears and an accepted\n\
      # delete stalls in Terminating forever (the PV and quota stay\n# allocated). Two holders exist:\n#   1. The run's completed\
      \ TaskRun pods, which Tekton retains after\n#      completion. memberOf=tasks matches only DAG pods, never this\n# \
      \     finally pod or any other finally task's pod, so the cleanup\n#      cannot delete itself.\n#   2. The run's Affinity\
      \ Assistant: for volumeClaimTemplate\n#      workspaces Tekton runs an affinity-assistant StatefulSet\n#      whose\
      \ nop pod mounts the run's workspace PVC purely to\n#      co-schedule the DAG tasks. Tekton deletes it only at\n# \
      \     PipelineRun completion \u2014 i.e. after this finally task ends \u2014\n#      so without releasing it here no\
      \ confirmation window, however\n#      long, can ever see the reclaim. It is run-scoped via\n#      tekton.dev/pipelineRun,\
      \ and Tekton does not recreate it once\n#      deleted (both verified live).\nif [ \"$(params.delete-retained-pods)\"\
      \ = \"true\" ]; then\n  # archive-evidence verified the durable log copy before release.\n  release_ok=1\n  if [ \"\
      $release_ok\" -ne 1 ]; then\n    echo \"Skipping the pod release so no unarchived logs are destroyed; the PVC will stay\
      \ Terminating and be reported failed\"\n  else\n    echo \"Deleting retained TaskRun pods of the run so PVC deletion\
      \ can complete...\"\n    if ! oc delete pod -n \"${NAMESPACE}\" \\\n      -l \"tekton.dev/pipelineRun=$(params.pipelinerun-name),tekton.dev/memberOf=tasks\"\
      \ \\\n      --ignore-not-found=true --request-timeout=20s; then\n      echo \"WARNING: could not delete retained TaskRun\
      \ pods; PVCs may stay Terminating\"\n    fi\n    # Release the Affinity Assistant before waiting on the pods: its\n\
      \    # nop pod also mounts the PVC, so the PVC cannot disappear while\n    # the StatefulSet exists no matter how fast\
      \ the pods go.\n    if ! oc delete statefulset -n \"${NAMESPACE}\" \\\n      -l \"tekton.dev/pipelineRun=$(params.pipelinerun-name)\"\
      \ \\\n      --ignore-not-found=true --request-timeout=20s; then\n      echo \"WARNING: could not delete the run's affinity\
      \ assistant; PVCs may stay Terminating until the run completes\"\n    fi\n    # An accepted pod delete is not a removed\
      \ pod object: a pod with\n    # a deletionTimestamp still mounts the PVC, and the pvc-protection\n    # finalizer clears\
      \ only once the object is actually gone. Wait\n    # for that here so the PVC confirmation window below measures\n \
      \   # the PVC path rather than leftover pod teardown \u2014 this wait is\n    # what revealed the second holder behind\
      \ runs 7-9. It is a\n    # diagnostic bound, not the completion gate (the PVC loop below\n    # is: a PVC cannot disappear\
      \ while any pod still mounts it), so\n    # it stays short; with the 5m confirmation window and API-retry\n    # headroom,\
      \ the task's worst case fits inside the 15m finally\n    # budget. A failed listing must not count as \"gone\" \u2014\
      \ keep\n    # waiting.\n    pod_deadline=$((SECONDS + 120))\n    while [ \"$SECONDS\" -lt \"$pod_deadline\" ]; do\n\
      \      if pods_left=\"$(oc get pods -n \"${NAMESPACE}\" \\\n        -l \"tekton.dev/pipelineRun=$(params.pipelinerun-name),tekton.dev/memberOf=tasks\"\
      \ \\\n        --request-timeout=20s -o name 2>&1)\"; then\n        if [ -z \"$pods_left\" ]; then\n          echo \"\
      Retained TaskRun pods confirmed gone\"\n          break\n        fi\n        echo \"Waiting for retained TaskRun pods\
      \ to disappear ($((pod_deadline - SECONDS))s left): $(echo \"$pods_left\" | tr '\\n' ' ')\"\n      else\n        echo\
      \ \"WARNING: could not list the run's pods: $pods_left\"\n      fi\n      sleep 15\n    done\n  fi\nfi\n\nwhile read\
      \ -r pvc; do\n  if [ -n \"$pvc\" ]; then\n    echo \"Deleting PVC: $pvc\"\n    if ! oc delete pvc \"$pvc\" -n \"${NAMESPACE}\"\
      \ --wait=false --request-timeout=20s; then\n      echo \"WARNING: failed to delete PVC $pvc\"\n    fi\n  fi\ndone <<<\
      \ \"$pvcs\"\n\n# An accepted delete is not a completed delete: confirm removal\n# instead of trusting it, and make anything\
      \ still present\n# operator-visible. Reclaim is fast once the holders are released\n# (~2-5s, measured with both the\
      \ retained pods and the affinity\n# assistant gone) \u2014 the multi-minute waits in runs 7-9 were the\n# affinity assistant\
      \ still holding the PVC, not slow reclamation,\n# which is why lengthening the window never helped. Five minutes\n#\
      \ is a safety margin over the measured reclaim, not a guess at\n# latency; if the cluster is slower still, \"failed\"\
      \ is the\n# conservative report: it never claims a deletion that was not\n# confirmed.\nremaining=\"\"\ndeadline=$((SECONDS\
      \ + 300))\nwhile [ \"$SECONDS\" -lt \"$deadline\" ]; do\n  remaining=\"\"\n  while read -r pvc; do\n    if [ -n \"$pvc\"\
      \ ]; then\n      if get_err=$(oc get pvc \"$pvc\" -n \"${NAMESPACE}\" --request-timeout=20s 2>&1); then\n        # Still\
      \ present.\n        remaining=\"${remaining}${pvc} \"\n      elif ! echo \"$get_err\" | grep -q '(NotFound)'; then\n\
      \        # Cannot verify \u2014 treat as present rather than risk a\n        # false \"deleted\".\n        remaining=\"\
      ${remaining}${pvc} \"\n      fi\n    fi\n  done <<< \"$pvcs\"\n  if [ -z \"$remaining\" ]; then\n    break\n  fi\n \
      \ echo \"Waiting for PVC deletion to complete ($((deadline - SECONDS))s left): ${remaining}\"\n  sleep 15\ndone\n\n\
      if [ -n \"$remaining\" ]; then\n  for pvc in $remaining; do\n    echo \"WARNING: PVC $pvc is still present after deletion\"\
      \n    # Operator-visible marker on the leaked PVC: alert on the\n    # abevalflow.io/cleanup-failed label instead of\
      \ a log line.\n    oc label pvc \"$pvc\" -n \"${NAMESPACE}\" \\\n      abevalflow.io/cleanup-failed=true --overwrite\
      \ --request-timeout=20s \\\n      || echo \"WARNING: could not label PVC $pvc (needs patch on persistentvolumeclaims)\"\
      \n  done\n  echo \"failed\" > \"$RESULT_PATH\"\n  echo \"WARNING: PVC cleanup failed for this run; labelled PVCs remain\
      \ for an operator\"\n  exit 0\nfi\necho \"deleted\" > \"$RESULT_PATH\"\necho \"PVC cleanup complete\"\n"
    volumeMounts:
    - name: archive-gate
      mountPath: /archive-gate
    computeResources: *id001
  volumes:
  - name: archive-gate
    emptyDir: {}
