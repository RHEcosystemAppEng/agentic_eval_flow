apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup-pvc
spec:
  description: >-
    Deletes the workspace PVC after a pipeline run completes.
    Runs as a finally task to prevent PVC quota exhaustion.
  params:
    - name: pipelinerun-name
      type: string
      description: Name of the PipelineRun whose PVCs should be cleaned up
  steps:
    - name: delete-pvc
      image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
      onError: continue
      script: |
        #!/usr/bin/env bash
        set -uo pipefail

        # Get current namespace from service account
        NAMESPACE=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)

        echo "Cleaning up PVCs for PipelineRun $(params.pipelinerun-name) in namespace ${NAMESPACE}..."
        pvcs=""
        for attempt in 1 2 3; do
          if pvcs=$(oc get pvc -n "${NAMESPACE}" --request-timeout=20s \
            -o jsonpath='{range .items[?(@.metadata.ownerReferences[0].name=="$(params.pipelinerun-name)")]}{.metadata.name}{"\n"}{end}'); then
            break
          fi
          echo "WARNING: PVC lookup attempt ${attempt}/3 failed"
          sleep $((attempt * 5))
        done

        if [ -z "$pvcs" ]; then
          echo "No owned PVCs found, or the API remained unavailable; cleanup is best-effort"
          exit 0
        fi

        while read -r pvc; do
          if [ -n "$pvc" ]; then
            echo "Deleting PVC: $pvc"
            oc delete pvc "$pvc" -n "${NAMESPACE}" --wait=false --request-timeout=20s \
              || echo "WARNING: failed to delete PVC $pvc"
          fi
        done <<< "$pvcs"
        echo "PVC cleanup complete"
