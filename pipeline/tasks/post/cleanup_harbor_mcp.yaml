apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup-harbor-mcp
spec:
  description: Archive and verify MCP evidence before releasing resources. A failed
    archive step stops the release step.
  params:
  - name: pipelinerun-name
    type: string
  - name: pipeline-run-uid
    type: string
  results:
  - name: cleanup-status
    description: deleted or none after verified archive and confirmed PVC absence;
      a failed Task retains evidence.
  steps:
  - command:
    - python
    - -m
    - abevalflow.mcp_ci
    computeResources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    image: image-registry.openshift-image-registry.svc:5000/ab-eval-flow/harbor-mcp-ci@sha256:e8b281f9b197986e3c86ca7ebc467076eb528ed1699c1fed5b42a4af91325931
    name: archive-evidence
    args:
    - finish
    - --uid
    - $(params.pipeline-run-uid)
    - --run-name
    - $(params.pipelinerun-name)
    - --image
    - image-registry.openshift-image-registry.svc:5000/ab-eval-flow/harbor-mcp-ci@sha256:e8b281f9b197986e3c86ca7ebc467076eb528ed1699c1fed5b42a4af91325931
    env:
    - name: MINIO_ENDPOINT
      valueFrom:
        secretKeyRef:
          name: minio-credentials
          key: endpoint-url
          optional: true
    - name: MINIO_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: minio-credentials
          key: root-user
          optional: true
    - name: MINIO_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: minio-credentials
          key: root-password
          optional: true
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: ab-eval-db-credentials
          key: database-url
          optional: true
    - name: POD_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
  - command:
    - python
    - -m
    - abevalflow.mcp_ci
    computeResources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    image: image-registry.openshift-image-registry.svc:5000/ab-eval-flow/harbor-mcp-ci@sha256:e8b281f9b197986e3c86ca7ebc467076eb528ed1699c1fed5b42a4af91325931
    name: release-workspace
    args:
    - release
    - --uid
    - $(params.pipeline-run-uid)
    - --run-name
    - $(params.pipelinerun-name)
    env:
    - name: POD_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
