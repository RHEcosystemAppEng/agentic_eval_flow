apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup-harbor-mcp
spec:
  description: Archive and verify MCP evidence before releasing resources. A failed
    archive step stops the release step.
  params:
  - name: pipelinerun-name
    type: string
  - name: pipeline-run-uid
    type: string
  - name: retain-debug-workspace
    type: string
    default: 'false'
  results:
  - name: cleanup-status
    description: deleted, none, or retained after verified archival; retained keeps
      console Task logs and the evidence PVC.
  steps:
  - command:
    - python
    - -m
    - abevalflow.mcp_ci
    computeResources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    image: image-registry.openshift-image-registry.svc:5000/ab-eval-flow/harbor-mcp-ci@sha256:734aab23853c5e42ca152614f3562b6e22fabc258caa8af8e537d9e6700399a3
    name: archive-evidence
    args:
    - finish
    - --uid
    - $(params.pipeline-run-uid)
    - --run-name
    - $(params.pipelinerun-name)
    - --image
    - image-registry.openshift-image-registry.svc:5000/ab-eval-flow/harbor-mcp-ci@sha256:734aab23853c5e42ca152614f3562b6e22fabc258caa8af8e537d9e6700399a3
    env:
    - name: MINIO_ENDPOINT
      valueFrom:
        secretKeyRef:
          name: minio-credentials
          key: endpoint-url
          optional: true
    - name: MINIO_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: minio-credentials
          key: root-user
          optional: true
    - name: MINIO_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: minio-credentials
          key: root-password
          optional: true
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: ab-eval-db-credentials
          key: database-url
          optional: true
    - name: POD_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
  - command:
    - python
    - -m
    - abevalflow.mcp_ci
    computeResources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    image: image-registry.openshift-image-registry.svc:5000/ab-eval-flow/harbor-mcp-ci@sha256:734aab23853c5e42ca152614f3562b6e22fabc258caa8af8e537d9e6700399a3
    name: release-workspace
    args:
    - release
    - --uid
    - $(params.pipeline-run-uid)
    - --run-name
    - $(params.pipelinerun-name)
    env:
    - name: POD_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
    when:
    - input: $(params.retain-debug-workspace)
      operator: in
      values:
      - 'false'
  - name: report-retained
    image: image-registry.openshift-image-registry.svc:5000/ab-eval-flow/harbor-mcp-ci@sha256:734aab23853c5e42ca152614f3562b6e22fabc258caa8af8e537d9e6700399a3
    computeResources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    when:
    - input: $(params.retain-debug-workspace)
      operator: in
      values:
      - 'true'
    command:
    - python
    - -c
    args:
    - from pathlib import Path; Path('/tekton/results/cleanup-status').write_text('retained')
