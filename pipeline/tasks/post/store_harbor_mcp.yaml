apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: store-harbor-mcp
spec:
  params:
  - name: submission-name
    type: string
  - name: pipeline-run-uid
    type: string
  workspaces:
  - name: source
  steps:
  - name: persist-native-report
    image: image-registry.openshift-image-registry.svc:5000/ab-eval-flow/harbor-mcp-ci@sha256:707c428694651d2b278d576fc60deb7aeae755827866a36f6fb4395489e2a266
    computeResources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: '1'
        memory: 1Gi
    env:
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: ab-eval-db-credentials
          key: database-url
    command:
    - python
    - -m
    - scripts.store_results
    args:
    - --report-dir
    - $(workspaces.source.path)/reports/$(params.submission-name)
    - --run-id
    - $(params.pipeline-run-uid)
