apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: evaluation-results
spec:
  params:
  - name: pipeline-run-uid
    type: string
  - name: pipeline-run-id
    type: string
  - name: eval-engine
    type: string
  - name: submission-name
    type: string
    default: ''
  workspaces:
  - name: source
  results:
  - name: treatment-mean-reward
  - name: control-mean-reward
  - name: recommendation
  - name: results-dir
  steps:
  - name: publish-results
    image: image-registry.openshift-image-registry.svc:5000/ab-eval-flow/mcpchecker-ci@sha256:02e170f421ab6f5b3d4a4d301e489a9a817f3b8434593984a7ece46c544bbb99
    computeResources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    command:
    - python
    - -m
    - abevalflow.mcp_ci
    args:
    - bridge
    - --workspace
    - $(workspaces.source.path)
    - --uid
    - $(params.pipeline-run-uid)
    - --run-name
    - $(params.pipeline-run-id)
    - --engine
    - $(params.eval-engine)
    - --submission
    - $(params.submission-name)
