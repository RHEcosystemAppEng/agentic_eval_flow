apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: evaluate-mcpchecker
spec:
  params:
  - name: pipeline-run-uid
    type: string
  - name: pipeline-run-id
    type: string
  - name: submission-dir
    type: string
  - name: submission-name
    type: string
  - name: mcp-credentials-secret
    type: string
    default: mcp-credentials-placeholder
  - name: mcpchecker-agent-model
    type: string
    default: openai:claude-sonnet
  - name: mcpchecker-judge-model
    type: string
    default: openai:claude-sonnet
  - name: mcpchecker-task-timeout
    type: string
    default: 10m
  workspaces:
  - name: source
  steps:
  - name: evaluate
    image: image-registry.openshift-image-registry.svc:5000/ab-eval-flow/mcpchecker-ci@sha256:d74842d2ee9fa8955349ccda7a47d589856c1f1cf81ae0dcc59921524e85bfda
    computeResources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: '1'
        memory: 1Gi
    env:
    - name: MCP_URL
      valueFrom:
        secretKeyRef:
          name: $(params.mcp-credentials-secret)
          key: MCP_URL
          optional: true
    - name: MCP_BEARER_TOKEN
      valueFrom:
        secretKeyRef:
          name: $(params.mcp-credentials-secret)
          key: MCP_BEARER_TOKEN
          optional: true
    - name: OPENAI_API_KEY
      valueFrom:
        secretKeyRef:
          name: llm-credentials
          key: api-key
          optional: true
    - name: LITELLM_PROXY_URL
      value: http://litellm.ab-eval-flow.svc:4000/v1
    command:
    - python
    - -m
    - abevalflow.mcp_ci
    args:
    - evaluate
    - --workspace
    - $(workspaces.source.path)
    - --uid
    - $(params.pipeline-run-uid)
    - --run-name
    - $(params.pipeline-run-id)
    - --submission-dir
    - $(params.submission-dir)
    - --submission
    - $(params.submission-name)
    - --agent-model
    - $(params.mcpchecker-agent-model)
    - --judge-model
    - $(params.mcpchecker-judge-model)
    - --timeout
    - $(params.mcpchecker-task-timeout)
  - name: publish-results
    image: image-registry.openshift-image-registry.svc:5000/ab-eval-flow/mcpchecker-ci@sha256:d74842d2ee9fa8955349ccda7a47d589856c1f1cf81ae0dcc59921524e85bfda
    computeResources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    command:
    - python
    - -m
    - abevalflow.mcp_ci
    args:
    - bridge
    - --workspace
    - $(workspaces.source.path)
    - --uid
    - $(params.pipeline-run-uid)
    - --run-name
    - $(params.pipeline-run-id)
    - --engine
    - mcpchecker
    - --submission
    - $(params.submission-name)
  results:
  - name: treatment-mean-reward
  - name: control-mean-reward
  - name: recommendation
  - name: results-dir
