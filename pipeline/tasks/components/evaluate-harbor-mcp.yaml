apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: evaluate-harbor-mcp
spec:
  params:
  - name: pipeline-run-uid
    type: string
  - name: pipeline-run-id
    type: string
  - name: submission-dir
    type: string
  - name: submission-name
    type: string
  - name: harbor-agent-image
    type: string
  - name: harbor-case
    type: string
  - name: harbor-model
    type: string
  - name: mcp-catalog-configmap
    type: string
  workspaces:
  - name: source
  results:
  - name: treatment-mean-reward
  - name: control-mean-reward
  - name: recommendation
  - name: results-dir
  steps:
  - name: native-harbor-pair
    image: image-registry.openshift-image-registry.svc:5000/ab-eval-flow/harbor-mcp-ci@sha256:42d7b35ae0f9066008df8fea659302030ffc91608499afe1b6786b89ce9aa1e2
    computeResources: &id001
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: '1'
        memory: 1Gi
    env:
    - name: ANTHROPIC_API_KEY
      valueFrom:
        secretKeyRef:
          name: llm-credentials
          key: api-key
    - name: ANTHROPIC_BASE_URL
      value: http://litellm.ab-eval-flow.svc:4000
    - name: POD_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
    - name: MINIO_ENDPOINT
      valueFrom:
        secretKeyRef:
          name: minio-credentials
          key: endpoint-url
    - name: MINIO_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: minio-credentials
          key: root-user
    - name: MINIO_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: minio-credentials
          key: root-password
    command:
    - python
    - -m
    - scripts.run_harbor_mcp
    args:
    - --workspace
    - $(workspaces.source.path)
    - --uid
    - $(params.pipeline-run-uid)
    - --run-name
    - $(params.pipeline-run-id)
    - --submission-dir
    - $(params.submission-dir)
    - --case
    - $(params.harbor-case)
    - --image
    - $(params.harbor-agent-image)
    - --model
    - $(params.harbor-model)
    volumeMounts:
    - name: trusted-mcp-catalog
      mountPath: /opt/ci/config/mcp-mocks
      readOnly: true
  - name: publish-results
    image: image-registry.openshift-image-registry.svc:5000/ab-eval-flow/harbor-mcp-ci@sha256:42d7b35ae0f9066008df8fea659302030ffc91608499afe1b6786b89ce9aa1e2
    computeResources: *id001
    command:
    - python
    - -m
    - abevalflow.mcp_ci
    args:
    - bridge
    - --workspace
    - $(workspaces.source.path)
    - --uid
    - $(params.pipeline-run-uid)
    - --run-name
    - $(params.pipeline-run-id)
    - --engine
    - harbor
    - --submission
    - $(params.submission-name)
    volumeMounts:
    - name: trusted-mcp-catalog
      mountPath: /opt/ci/config/mcp-mocks
      readOnly: true
  volumes:
  - name: trusted-mcp-catalog
    configMap:
      name: $(params.mcp-catalog-configmap)
