apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: mcp-phase1-static
  labels:
    app.kubernetes.io/name: abevalflow
    app.kubernetes.io/component: konflux
spec:
  description: >-
    MCP evaluation Phase 1 - static / build-time analysis (ADR Approach 4).
    Runs three language-agnostic static checks against the MCP server source,
    before deployment and without running the server: secrets management
    (gitleaks), no user-provided code execution (semgrep), and license
    compliance (licensee). Always executes, independent of runtime outcomes;
    resolves to pass/fail only. Normalized scan JSON and per-gate GateResults
    are written under reports/<submission-name>/.
  params:
    - name: mcp-eval-image
      type: string
      default: "quay.io/ecosystem-appeng/abevalflow-mcp-eval:0.1"
      description: >-
        MCP eval image with the scanners (gitleaks, semgrep, licensee) and the
        pipeline code (scripts.mcp, abevalflow.mcp) baked in at PYTHONPATH=/opt.
    - name: source-subdir
      type: string
      default: "."
      description: >-
        Path of the MCP server source within the workspace to scan
        (relative to the workspace root). Defaults to the workspace root.
    - name: submission-name
      type: string
      description: Name used for the report directory (reports/<submission-name>/).
    - name: mode
      type: string
      default: "block"
      description: Gate enforcement mode - block, warn, or disabled.
    - name: allowed-licenses
      type: string
      default: ""
      description: >-
        Space-separated approved SPDX ids overriding the built-in allow-list
        (e.g. "apache-2.0 mit"). Empty uses DEFAULT_ALLOWED_LICENSES.
  workspaces:
    - name: source
      description: Workspace containing the MCP server source to evaluate.
  results:
    - name: phase1-passed
      description: Whether all Phase 1 gates passed (true/false).
    - name: report-path
      description: Workspace-relative path to the Phase 1 reports directory.
  steps:
    - name: scan
      image: $(params.mcp-eval-image)
      # User-controlled params are bound to env vars (Tekton substitutes them as
      # literal strings) instead of inlined into the script, so a value containing
      # shell metacharacters cannot execute in the task pod.
      env:
        - name: SOURCE_SUBDIR
          value: $(params.source-subdir)
        - name: SUBMISSION_NAME
          value: $(params.submission-name)
        - name: ALLOWED_LICENSES
          value: $(params.allowed-licenses)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        SOURCE_DIR="$(workspaces.source.path)/$SOURCE_SUBDIR"
        REPORTS_DIR="$(workspaces.source.path)/reports/$SUBMISSION_NAME"
        mkdir -p "$REPORTS_DIR"

        LICENSE_ARGS=""
        # shellcheck disable=SC2086
        for spdx in $ALLOWED_LICENSES; do
          LICENSE_ARGS="$LICENSE_ARGS --allow $spdx"
        done

        echo "=== Phase 1 scanners on $SOURCE_DIR ==="
        python -m scripts.mcp.run_secrets_scan "$SOURCE_DIR" --reports-dir "$REPORTS_DIR"
        python -m scripts.mcp.run_no_user_code_scan "$SOURCE_DIR" --reports-dir "$REPORTS_DIR"
        # shellcheck disable=SC2086
        python -m scripts.mcp.run_license_scan "$SOURCE_DIR" --reports-dir "$REPORTS_DIR" $LICENSE_ARGS

    - name: gate
      image: $(params.mcp-eval-image)
      env:
        - name: SUBMISSION_NAME
          value: $(params.submission-name)
        - name: MODE
          value: $(params.mode)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        REPORTS_DIR="$(workspaces.source.path)/reports/$SUBMISSION_NAME"

        # Shared gate wrapper (baked in the image): runs the gate module, emits the
        # Tekton results from the summary, and propagates the gate's exit code.
        bash /opt/scripts/mcp/run_gate.sh \
          scripts.mcp.run_phase1_gates \
          "$REPORTS_DIR" \
          "$MODE" \
          "$REPORTS_DIR/phase1-summary.json" \
          "$(results.phase1-passed.path)" \
          "reports/$SUBMISSION_NAME" \
          "$(results.report-path.path)"
