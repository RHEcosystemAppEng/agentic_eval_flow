apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: create-namespace
  labels:
    app.kubernetes.io/name: abevalflow
    app.kubernetes.io/component: konflux
spec:
  description: >-
    Creates an ephemeral, isolated namespace for MCP server evaluation
    on a remote target cluster. Applies security guardrails: NetworkPolicy
    (default deny ingress and egress with scoped DNS and backend allowances),
    ResourceQuota, LimitRange, and restricted pod security standards.
    The namespace is named mcp-eval-<run-id> and is intended to be
    cleaned up by the teardown-namespace task in the finally block.
  params:
    - name: pipeline-run-id
      type: string
      description: Pipeline run ID used to generate a unique namespace name
    - name: backend-endpoints
      type: string
      default: ""
      description: >-
        Comma-separated list of host:port pairs for backend endpoints
        that the MCP server needs to reach. Hostnames are resolved to
        all known IPs at pipeline time (NetworkPolicy requires IPs).
        For stable endpoints, prefer providing IPs directly.
        Example: "10.0.1.5:443,api.internal:5432"
  workspaces:
    - name: target-kubeconfig
      description: >-
        Kubeconfig for the target cluster. Must contain a file named
        "kubeconfig". All oc commands use this to reach the remote cluster.
  results:
    - name: namespace-name
      description: Name of the created ephemeral namespace
  steps:
    - name: create-and-secure
      image: registry.redhat.io/openshift4/ose-cli:latest
      env:
        - name: KUBECONFIG
          value: $(workspaces.target-kubeconfig.path)/kubeconfig
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        echo "=== CREATE EPHEMERAL NAMESPACE ==="

        RUN_ID=$(echo "$(params.pipeline-run-id)" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | cut -c1-40)
        NAMESPACE="mcp-eval-${RUN_ID}"
        LABEL_RUN_ID=$(echo "$(params.pipeline-run-id)" | sed 's/[^a-zA-Z0-9._-]/_/g' | cut -c1-63)
        echo "Namespace: $NAMESPACE"

        cat <<EOF | oc apply -f -
        apiVersion: v1
        kind: Namespace
        metadata:
          name: $NAMESPACE
          labels:
            app.kubernetes.io/part-of: abevalflow
            abevalflow/type: mcp-eval
            abevalflow/pipeline-run: "$LABEL_RUN_ID"
            pod-security.kubernetes.io/enforce: restricted
            pod-security.kubernetes.io/warn: restricted
            pod-security.kubernetes.io/audit: restricted
        EOF

        echo "Namespace created"

        # Default deny all ingress
        cat <<EOF | oc apply -n "$NAMESPACE" -f -
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: default-deny-ingress
          labels:
            app.kubernetes.io/part-of: abevalflow
        spec:
          podSelector: {}
          policyTypes:
            - Ingress
          ingress: []
        EOF

        echo "Applied default deny ingress"

        # Default deny all egress
        cat <<EOF | oc apply -n "$NAMESPACE" -f -
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: default-deny-egress
          labels:
            app.kubernetes.io/part-of: abevalflow
        spec:
          podSelector: {}
          policyTypes:
            - Egress
          egress: []
        EOF

        echo "Applied default deny egress"

        # Allow DNS scoped to OpenShift cluster DNS (openshift-dns namespace).
        # CoreDNS pods listen on 5353; the dns-default Service exposes 53.
        # Both ports are allowed to handle pre- and post-DNAT matching
        # depending on the CNI plugin.
        cat <<EOF | oc apply -n "$NAMESPACE" -f -
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: allow-dns
          labels:
            app.kubernetes.io/part-of: abevalflow
        spec:
          podSelector: {}
          policyTypes:
            - Egress
          egress:
            - to:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: openshift-dns
              ports:
                - protocol: UDP
                  port: 53
                - protocol: TCP
                  port: 53
                - protocol: UDP
                  port: 5353
                - protocol: TCP
                  port: 5353
        EOF

        echo "Applied scoped DNS egress policy"

        # Allow backend endpoints (if specified)
        BACKENDS="$(params.backend-endpoints)"
        if [ -n "$BACKENDS" ]; then
          IFS=',' read -ra ENDPOINT_LIST <<< "$BACKENDS"
          EGRESS_RULES=""
          for ENDPOINT in "${ENDPOINT_LIST[@]}"; do
            HOST=$(echo "$ENDPOINT" | cut -d: -f1)
            PORT=$(echo "$ENDPOINT" | cut -d: -f2)
            # Resolve all IPs for the hostname (not just the first)
            IPS=$(getent ahosts "$HOST" 2>/dev/null | awk '{print $1}' | sort -u || echo "")
            if [ -z "$IPS" ]; then
              echo "  WARNING: Could not resolve $HOST — skipping"
              continue
            fi
            for IP in $IPS; do
              EGRESS_RULES="${EGRESS_RULES}
            - to:
                - ipBlock:
                    cidr: ${IP}/32
              ports:
                - protocol: TCP
                  port: ${PORT}"
              echo "  Allowing egress to $HOST ($IP):$PORT"
            done
          done

          if [ -n "$EGRESS_RULES" ]; then
            cat <<EOF | oc apply -n "$NAMESPACE" -f -
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: allow-backend-egress
          labels:
            app.kubernetes.io/part-of: abevalflow
        spec:
          podSelector: {}
          policyTypes:
            - Egress
          egress:${EGRESS_RULES}
        EOF
            echo "Applied backend egress policy"
          fi
        fi

        # ResourceQuota
        cat <<EOF | oc apply -n "$NAMESPACE" -f -
        apiVersion: v1
        kind: ResourceQuota
        metadata:
          name: mcp-eval-quota
          labels:
            app.kubernetes.io/part-of: abevalflow
        spec:
          hard:
            pods: "20"
            requests.cpu: "8"
            requests.memory: "16Gi"
            limits.cpu: "16"
            limits.memory: "32Gi"
        EOF

        echo "Applied ResourceQuota"

        # LimitRange
        cat <<EOF | oc apply -n "$NAMESPACE" -f -
        apiVersion: v1
        kind: LimitRange
        metadata:
          name: mcp-eval-limits
          labels:
            app.kubernetes.io/part-of: abevalflow
        spec:
          limits:
            - type: Container
              default:
                cpu: "2"
                memory: "4Gi"
              defaultRequest:
                cpu: "500m"
                memory: "1Gi"
              max:
                cpu: "8"
                memory: "16Gi"
        EOF

        echo "Applied LimitRange"
        echo ""
        echo "=== Namespace $NAMESPACE ready ==="

        echo -n "$NAMESPACE" > "$(results.namespace-name.path)"
