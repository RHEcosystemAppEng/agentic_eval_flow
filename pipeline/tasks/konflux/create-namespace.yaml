apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: create-namespace
  labels:
    app.kubernetes.io/name: abevalflow
    app.kubernetes.io/component: konflux
spec:
  description: >-
    Creates an ephemeral namespace for MCP server evaluation on a remote
    target cluster and grants the pipeline ServiceAccount access through a
    RoleBinding. Namespace security restrictions are currently disabled.
    The namespace is named mcp-eval-<run-id> and is intended to be
    cleaned up by the teardown-namespace task in the finally block.
  params:
    - name: pipeline-run-id
      type: string
      description: Pipeline run ID used to generate a unique namespace name
    - name: backend-endpoints
      type: string
      default: ""
      description: >-
        Retained for pipeline compatibility. NetworkPolicy restrictions are
        currently disabled and this parameter is not used.
  workspaces:
    - name: target-kubeconfig
      description: >-
        Kubeconfig for the target cluster. Must contain a file named
        "kubeconfig". All oc commands use this to reach the remote cluster.
  results:
    - name: namespace-name
      description: Name of the created ephemeral namespace
  steps:
    - name: create-and-secure
      image: registry.redhat.io/openshift4/ose-cli:latest
      env:
        - name: KUBECONFIG
          value: $(workspaces.target-kubeconfig.path)/kubeconfig
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        echo "=== CREATE EPHEMERAL NAMESPACE ==="

        RUN_ID=$(echo "$(params.pipeline-run-id)" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | cut -c1-40)
        NAMESPACE="mcp-eval-${RUN_ID}"
        LABEL_RUN_ID=$(echo "$(params.pipeline-run-id)" | sed 's/[^a-zA-Z0-9._-]/_/g' | cut -c1-63)
        echo "Namespace: $NAMESPACE"

        cat <<EOF | oc apply -f -
        apiVersion: v1
        kind: Namespace
        metadata:
          name: $NAMESPACE
          labels:
            app.kubernetes.io/part-of: abevalflow
            abevalflow/type: mcp-eval
            abevalflow/pipeline-run: "$LABEL_RUN_ID"
        EOF

        echo "Namespace created"

        cat <<EOF | oc apply -n "$NAMESPACE" -f -
        apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        metadata:
          name: mcp-eval-ephemeral-access
          labels:
            app.kubernetes.io/part-of: abevalflow
            app.kubernetes.io/name: mcp-eval
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: mcp-eval-ephemeral-access
        subjects:
          - kind: ServiceAccount
            name: mcp-eval-pipeline
            namespace: default
        EOF
        echo "Granted ephemeral access in namespace"
        echo ""
        echo "=== Namespace $NAMESPACE ready ==="

        echo -n "$NAMESPACE" > "$(results.namespace-name.path)"
