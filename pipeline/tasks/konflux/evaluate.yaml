apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: evaluate
  labels:
    app.kubernetes.io/name: abevalflow
    app.kubernetes.io/component: konflux
spec:
  description: >-
    Generic evaluation task for Konflux integration. Dispatches to the
    appropriate evaluation engine (a2a, harbor, ase, mcpchecker, aeh) and supports
    two execution modes: "local" runs evaluation directly in the task step,
    "remote" submits an evaluation Pod to a workload cluster. Consumers
    provide the target endpoint (AGENT_ENDPOINT / MCP_URL) as a parameter;
    this task does not deploy or manage any target services.

    Validated engine x mode combinations:
      a2a + remote: fully tested (E2E on Konflux)
      a2a + local:  supported (agent must be reachable from pipeline cluster)
      mcpchecker + local: supported (MCP server must be reachable)
      mcpchecker + remote: supported (untested)
      ase + local: supported (no external endpoint needed)
      aeh + local: supported (spawns trial pods in-cluster; requires pod-creation RBAC)
      harbor + local: limited (no scaffold/build; uses local environment only)
      harbor + remote: not supported (use standalone Agentic Eval Flow pipeline)
  params:
    - name: eval-engine
      type: string
      description: "Evaluation engine: harbor, ase, mcpchecker, a2a, aeh"
    - name: submission-dir
      type: string
      description: Submission directory name under submissions/
    - name: submission-name
      type: string
      description: Validated submission name from prepare task
    - name: commit-sha
      type: string
      default: ""
    - name: pipeline-run-id
      type: string
    - name: pipeline-repo-url
      type: string
      default: "https://github.com/RHEcosystemAppEng/agentic_eval_flow.git"
      description: Git URL of the pipeline repo (only used by remote eval mode)
    - name: pipeline-repo-revision
      type: string
      default: "main"
      description: Git revision of the pipeline repo (only used by remote eval mode)
    - name: submission-repo-url
      type: string
      default: ""
      description: >-
        Git repo containing the submission definition. Required for remote
        mode when submissions are in a different repo from the pipeline.
        If empty, falls back to pipeline-repo-url.
    - name: submission-repo-revision
      type: string
      default: "main"
      description: Git branch/tag/SHA of the submission repo
    - name: eval-base-image
      type: string
      default: "quay.io/ecosystem-appeng/abevalflow-eval-base:latest"
      description: Container image with Harbor + dependencies pre-installed
    - name: llm-model
      type: string
      default: "claude-sonnet"
    - name: llm-api-base
      type: string
      default: ""
      description: LLM proxy base URL for judging (e.g. http://litellm.ns.svc:4000)
    - name: llm-api-key
      type: string
      default: "sk-dummy"
    - name: agent-endpoint
      type: string
      default: ""
      description: "HTTP endpoint of the A2A agent (required when eval-engine=a2a)"
    - name: agent-timeout
      type: string
      default: "120"
      description: A2A agent request timeout in seconds
    - name: mcp-url
      type: string
      default: ""
      description: "URL of the MCP server (required when eval-engine=mcpchecker)"
    - name: mcpchecker-agent-model
      type: string
      default: ""
      description: "MCPChecker agent model (e.g. google:gemini-2.5-flash). Empty = mcpchecker default."
    - name: mcpchecker-judge-model
      type: string
      default: ""
      description: "MCPChecker judge model (e.g. openai:gpt-4o). Empty = mcpchecker default."
    - name: mcpchecker-task-timeout
      type: string
      default: "10m"
    - name: ase-iterations
      type: string
      default: "5"
    - name: ase-concurrency
      type: string
      default: "1"
    - name: ase-judge-model
      type: string
      default: ""
    - name: uplift-threshold
      type: string
      default: "0.0"
    # AEH (Agent-Eval-Harness) params
    - name: aeh-mode
      type: string
      default: "single"
      description: "AEH evaluation mode: single or pairwise"
    - name: aeh-image
      type: string
      default: "quay.io/ecosystem-appeng/agent-eval-harness:v1.1.8"
      description: Container image for AEH trial pods
    - name: aeh-model-override
      type: string
      default: ""
      description: Override models.skill from eval.yaml (empty = use eval.yaml value)
    - name: aeh-judge-model-override
      type: string
      default: ""
      description: Override models.judge from eval.yaml (empty = use eval.yaml value)
    - name: aeh-runner
      type: string
      default: "harbor"
      description: "AEH execution backend: harbor or vanilla"
    - name: aeh-control-config
      type: string
      default: "eval-control.yaml"
      description: Control variant eval.yaml filename for pairwise mode
    - name: aeh-treatment-config
      type: string
      default: "eval-treatment.yaml"
      description: Treatment variant eval.yaml filename for pairwise mode
    - name: aeh-kubeconfig-secret
      type: string
      default: ""
      description: >-
        Name of a Secret containing a 'kubeconfig' key for an external cluster
        where AEH trial pods should run. When empty, AEH uses in-cluster
        credentials and spawns pods in the pipeline namespace.
    - name: eval-mode
      type: string
      default: "local"
      description: >-
        "local" runs eval directly in the task step (target must be reachable
        from the pipeline cluster). "remote" submits an eval Pod to the
        workload cluster (for cross-cluster scenarios).
    - name: workload-cluster-url
      type: string
      default: ""
      description: API URL of the workload cluster (required when eval-mode=remote)
    - name: workload-namespace
      type: string
      default: ""
      description: Namespace on the workload cluster (required when eval-mode=remote)
    - name: workload-credentials-secret
      type: string
      default: "workload-cluster-credentials"
      description: >-
        Name of the Secret containing 'token' key for the workload cluster.
        Only used when eval-mode=remote.
    - name: eval-timeout
      type: string
      default: "1800"
      description: Timeout in seconds for remote eval Pod
  workspaces:
    - name: source
  results:
    - name: treatment-mean-reward
      description: Treatment/with-skill mean reward
    - name: control-mean-reward
      description: Control/without-skill mean reward
    - name: recommendation
      description: Pass or fail recommendation
    - name: results-dir
      description: Path to evaluation results
  volumes:
    - name: aeh-kubeconfig
      secret:
        secretName: $(params.aeh-kubeconfig-secret)
        optional: true
  steps:
    - name: run-eval
      image: quay.io/ecosystem-appeng/agent-eval-harness:v1.1.8
      volumeMounts:
        - name: aeh-kubeconfig
          mountPath: /tmp/aeh-kubeconfig
          readOnly: true
      env:
        - name: GIT_SSL_NO_VERIFY
          value: "true"
        - name: WORKLOAD_TOKEN
          valueFrom:
            secretKeyRef:
              name: $(params.workload-credentials-secret)
              key: token
              optional: true
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: llm-credentials
              key: api-key
              optional: true
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        echo "=== EVALUATE PHASE ==="

        EVAL_ENGINE="$(params.eval-engine)"
        EVAL_MODE="$(params.eval-mode)"
        SUBMISSION_NAME="$(params.submission-name)"
        SUBMISSION_DIR="$(params.submission-dir)"
        AGENT_ENDPOINT="$(params.agent-endpoint)"
        MCP_URL="$(params.mcp-url)"
        COMMIT_SHA="$(params.commit-sha)"
        PIPELINE_RUN_ID="$(params.pipeline-run-id)"
        UPLIFT_THRESHOLD="$(params.uplift-threshold)"
        LLM_API_KEY="${OPENAI_API_KEY:-$(params.llm-api-key)}"
        export OPENAI_API_KEY="$LLM_API_KEY"

        SUBMISSION_REPO_URL="$(params.submission-repo-url)"
        SUBMISSION_REPO_REV="$(params.submission-repo-revision)"
        if [ -z "$SUBMISSION_REPO_URL" ]; then
          SUBMISSION_REPO_URL="$(params.pipeline-repo-url)"
          SUBMISSION_REPO_REV="$(params.pipeline-repo-revision)"
        fi

        echo "Engine: $EVAL_ENGINE"
        echo "Mode: $EVAL_MODE"
        echo "Submission: $SUBMISSION_NAME"

        # Install CLI tools (ubi9/python-311 doesn't ship oc/kubectl)
        export PATH="$HOME/bin:$PATH"
        mkdir -p "$HOME/bin"
        if ! command -v kubectl &>/dev/null; then
          curl -sLo "$HOME/bin/kubectl" "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x "$HOME/bin/kubectl"
        fi
        if ! command -v oc &>/dev/null; then
          curl -sLo /tmp/oc.tar.gz "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz"
          tar -xzf /tmp/oc.tar.gz -C "$HOME/bin" oc && rm -f /tmp/oc.tar.gz
        fi

        RESULTS_DIR="$(workspaces.source.path)/eval-results/$SUBMISSION_NAME"
        REPORT_DIR="$(workspaces.source.path)/reports/$SUBMISSION_NAME"
        mkdir -p "$RESULTS_DIR" "$REPORT_DIR"

        echo -n "0.0" > "$(results.treatment-mean-reward.path)"
        echo -n "0.0" > "$(results.control-mean-reward.path)"
        echo -n "fail" > "$(results.recommendation.path)"
        echo -n "$RESULTS_DIR" > "$(results.results-dir.path)"

        PIPELINE_DIR="/opt/agent-eval-harness"

        # ================================================================
        # REMOTE MODE: submit an eval Pod to the workload cluster
        # ================================================================
        if [ "$EVAL_MODE" = "remote" ]; then
          echo "=== Remote eval mode ==="

          if [ -z "${WORKLOAD_TOKEN:-}" ]; then
            echo "ERROR: workload-credentials-secret has no token for remote mode"
            exit 1
          fi

          CLUSTER_URL="$(params.workload-cluster-url)"
          NAMESPACE="$(params.workload-namespace)"
          if [ -z "$CLUSTER_URL" ] || [ -z "$NAMESPACE" ]; then
            echo "ERROR: workload-cluster-url and workload-namespace required for remote mode"
            exit 1
          fi

          # TODO: Replace --insecure-skip-tls-verify with --certificate-authority
          oc login --server="$CLUSTER_URL" --token="$WORKLOAD_TOKEN" --insecure-skip-tls-verify=true 2>/dev/null

          RUN_ID=$(echo "$PIPELINE_RUN_ID" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | cut -c1-20)
          POD_NAME="eval-job-${RUN_ID:-$(date +%s)}"
          echo "Eval pod: $POD_NAME"
          echo "Submission repo: $SUBMISSION_REPO_URL @ $SUBMISSION_REPO_REV"

          cat <<PODSPEC | oc apply -n $NAMESPACE -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: $POD_NAME
            namespace: $NAMESPACE
            labels:
              abevalflow/temp: "true"
              abevalflow/type: eval-job
          spec:
            restartPolicy: Never
            activeDeadlineSeconds: $(params.eval-timeout)
            containers:
            - name: eval
              image: $(params.eval-base-image)
              command: ["/bin/bash", "-c"]
              args:
              - |
                set -euo pipefail
                export HOME=/tmp

                echo "=== Remote Eval Pod Starting ==="
                echo "Engine: $EVAL_ENGINE"

                git clone --depth 1 --branch "$(params.pipeline-repo-revision)" \
                  "$(params.pipeline-repo-url)" /tmp/abevalflow
                cd /tmp/abevalflow
                export PYTHONPATH=/tmp/abevalflow
                pip install --quiet --no-cache-dir pydantic scipy pyyaml 2>&1 | tail -1

                # Clone submission repo if different from pipeline repo
                SUBMISSION_PATH="/tmp/abevalflow/submissions/$SUBMISSION_DIR"
                if [ "$SUBMISSION_REPO_URL" != "$(params.pipeline-repo-url)" ] || [ "$SUBMISSION_REPO_REV" != "$(params.pipeline-repo-revision)" ]; then
                  echo "Cloning submission repo: $SUBMISSION_REPO_URL @ $SUBMISSION_REPO_REV"
                  git clone --depth 1 --branch "$SUBMISSION_REPO_REV" \
                    "$SUBMISSION_REPO_URL" /tmp/submission-repo
                  SUBMISSION_PATH="/tmp/submission-repo/submissions/$SUBMISSION_DIR"
                fi

                if [ ! -d "\$SUBMISSION_PATH" ]; then
                  echo "ERROR: Submission not found at \$SUBMISSION_PATH"
                  exit 1
                fi

                RESULTS_DIR="/tmp/eval-results"
                REPORT_DIR="/tmp/eval-reports"
                mkdir -p "\$RESULTS_DIR" "\$REPORT_DIR"

                if [ "$EVAL_ENGINE" = "a2a" ]; then
                  N_ATTEMPTS=\$(python3 -c "
                import yaml
                try:
                    meta = yaml.safe_load(open('\$SUBMISSION_PATH/metadata.yaml'))
                    print(meta.get('experiment', {}).get('n_trials', 5))
                except:
                    print(5)
                ")

                  TASK_DIR=""
                  if [ -f "\$SUBMISSION_PATH/task.toml" ]; then
                    TASK_DIR="\$SUBMISSION_PATH"
                  elif [ -d "\$SUBMISSION_PATH/tasks" ]; then
                    for subdir in "\$SUBMISSION_PATH/tasks"/*/; do
                      if [ -f "\${subdir}task.toml" ]; then
                        TASK_DIR="\${subdir%/}"
                        break
                      fi
                    done
                  fi

                  if [ -z "\$TASK_DIR" ]; then
                    echo "ERROR: No task.toml found"
                    exit 1
                  fi

                  echo "Task: \$(basename \$TASK_DIR) | Attempts: \$N_ATTEMPTS"

                  python3 - "\$RESULTS_DIR" "\$TASK_DIR" "\$N_ATTEMPTS" "$AGENT_ENDPOINT" "$(params.agent-timeout)" "$(params.llm-api-base)" "openai/$(params.llm-model)" <<'GENCFG'
                import sys, yaml
                results_dir, task_dir, n_attempts, endpoint, timeout, llm_api_base, llm_model = sys.argv[1:8]
                config = {
                    "job_name": "a2a-eval",
                    "jobs_dir": results_dir,
                    "n_attempts": int(n_attempts),
                    "agents": [{"import_path": "abevalflow.harbor_agents.a2a_adapter:A2AAgent", "kwargs": {"endpoint": endpoint, "timeout": int(timeout)}}],
                    "tasks": [{"path": task_dir}],
                    "environment": {"type": "local"},
                    "verifier": {"env": {"LLM_JUDGE_MODEL": llm_model, "LLM_API_BASE": llm_api_base, "OPENAI_API_KEY": "sk-dummy"}}
                }
                with open(results_dir + "/config.yaml", "w") as f:
                    yaml.dump(config, f, default_flow_style=False)
                GENCFG

                  python3 -c "from abevalflow.harbor_agents.a2a_adapter import A2AAgent; print('A2AAgent imported OK')"
                  HARBOR_EXIT=0
                  harbor run -c "\$RESULTS_DIR/config.yaml" -y 2>&1 || HARBOR_EXIT=\$?
                  echo "Harbor exit code: \$HARBOR_EXIT"
                  if [ "\$HARBOR_EXIT" -ne 0 ] && [ ! -f "\$RESULTS_DIR/a2a-eval/result.json" ]; then
                    find "\$RESULTS_DIR" -name "exception.txt" -exec echo "--- {} ---" \; -exec cat {} \; 2>/dev/null || true
                    echo "ERROR: Harbor failed and produced no results"
                    exit 1
                  fi
                  find "\$RESULTS_DIR" -name "exception.txt" -exec echo "--- {} ---" \; -exec cat {} \; 2>/dev/null || true

                elif [ "$EVAL_ENGINE" = "mcpchecker" ]; then
                  echo "=== MCPChecker Evaluation ==="
                  pip install --quiet --no-cache-dir mcpchecker 2>&1 | tail -1
                  cd "\$SUBMISSION_PATH"
                  export MCP_URL="$MCP_URL"
                  envsubst < mcp-config.yaml > mcp-config-resolved.yaml 2>/dev/null || cp mcp-config.yaml mcp-config-resolved.yaml
                  CHECKER_EXIT=0
                  mcpchecker check eval.yaml --mcp-config-file mcp-config-resolved.yaml -o json > "\$RESULTS_DIR/mcpchecker-out.json" 2>&1 || CHECKER_EXIT=\$?
                  if [ "\$CHECKER_EXIT" -ne 0 ]; then
                    echo "WARNING: mcpchecker exited with code \$CHECKER_EXIT"
                  fi
                fi

                echo "=== Running analyze.py ==="
                ANALYZE_ARGS=(
                  --results-dir "\$RESULTS_DIR"
                  --output-dir "\$REPORT_DIR"
                  --submission-name "$SUBMISSION_NAME"
                  --threshold "$UPLIFT_THRESHOLD"
                  --eval-engine "$EVAL_ENGINE"
                )
                [ -n "$COMMIT_SHA" ] && ANALYZE_ARGS+=(--commit-sha "$COMMIT_SHA")
                [ -n "$PIPELINE_RUN_ID" ] && ANALYZE_ARGS+=(--pipeline-run-id "$PIPELINE_RUN_ID")

                python scripts/analyze.py "\${ANALYZE_ARGS[@]}" 2>&1
                if [ ! -f "\$REPORT_DIR/report.json" ]; then
                  echo "ERROR: analyze.py did not produce report.json"
                  exit 1
                fi

                echo "=== REPORT_JSON_START ==="
                cat "\$REPORT_DIR/report.json"
                echo ""
                echo "=== REPORT_JSON_END ==="

                python3 -c "
                import json
                r = json.load(open('\$REPORT_DIR/report.json'))
                s = r.get('summary', {})
                t = s.get('treatment', {}).get('mean_reward')
                rec = s.get('recommendation', 'fail')
                n = s.get('treatment', {}).get('n_trials', 0)
                print(json.dumps({'mean_reward': t if t is not None else 0.0, 'recommendation': rec, 'n_trials': n}))
                "

                echo "=== Remote Eval Pod Complete ==="
              env:
              - name: HOME
                value: /tmp
              - name: LLM_JUDGE_MODEL
                value: "openai/$(params.llm-model)"
              - name: LLM_BASE_URL
                value: "$(params.llm-api-base)"
              - name: LLM_API_BASE
                value: "$(params.llm-api-base)"
              - name: OPENAI_API_KEY
                value: "$(params.llm-api-key)"
              resources:
                requests:
                  cpu: 200m
                  memory: 512Mi
                limits:
                  cpu: "1"
                  memory: 2Gi
        PODSPEC

          echo "Eval pod submitted. Waiting for completion..."

          TIMEOUT=$(params.eval-timeout)
          POLL_INTERVAL=15
          ELAPSED=0

          while [ $ELAPSED -lt $TIMEOUT ]; do
            PHASE=$(oc get pod $POD_NAME -n $NAMESPACE -o jsonpath='{.status.phase}' 2>/dev/null || echo "Unknown")
            case "$PHASE" in
              Succeeded)
                echo "Eval pod completed successfully (${ELAPSED}s)"
                break
                ;;
              Failed)
                echo "Eval pod failed (${ELAPSED}s)"
                oc logs $POD_NAME -n $NAMESPACE 2>&1 | tail -50
                break
                ;;
              *)
                printf "."
                sleep $POLL_INTERVAL
                ELAPSED=$((ELAPSED + POLL_INTERVAL))
                ;;
            esac
          done
          echo ""

          if [ $ELAPSED -ge $TIMEOUT ]; then
            echo "TIMEOUT: Eval pod did not complete in ${TIMEOUT}s"
            oc logs $POD_NAME -n $NAMESPACE 2>&1 | tail -30
            oc delete pod $POD_NAME -n $NAMESPACE --ignore-not-found=true
            exit 1
          fi

          if [ "$PHASE" = "Failed" ]; then
            echo "ERROR: Remote eval pod failed"
            oc delete pod $POD_NAME -n $NAMESPACE --ignore-not-found=true
            exit 1
          fi

          echo "=== Retrieving results ==="
          oc logs $POD_NAME -n $NAMESPACE 2>&1 | tee /tmp/eval-pod-logs.txt

          python3 - /tmp/eval-pod-logs.txt "$REPORT_DIR" "$(results.treatment-mean-reward.path)" "$(results.control-mean-reward.path)" "$(results.recommendation.path)" <<'EXTRACT'
        import json, re, sys

        logs_path, report_dir, treat_path, ctrl_path, rec_path = sys.argv[1:6]
        logs = open(logs_path).read()

        report_match = re.search(r'=== REPORT_JSON_START ===\n(.*?)\n=== REPORT_JSON_END ===', logs, re.DOTALL)
        if report_match:
            report_json = report_match.group(1).strip()
            try:
                report = json.loads(report_json)
                with open(f"{report_dir}/report.json", "w") as f:
                    json.dump(report, f, indent=2)
                print(f"Wrote report.json to {report_dir}/report.json")

                s = report.get("summary", {})
                t_reward = s.get("treatment", {}).get("mean_reward")
                recommendation = s.get("recommendation", "fail")
                print(f"Treatment mean reward: {t_reward}")
                print(f"Recommendation: {recommendation}")

                open(treat_path, "w").write(str(t_reward if t_reward is not None else 0.0))
                open(ctrl_path, "w").write("0.0")
                open(rec_path, "w").write(recommendation)
            except json.JSONDecodeError as e:
                print(f"ERROR: Failed to parse report.json: {e}")
                sys.exit(1)
        else:
            print("ERROR: Could not extract report.json from pod logs")
            sys.exit(1)
        EXTRACT

          oc delete pod $POD_NAME -n $NAMESPACE --ignore-not-found=true
          echo "=== Remote evaluate phase complete ==="
          exit 0
        fi

        # ================================================================
        # LOCAL MODE: run evaluation directly in the task step
        # ================================================================
        echo "=== Local eval mode ==="

        cd "$PIPELINE_DIR"
        export PYTHONPATH="$PIPELINE_DIR:${PYTHONPATH:-}"

        SUBMISSION_PATH="$(workspaces.source.path)/submissions/$SUBMISSION_DIR"

        # ---------- A2A Engine ----------
        if [ "$EVAL_ENGINE" = "a2a" ]; then
          if [ -z "$AGENT_ENDPOINT" ]; then
            echo "ERROR: agent-endpoint is required for a2a engine"
            exit 1
          fi

          echo "=== A2A Evaluation (local) ==="
          echo "Agent endpoint: $AGENT_ENDPOINT"

          N_ATTEMPTS=$(python3 -c "
        import yaml
        try:
            meta = yaml.safe_load(open('$SUBMISSION_PATH/metadata.yaml'))
            print(meta.get('experiment', {}).get('n_trials', 5))
        except:
            print(5)
        ")

          TASK_DIR=""
          if [ -f "$SUBMISSION_PATH/task.toml" ]; then
            TASK_DIR="$SUBMISSION_PATH"
          elif [ -d "$SUBMISSION_PATH/tasks" ]; then
            for subdir in "$SUBMISSION_PATH/tasks"/*/; do
              if [ -f "${subdir}task.toml" ]; then
                TASK_DIR="${subdir%/}"
                break
              fi
            done
          fi

          if [ -z "$TASK_DIR" ]; then
            echo "ERROR: No task.toml found in submission"
            exit 1
          fi

          echo "Task: $(basename $TASK_DIR) | Attempts: $N_ATTEMPTS"

          CONFIG_FILE="$RESULTS_DIR/a2a-config.yaml"
          LLM_API_BASE="$(params.llm-api-base)"
          LLM_MODEL="openai/$(params.llm-model)"

          python3 - "$CONFIG_FILE" "$TASK_DIR" "$RESULTS_DIR" "$N_ATTEMPTS" "$AGENT_ENDPOINT" "$(params.agent-timeout)" "$LLM_API_BASE" "$LLM_MODEL" <<'GENCFG'
        import sys, yaml
        config_file, task_dir, results_dir, n_attempts, endpoint, timeout, llm_api_base, llm_model = sys.argv[1:9]
        config = {
            "job_name": "a2a-eval",
            "jobs_dir": results_dir,
            "n_attempts": int(n_attempts),
            "agents": [{"import_path": "abevalflow.harbor_agents.a2a_adapter:A2AAgent", "kwargs": {"endpoint": endpoint, "timeout": int(timeout)}}],
            "tasks": [{"path": task_dir}],
            "environment": {"type": "local"},
            "verifier": {"env": {"LLM_JUDGE_MODEL": llm_model, "LLM_API_BASE": llm_api_base, "OPENAI_API_KEY": "sk-dummy"}}
        }
        with open(config_file, "w") as f:
            yaml.dump(config, f, default_flow_style=False)
        GENCFG

          python3 -c "from abevalflow.harbor_agents.a2a_adapter import A2AAgent; print('A2AAgent imported OK')"

          # harbor-bench isn't baked into the agent-eval-harness image. The
          # image's Python is already a virtualenv, so a plain/`--user` pip
          # install fails against it (EACCES / "not visible in this
          # virtualenv") -- a fresh venv with --system-site-packages
          # sidesteps both while keeping the baked packages visible.
          HARBOR_BENCH_VENV=$(mktemp -d)
          if python3 -m venv --system-site-packages "$HARBOR_BENCH_VENV" >/dev/null 2>&1 \
              && "$HARBOR_BENCH_VENV/bin/pip" install --quiet --no-cache-dir harbor-bench 2>&1 | tail -3; then
            export PATH="$HARBOR_BENCH_VENV/bin:$PATH"
          else
            echo "WARNING: failed to provision harbor-bench venv, continuing with baked harbor CLI if present"
          fi
          HARBOR_EXIT=0
          harbor run -c "$CONFIG_FILE" -y 2>&1 || HARBOR_EXIT=$?
          echo "Harbor exit code: $HARBOR_EXIT"
          find "$RESULTS_DIR" -name "exception.txt" -exec echo "--- {} ---" \; -exec cat {} \; 2>/dev/null || true
          if [ "$HARBOR_EXIT" -ne 0 ]; then
            RESULT_COUNT=$(find "$RESULTS_DIR" -name "result.json" 2>/dev/null | wc -l)
            if [ "$RESULT_COUNT" -eq 0 ]; then
              echo "ERROR: Harbor failed with no results produced"
              exit 1
            fi
            echo "WARNING: Harbor exit $HARBOR_EXIT but $RESULT_COUNT result(s) found, continuing"
          fi

        # ---------- MCPChecker Engine ----------
        elif [ "$EVAL_ENGINE" = "mcpchecker" ]; then
          if [ -z "$MCP_URL" ]; then
            echo "ERROR: mcp-url is required for mcpchecker engine"
            exit 1
          fi

          echo "=== MCPChecker Evaluation (local) ==="
          echo "MCP URL: $MCP_URL"
          # mcpchecker isn't baked into the agent-eval-harness image -- see
          # the harbor-bench install above for why a fresh
          # --system-site-packages venv (not --user) is required here.
          MCPCHECKER_VENV=$(mktemp -d)
          if python3 -m venv --system-site-packages "$MCPCHECKER_VENV" >/dev/null 2>&1 \
              && "$MCPCHECKER_VENV/bin/pip" install --quiet --no-cache-dir mcpchecker 2>&1 | tail -3; then
            export PATH="$MCPCHECKER_VENV/bin:$PATH"
          else
            echo "ERROR: failed to provision mcpchecker venv"
            exit 1
          fi

          cd "$SUBMISSION_PATH"
          export MCP_URL
          envsubst < mcp-config.yaml > mcp-config-resolved.yaml 2>/dev/null || cp mcp-config.yaml mcp-config-resolved.yaml

          if [ -n "$(params.llm-api-base)" ]; then
            export OPENAI_BASE_URL="$(params.llm-api-base)"
          fi

          CHECKER_EXIT=0
          mcpchecker check eval.yaml --mcp-config-file mcp-config-resolved.yaml -o json > "$RESULTS_DIR/mcpchecker-out.json" 2>&1 || CHECKER_EXIT=$?
          if [ "$CHECKER_EXIT" -ne 0 ]; then
            echo "WARNING: mcpchecker exited with code $CHECKER_EXIT"
          fi
          if [ ! -s "$RESULTS_DIR/mcpchecker-out.json" ]; then
            echo "ERROR: mcpchecker produced no output"
            exit 1
          fi

          python3 - "$RESULTS_DIR/mcpchecker-out.json" "$SUBMISSION_NAME" "$REPORT_DIR" "$PIPELINE_RUN_ID" <<'AGGREGATE'
        import json, sys
        from pathlib import Path
        output_file, sub_name, report_dir, run_id = sys.argv[1:5]
        try:
            data = json.loads(Path(output_file).read_text())
            total = data.get("total_checks", 0)
            passed = data.get("passed_checks", 0)
            score = passed / total if total > 0 else 0.0
            rec = "pass" if score >= 0.7 else "fail"
            report = {"summary": {"submission_name": sub_name, "recommendation": rec, "treatment": {"mean_reward": score, "n_trials": total}, "control": {"mean_reward": 0.0}}, "pipeline_run_id": run_id}
            Path(report_dir).mkdir(parents=True, exist_ok=True)
            (Path(report_dir) / "report.json").write_text(json.dumps(report, indent=2))
            print(f"MCPChecker score: {score:.4f}, recommendation: {rec}")
        except Exception as e:
            print(f"ERROR: MCPChecker aggregation failed: {e}")
            sys.exit(1)
        AGGREGATE

          cd "$PIPELINE_DIR"

        # ---------- ASE Engine ----------
        elif [ "$EVAL_ENGINE" = "ase" ]; then
          echo "=== ASE Evaluation (local) ==="

          ITERATIONS="$(params.ase-iterations)"
          LLM_MODEL="$(params.llm-model)"
          BASE_URL="$(params.llm-api-base)"
          JUDGE_MODEL="$(params.ase-judge-model)"
          CONCURRENCY="$(params.ase-concurrency)"

          if [ -f "$SUBMISSION_PATH/metadata.yaml" ]; then
            OVERRIDES=$(python3 -c "import yaml,sys;m=yaml.safe_load(open(sys.argv[1]))or{};e=m.get('experiment')or{};l=m.get('llm')or{};e.get('n_trials')and print('ITERATIONS='+str(e['n_trials']));l.get('model')and print('LLM_MODEL='+str(l['model']));l.get('api_base')and print('BASE_URL='+str(l['api_base']));l.get('judge_model')and print('JUDGE_MODEL='+str(l['judge_model']));e.get('concurrency')and print('CONCURRENCY='+str(e['concurrency']))" "$SUBMISSION_PATH/metadata.yaml" 2>/dev/null || true)
            eval "$OVERRIDES"
          fi

          ITERATIONS="${ITERATIONS:-5}"
          LLM_MODEL="${LLM_MODEL:-claude-sonnet}"
          BASE_URL="${BASE_URL:-}"
          JUDGE_MODEL="${JUDGE_MODEL:-$LLM_MODEL}"
          CONCURRENCY="${CONCURRENCY:-1}"
          [[ -n "$BASE_URL" && "$BASE_URL" != */v1 ]] && BASE_URL="${BASE_URL}/v1"

          echo "  Iterations: $ITERATIONS | Model: $LLM_MODEL | Judge: $JUDGE_MODEL"

          SKILL_DIR=""
          if [ -f "$SUBMISSION_PATH/skills/SKILL.md" ]; then
            SKILL_DIR="$SUBMISSION_PATH/skills"
          else
            for dir in "$SUBMISSION_PATH"/skills/*/; do
              if [ -f "${dir}SKILL.md" ]; then
                SKILL_DIR="$dir"
                break
              fi
            done
          fi

          if [ -z "$SKILL_DIR" ]; then
            echo "ERROR: No SKILL.md found in submission"
            exit 1
          fi

          if [ ! -f "$SKILL_DIR/evals/evals.json" ] && [ -f "$SUBMISSION_PATH/evals/evals.json" ]; then
            ln -sf "$SUBMISSION_PATH/evals" "$SKILL_DIR/evals"
          fi

          npm install --global agent-skills-eval 2>&1 | tail -3

          ASE_FAILURES=0
          for i in $(seq 1 "$ITERATIONS"); do
            echo "--- ASE Iteration $i/$ITERATIONS ---"
            ASE_ARGS=("$SKILL_DIR" --baseline --layout iteration --report)
            [ -n "$BASE_URL" ] && ASE_ARGS+=(--base-url "$BASE_URL")
            ASE_ARGS+=(--target "$LLM_MODEL" --judge "$JUDGE_MODEL")
            ASE_ARGS+=(--concurrency "$CONCURRENCY" --workspace "$RESULTS_DIR/iteration-$i")
            ASE_ARGS+=(--api-key-env OPENAI_API_KEY)
            agent-skills-eval "${ASE_ARGS[@]}" || ASE_FAILURES=$((ASE_FAILURES + 1))
          done
          if [ "$ASE_FAILURES" -eq "$ITERATIONS" ]; then
            echo "ERROR: All $ITERATIONS ASE iterations failed"
            exit 1
          fi
          [ "$ASE_FAILURES" -gt 0 ] && echo "WARNING: $ASE_FAILURES/$ITERATIONS ASE iterations failed"

        # ---------- Harbor Engine ----------
        elif [ "$EVAL_ENGINE" = "harbor" ]; then
          echo "=== Harbor Evaluation (local) ==="
          echo "NOTE: Local Harbor mode uses environment.type=local (no scaffold/build)."
          echo "For full Harbor A/B with container registry, use the standalone pipeline."

          # See the a2a branch above for why a --system-site-packages venv
          # (not a plain/`--user` pip install) is required on this image.
          HARBOR_BENCH_VENV=$(mktemp -d)
          if python3 -m venv --system-site-packages "$HARBOR_BENCH_VENV" >/dev/null 2>&1 \
              && "$HARBOR_BENCH_VENV/bin/pip" install --quiet --no-cache-dir harbor-bench 2>&1 | tail -3; then
            export PATH="$HARBOR_BENCH_VENV/bin:$PATH"
          else
            echo "WARNING: failed to provision harbor-bench venv, continuing with baked harbor CLI if present"
          fi

          TASK_DIR=""
          if [ -f "$SUBMISSION_PATH/task.toml" ]; then
            TASK_DIR="$SUBMISSION_PATH"
          elif [ -d "$SUBMISSION_PATH/tasks" ]; then
            for subdir in "$SUBMISSION_PATH/tasks"/*/; do
              if [ -f "${subdir}task.toml" ]; then
                TASK_DIR="${subdir%/}"
                break
              fi
            done
          fi

          if [ -n "$TASK_DIR" ]; then
            echo "Running Harbor with local environment for: $(basename $TASK_DIR)"
            N_ATTEMPTS=$(python3 -c "import yaml;m=yaml.safe_load(open('$SUBMISSION_PATH/metadata.yaml'));print(m.get('experiment',{}).get('n_trials',5))" 2>/dev/null || echo "5")

            python3 - "$RESULTS_DIR" "$TASK_DIR" "$N_ATTEMPTS" "$(params.llm-api-base)" "openai/$(params.llm-model)" <<'HARBORCFG'
        import sys, yaml
        results_dir, task_dir, n_attempts, llm_api_base, llm_model = sys.argv[1:6]
        config = {
            "job_name": "harbor-eval",
            "jobs_dir": results_dir,
            "n_attempts": int(n_attempts),
            "tasks": [{"path": task_dir}],
            "environment": {"type": "local"},
            "verifier": {"env": {"LLM_JUDGE_MODEL": llm_model, "LLM_API_BASE": llm_api_base, "OPENAI_API_KEY": "sk-dummy"}}
        }
        with open(results_dir + "/config.yaml", "w") as f:
            yaml.dump(config, f, default_flow_style=False)
        HARBORCFG
            HARBOR_EXIT=0
            harbor run -c "$RESULTS_DIR/config.yaml" -y 2>&1 || HARBOR_EXIT=$?
            if [ "$HARBOR_EXIT" -ne 0 ]; then
              echo "WARNING: Harbor exited with code $HARBOR_EXIT"
            fi
          else
            echo "ERROR: No task.toml found, cannot run Harbor eval"
            exit 1
          fi

        # ---------- AEH Engine ----------
        elif [ "$EVAL_ENGINE" = "aeh" ]; then
          echo "=== AEH Evaluation (local) ==="
          AEH_MODE="$(params.aeh-mode)"
          AEH_RUNNER="$(params.aeh-runner)"
          AEH_IMAGE="$(params.aeh-image)"
          echo "Mode: $AEH_MODE | Runner: $AEH_RUNNER"

          # AEH Harbor runner needs these env vars to spawn trial pods
          if [ -f /tmp/aeh-kubeconfig/kubeconfig ]; then
            echo "External kubeconfig detected, configuring remote cluster access"
            export KUBECONFIG=/tmp/aeh-kubeconfig/kubeconfig
            # Force the Python kubernetes client to use KUBECONFIG instead of
            # in-cluster SA token (which would target the Konflux cluster).
            unset KUBERNETES_SERVICE_HOST KUBERNETES_SERVICE_PORT 2>/dev/null || true
            WORKLOAD_NS="$(params.workload-namespace)"
            if [ -n "$WORKLOAD_NS" ]; then
              kubectl config set-context --current --namespace="$WORKLOAD_NS" 2>/dev/null || true
              export AGENT_EVAL_K8S_NAMESPACE="$WORKLOAD_NS"
            else
              export AGENT_EVAL_K8S_NAMESPACE=$(kubectl config view --minify -o jsonpath='{.contexts[0].context.namespace}' 2>/dev/null || echo "default")
            fi
          else
            export AGENT_EVAL_K8S_NAMESPACE=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace 2>/dev/null || echo "default")
          fi
          export AGENT_EVAL_K8S_CREDENTIALS_SECRET="llm-credentials"
          export AGENT_EVAL_RUNS_DIR="$REPORT_DIR"
          export ANTHROPIC_BASE_URL="$(params.llm-api-base)"
          export ANTHROPIC_API_KEY="$LLM_API_KEY"
          export AGENT_EVAL_K8S_KEEP_RUN="0"
          echo "K8s namespace: $AGENT_EVAL_K8S_NAMESPACE"
          echo "KUBECONFIG: ${KUBECONFIG:-in-cluster}"

          # agent_eval + harbor + abevalflow + scripts are all in /opt/agent-eval-harness

          EVAL_CONFIG="eval.yaml"
          CONTROL_CONFIG="$(params.aeh-control-config)"
          TREATMENT_CONFIG="$(params.aeh-treatment-config)"

          MODEL="$(params.aeh-model-override)"
          if [ -z "$MODEL" ]; then
            CFG_FILE="$SUBMISSION_PATH/$EVAL_CONFIG"
            [ "$AEH_MODE" = "pairwise" ] && CFG_FILE="$SUBMISSION_PATH/$TREATMENT_CONFIG"
            MODEL=$(python3 -c "
        import yaml
        config = yaml.safe_load(open('$CFG_FILE'))
        models = config.get('models', {})
        if isinstance(models, str):
            print(models)
        else:
            print(models.get('skill', 'claude-sonnet'))
        ")
          fi

          JUDGE_OVERRIDE="$(params.aeh-judge-model-override)"
          if [ -z "$JUDGE_OVERRIDE" ] && [ -n "$MODEL" ]; then
            JUDGE_OVERRIDE="$MODEL"
          fi

          echo "Model: $MODEL | Judge: ${JUDGE_OVERRIDE:-none}"

          AEH_THRESHOLD=$(python3 -c "
        from pathlib import Path
        from abevalflow.aeh_scoring import resolve_evaluation_threshold
        print(resolve_evaluation_threshold(Path('$SUBMISSION_PATH') / 'metadata.yaml'))
        ")
          echo "AEH threshold: $AEH_THRESHOLD"

          SKILL_NAME=$(python3 -c "
        import yaml
        cfg = '$EVAL_CONFIG'
        if '$AEH_MODE' == 'pairwise':
            cfg = '$TREATMENT_CONFIG'
        config = yaml.safe_load(open('$SUBMISSION_PATH/' + cfg))
        print(config.get('skill', '$SUBMISSION_NAME'))
        ")

          EVAL_TMP="$(workspaces.source.path)/_eval_tmp"
          mkdir -p "$EVAL_TMP/aeh-tasks" "$EVAL_TMP/aeh-jobs"

          if [ "$AEH_MODE" = "pairwise" ]; then
            echo "=== AEH Pairwise A/B Evaluation ==="

            set +e
            python scripts/run_aeh.py pairwise \
              --runner "$AEH_RUNNER" \
              --control-config "$SUBMISSION_PATH/$CONTROL_CONFIG" \
              --treatment-config "$SUBMISSION_PATH/$TREATMENT_CONFIG" \
              --output "$REPORT_DIR" \
              --run-id "$PIPELINE_RUN_ID" \
              --model "$MODEL" \
              ${JUDGE_OVERRIDE:+--judge-model "$JUDGE_OVERRIDE"} \
              ${AEH_IMAGE:+--image "$AEH_IMAGE"} \
              --tasks-dir "$EVAL_TMP/aeh-tasks" \
              --jobs-dir "$EVAL_TMP/aeh-jobs" \
              --judge pairwise
            AEH_EXIT=$?
            set -e

            CONTROL_DIR="$REPORT_DIR/$SKILL_NAME/control-$PIPELINE_RUN_ID"
            TREATMENT_DIR="$REPORT_DIR/$SKILL_NAME/treatment-$PIPELINE_RUN_ID"

            if [ ! -f "$CONTROL_DIR/summary.yaml" ]; then
              echo "ERROR: Control run failed - no summary.yaml in $CONTROL_DIR"
              exit 1
            fi
            if [ ! -f "$TREATMENT_DIR/summary.yaml" ]; then
              echo "ERROR: Treatment run failed - no summary.yaml in $TREATMENT_DIR"
              exit 1
            fi

            python scripts/aggregate_aeh.py "$TREATMENT_DIR" \
              --mode pairwise \
              --control-dir "$CONTROL_DIR" \
              --submission-name "$SUBMISSION_NAME" \
              --threshold "$AEH_THRESHOLD" \
              --output "$REPORT_DIR/report.json"

          else
            echo "=== AEH Single Evaluation ==="

            OUT_DIR="$REPORT_DIR/$SKILL_NAME/$PIPELINE_RUN_ID"
            mkdir -p "$OUT_DIR"

            set +e
            python scripts/run_aeh.py single \
              --runner "$AEH_RUNNER" \
              --config "$SUBMISSION_PATH/$EVAL_CONFIG" \
              --output "$OUT_DIR" \
              ${MODEL:+--model "$MODEL"} \
              ${JUDGE_OVERRIDE:+--judge-model "$JUDGE_OVERRIDE"} \
              ${AEH_IMAGE:+--image "$AEH_IMAGE"} \
              --tasks-dir "$EVAL_TMP/aeh-tasks" \
              --jobs-dir "$EVAL_TMP/aeh-jobs"
            AEH_EXIT=$?
            set -e

            if [ ! -f "$OUT_DIR/summary.yaml" ] && [ ! -f "$OUT_DIR/run_result.json" ]; then
              echo "ERROR: AEH single produced no summary.yaml or run_result.json"
              exit 1
            fi

            python scripts/aggregate_aeh.py "$OUT_DIR" \
              --submission-name "$SUBMISSION_NAME" \
              --threshold "$AEH_THRESHOLD" \
              --output "$REPORT_DIR/report.json"
          fi

          if [ "$AEH_EXIT" -ne 0 ]; then
            if [ -f "$REPORT_DIR/report.json" ]; then
              echo "WARNING: AEH exited $AEH_EXIT but report.json was produced, continuing"
            else
              echo "ERROR: AEH evaluation exited $AEH_EXIT with no report"
              exit "$AEH_EXIT"
            fi
          fi

          if [ -f "$REPORT_DIR/report.json" ]; then
            python3 -c "
        import json, sys
        r = json.load(open(sys.argv[1]))
        s = r.get('summary', {})
        t = s.get('treatment', {}).get('mean_reward')
        rec = s.get('recommendation', 'fail')
        open(sys.argv[2], 'w').write(str(t if t is not None else 0.0))
        open(sys.argv[3], 'w').write(str(s.get('control', {}).get('mean_reward', 0.0)))
        open(sys.argv[4], 'w').write(rec)
        print(f'Recommendation: {rec}, Mean reward: {t}')
        " "$REPORT_DIR/report.json" \
              "$(results.treatment-mean-reward.path)" \
              "$(results.control-mean-reward.path)" \
              "$(results.recommendation.path)"
          fi

          echo "=== AEH evaluate phase complete ==="
          exit 0

        else
          echo "ERROR: Unsupported eval engine: $EVAL_ENGINE"
          exit 1
        fi

        # ---- Run analyze.py (for local mode, non-AEH engines) ----
        echo "=== Running analyze.py ==="
        ANALYZE_ARGS=(
          --results-dir "$RESULTS_DIR"
          --output-dir "$REPORT_DIR"
          --submission-name "$SUBMISSION_NAME"
          --threshold "$UPLIFT_THRESHOLD"
          --eval-engine "$EVAL_ENGINE"
        )
        [ -n "$COMMIT_SHA" ] && ANALYZE_ARGS+=(--commit-sha "$COMMIT_SHA")
        [ -n "$PIPELINE_RUN_ID" ] && ANALYZE_ARGS+=(--pipeline-run-id "$PIPELINE_RUN_ID")

        python scripts/analyze.py "${ANALYZE_ARGS[@]}" 2>&1

        # ---- Extract results for Tekton ----
        if [ -f "$REPORT_DIR/report.json" ]; then
          python3 -c "
        import json, sys
        r = json.load(open(sys.argv[1]))
        s = r.get('summary', {})
        t = s.get('treatment', {}).get('mean_reward')
        rec = s.get('recommendation', 'fail')
        open(sys.argv[2], 'w').write(str(t if t is not None else 0.0))
        open(sys.argv[3], 'w').write('0.0')
        open(sys.argv[4], 'w').write(rec)
        print(f'Recommendation: {rec}, Mean reward: {t}')
        " "$REPORT_DIR/report.json" \
          "$(results.treatment-mean-reward.path)" \
          "$(results.control-mean-reward.path)" \
          "$(results.recommendation.path)"
        else
          echo "ERROR: report.json not generated after evaluation"
          exit 1
        fi

        echo "=== Evaluate phase complete ==="
