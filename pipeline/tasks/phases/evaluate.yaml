apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: evaluate
  namespace: ab-eval-flow
  labels:
    app.kubernetes.io/name: abevalflow
    app.kubernetes.io/component: phase
spec:
  description: >-
    Evaluation phase: dispatches to the appropriate evaluation engine based on
    eval-engine parameter. Handles Harbor (scaffold+build+eval), ASE (LLM-as-judge),
    MCPChecker (MCP server testing), A2A (agent evaluation), and AEH (agent-eval-harness)
    in a single composite task.
  stepTemplate:
    computeResources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 256Mi
  params:
    - name: eval-engine
      type: string
      description: Evaluation engine (harbor, ase, mcpchecker, a2a, aeh, aeh_openshell_openclaw, both)
    - name: submission-dir
      type: string
      description: Submission directory name under submissions/
    - name: submission-name
      type: string
      description: Validated submission name
    - name: commit-sha
      type: string
      description: Git commit SHA for image tagging
    - name: pipeline-run-id
      type: string
      description: PipelineRun name
    - name: pipeline-repo-url
      type: string
      default: "https://github.com/RHEcosystemAppEng/agentic_eval_flow.git"
    - name: pipeline-repo-revision
      type: string
      default: "main"
    # Harbor params
    - name: harbor-fork-url
      type: string
      default: "https://github.com/RHEcosystemAppEng/skills_eval_corrections.git"
    - name: harbor-fork-revision
      type: string
      default: "main"
    - name: eval-mode
      type: string
      default: "prebuilt"
    - name: registry-url
      type: string
      default: "image-registry.openshift-image-registry.svc:5000"
    - name: registry-namespace
      type: string
      default: "ab-eval-flow"
    - name: base-image
      type: string
      default: "image-registry.openshift-image-registry.svc:5000/ab-eval-flow/eval-base:latest"
    # LLM params
    - name: llm-model
      type: string
      default: "claude-sonnet"
    - name: llm-api-base
      type: string
      default: "http://litellm.ab-eval-flow.svc:4000"
    - name: llm-api-key
      type: string
      default: "mock"
    - name: llm-agent-wrapper
      type: string
      default: ""
    # ASE params
    - name: ase-iterations
      type: string
      default: "5"
    - name: ase-concurrency
      type: string
      default: "1"
    - name: ase-judge-model
      type: string
      default: ""
    - name: uplift-threshold
      type: string
      default: "0.0"
    # MCPChecker params
    - name: mcp-credentials-secret
      type: string
      default: "mcp-credentials-placeholder"
      description: Secret containing MCP credentials (use placeholder when not using MCPChecker)
    - name: mcpchecker-agent-model
      type: string
      default: "google:gemini-2.5-flash"
    - name: mcpchecker-judge-model
      type: string
      default: "openai:gpt-4o"
    - name: mcpchecker-task-timeout
      type: string
      default: "10m"
    # A2A params
    - name: agent-endpoint
      type: string
      default: ""
      description: A2A agent endpoint URL (if empty, deploys agent from agent-image)
    - name: agent-timeout
      type: string
      default: "120"
      description: A2A agent request timeout in seconds
    - name: agent-image
      type: string
      default: "quay.io/ecosystem-appeng/google-lightspeed-agent"
      description: Agent container image for deployment
    - name: agent-tag
      type: string
      default: "on-pr-b5535de9e1439da87e6610c8e3ae55f2d34231a8"
      description: Agent image tag
    - name: agent-namespace
      type: string
      default: "ab-eval-flow"
      description: Namespace to deploy agent
    - name: agent-release-name
      type: string
      default: "eval-agent"
      description: Helm release name for agent deployment
    - name: agent-chart-url
      type: string
      default: "https://github.com/RHEcosystemAppEng/google-lightspeed-agent.git"
      description: Agent Helm chart Git URL
    # AEH (Agent-Eval-Harness) params
    - name: aeh-model-override
      type: string
      default: ""
      description: Override models.skill from eval.yaml
    - name: aeh-judge-model-override
      type: string
      default: ""
      description: Override models.judge from eval.yaml
    - name: aeh-mode
      type: string
      default: "single"
      description: AEH evaluation mode (single, pairwise)
    - name: aeh-control-config
      type: string
      default: "eval-control.yaml"
      description: Control variant eval.yaml filename for pairwise mode
    - name: aeh-treatment-config
      type: string
      default: "eval-treatment.yaml"
      description: Treatment variant eval.yaml filename for pairwise mode
    - name: aeh-image
      type: string
      default: "quay.io/aipcc/base-images/agentic/openclaw:latest"
      description: Container image for AEH trial pods (required for harbor.run)
    - name: aeh-runner
      type: string
      default: "harbor"
      description: AEH execution backend (harbor, vanilla, openshell)
    - name: enable-mlflow
      type: string
      default: "false"
      description: When true and mlflow-tracking-uri is set, log AEH results to MLflow
    - name: mlflow-tracking-uri
      type: string
      default: ""
      description: MLflow tracking server URI
    - name: enable-aeh-regression-check
      type: string
      default: "true"
      description: >-
        When true, run AEH score.py regression after eval (advisory — does not
        fail the step). Requires thresholds: in eval.yaml.
    - name: aeh-baseline-run-id
      type: string
      default: ""
      description: >-
        Optional prior AEH run-id for score.py regression --baseline (relative
        drift). Empty skips the baseline comparison.
    # OpenShell / forge-saw (eval-engine=aeh_openshell_openclaw)
    - name: aeh-openshell-image
      type: string
      default: "registry.access.redhat.com/ubi9/python-311:9.6"
      description: >-
        Orchestrator image with harness + openshell CLI.
    - name: agent-eval-harness-repo-url
      type: string
      default: "https://github.com/GuyZivRH/agent-eval-harness.git"
    - name: agent-eval-harness-repo-revision
      type: string
      default: "feat/aeh-openshell-openclaw"
      description: >-
        Branch or tag of GuyZivRH/agent-eval-harness to clone. Must include the
        OpenShell create keep-alive fix (`--detach` + `sleep infinity`).
    - name: openshell-gateway-endpoint
      type: string
      default: "http://openshell.openshell.svc.cluster.local:8080"
      description: >-
        In-cluster NVIDIA OpenShell gateway (namespace openshell, gRPC :8080).
        Override only if using a different gateway (e.g. forge-saw :17670).
    - name: openshell-sandbox-image
      type: string
      default: "ghcr.io/rh-forge/openclaw-saw-agent@sha256:bcc55e9b7a36d5f65e8ffc75962496f8b3617762a4cdb37fd1cf54611b72d41a"
      description: >-
        Immutable SAW Chief-of-Staff image with the daily-briefing skill and
        governed M365/Slack tools.
    - name: openshell-cli-version
      type: string
      default: "0.0.116"
      description: >-
        OpenShell CLI release. 0.0.111+ is required for `sandbox create --detach`.
    - name: openshell-provider
      type: string
      default: "forge-ai-gateway,m365-read-intervm,slack-read-proxy,drafts-service-agent"
      description: SAW provider explicitly attached to each evaluation sandbox
    - name: openshell-mtls-secret
      type: string
      default: "openshell-mtls"
      description: Secret in the PipelineRun namespace with OpenShell CLI mTLS files
    - name: openshell-ai-gateway-ca-secret
      type: string
      default: "forge-ai-gateway-ca"
      description: Public CA for Node TLS validation of SAW's Forge AI bridge
    - name: openshell-credentials-secret
      type: string
      default: "openshell-credentials"
      description: >-
        Secret with M365_ACCESS_TOKEN and M365_USER (optional TENANT_ID /
        CLIENT_ID / CLIENT_SECRET). Required for openclaw-forge Graph scenes.
        Keys are optional for Crabline-only OpenShell evals.
    - name: openshell-oidc-secret
      type: string
      default: "openshell-oidc-credentials"
      description: Secret containing the SAW OIDC client settings.
  volumes:
    - name: openshell-mtls
      secret:
        secretName: $(params.openshell-mtls-secret)
        optional: true
    - name: forge-ai-gateway-ca
      secret:
        secretName: $(params.openshell-ai-gateway-ca-secret)
        optional: true
  workspaces:
    - name: source
      description: Workspace containing the cloned submissions repository
  results:
    - name: treatment-mean-reward
      description: Treatment/with-skill mean reward
    - name: control-mean-reward
      description: Control/without-skill mean reward
    - name: recommendation
      description: Pass or fail recommendation
    - name: results-dir
      description: Path to evaluation results
  steps:
    # Step 1: Setup and route to appropriate engine
    - name: setup
      image: registry.access.redhat.com/ubi9/python-311:9.6
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        echo "=== EVALUATE PHASE: Setup ==="
        echo "Eval engine: $(params.eval-engine)"
        echo "Submission: $(params.submission-name)"
        
        # Clone/update pipeline repo
        PIPELINE_DIR="$(workspaces.source.path)/_pipeline"
        echo "=== Cloning pipeline repo: $(params.pipeline-repo-url) @ $(params.pipeline-repo-revision) ==="
        if [ -d "$PIPELINE_DIR/.git" ]; then
          cd "$PIPELINE_DIR"
          git fetch origin "$(params.pipeline-repo-revision)" --depth 1
          git reset --hard FETCH_HEAD
        else
          git clone --depth 1 --branch "$(params.pipeline-repo-revision)" \
            "$(params.pipeline-repo-url)" "$PIPELINE_DIR"
        fi
        echo "Pipeline repo ready at $(git -C "$PIPELINE_DIR" rev-parse --short HEAD)"

        # Clone/update agent-eval-harness repo (required for latest OpenShell logic)
        HARNESS_DIR="$(workspaces.source.path)/_harness"
        echo "=== Cloning harness repo: $(params.agent-eval-harness-repo-url) @ $(params.agent-eval-harness-repo-revision) ==="
        if [ -d "$HARNESS_DIR/.git" ]; then
          cd "$HARNESS_DIR"
          git fetch origin "$(params.agent-eval-harness-repo-revision)" --depth 1
          git reset --hard FETCH_HEAD
        else
          git clone --depth 1 --branch "$(params.agent-eval-harness-repo-revision)" \
            "$(params.agent-eval-harness-repo-url)" "$HARNESS_DIR"
        fi
        echo "Harness repo ready at $(git -C "$HARNESS_DIR" rev-parse --short HEAD)"

        # Create results directories
        mkdir -p "$(workspaces.source.path)/eval-results/$(params.submission-name)"
        mkdir -p "$(workspaces.source.path)/reports/$(params.submission-name)"
        mkdir -p "$(workspaces.source.path)/_eval_tmp"
        
        # Initialize results with defaults
        echo -n "0.0" > "$(results.treatment-mean-reward.path)"
        echo -n "0.0" > "$(results.control-mean-reward.path)"
        echo -n "fail" > "$(results.recommendation.path)"
        echo -n "$(workspaces.source.path)/eval-results/$(params.submission-name)" > "$(results.results-dir.path)"

    # Step 2: Harbor - Scaffold
    - name: harbor-scaffold
      image: registry.access.redhat.com/ubi9/python-311:9.6
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        
        EVAL_ENGINE="$(params.eval-engine)"
        if [ "$EVAL_ENGINE" != "harbor" ] && [ "$EVAL_ENGINE" != "both" ]; then
          echo "Skipping scaffold (eval-engine=$EVAL_ENGINE)"
          exit 0
        fi
        
        echo "=== EVALUATE PHASE: Harbor Scaffold ==="
        PIPELINE_DIR="$(workspaces.source.path)/_pipeline"
        SUBMISSION_DIR="$(workspaces.source.path)/submissions/$(params.submission-dir)"
        OUTPUT_DIR="$(workspaces.source.path)"
        
        cd "$PIPELINE_DIR"
        export PYTHONPATH="$PIPELINE_DIR"
        pip install --quiet --no-cache-dir jinja2 pyyaml pydantic
        
        python scripts/scaffold.py "$SUBMISSION_DIR" "$OUTPUT_DIR"
        
        echo "Treatment: $OUTPUT_DIR/tasks-treatment/$(params.submission-name)"
        echo "Control: $OUTPUT_DIR/tasks-control/$(params.submission-name)"

    # Step 3: Harbor - Build Treatment (using crane - instant layer append, no extraction)
    - name: harbor-build-treatment
      image: registry.access.redhat.com/ubi9/python-311:latest
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        
        EVAL_ENGINE="$(params.eval-engine)"
        if [ "$EVAL_ENGINE" != "harbor" ] && [ "$EVAL_ENGINE" != "both" ]; then
          echo "Skipping build (eval-engine=$EVAL_ENGINE)"
          exit 0
        fi
        
        echo "=== EVALUATE PHASE: Harbor Build Treatment (crane) ==="

        # Install crane (lightweight tool that appends layers without extracting)
        curl -sL https://github.com/google/go-containerregistry/releases/download/v0.20.1/go-containerregistry_Linux_x86_64.tar.gz | tar xz -C /tmp crane

        # Get current namespace from service account
        CURRENT_NS=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)

        LOCAL_BASE_IMAGE="local-registry.ab-eval-flow.svc.cluster.local:5000/eval-base:latest"
        REGISTRY="$(params.registry-url)"
        NS="${CURRENT_NS}"
        NAME="$(params.submission-name)"
        SHA="$(echo '$(params.commit-sha)' | tr '/' '-')"
        IMAGE_TAG="${REGISTRY}/${NS}/${NAME}:treatment-${SHA}"
        CONTEXT="$(workspaces.source.path)/tasks-treatment/${NAME}/environment"
        
        # Create tar layer from scaffolded files
        echo "Creating layer from: $CONTEXT"
        tar -cvf /tmp/layer.tar -C "$CONTEXT" .
        
        # Login to destination registry (crane uses docker config)
        mkdir -p ~/.docker
        TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
        AUTH=$(echo -n "serviceaccount:${TOKEN}" | base64 -w0)
        cat > ~/.docker/config.json <<DOCKERCFG
        {"auths":{"${REGISTRY}":{"auth":"${AUTH}"}}}
        DOCKERCFG
        
        # Append layer to base image and push (instant - no extraction needed)
        echo "Appending layer to base image..."
        /tmp/crane append \
          --base="${LOCAL_BASE_IMAGE}" \
          --new_layer=/tmp/layer.tar \
          --new_tag="${IMAGE_TAG}" \
          --insecure 2>&1 | tee /tmp/crane-output.txt
        
        # Get digest from crane output
        FULL_REF=$(tail -1 /tmp/crane-output.txt)
        echo "$FULL_REF" > "$(workspaces.source.path)/_eval_tmp/treatment-image-ref"
        echo "Treatment image: $FULL_REF"

    # Step 4: Harbor - Build Control (using crane - instant layer append, no extraction)
    - name: harbor-build-control
      image: registry.access.redhat.com/ubi9/python-311:latest
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        
        EVAL_ENGINE="$(params.eval-engine)"
        if [ "$EVAL_ENGINE" != "harbor" ] && [ "$EVAL_ENGINE" != "both" ]; then
          exit 0
        fi
        
        echo "=== EVALUATE PHASE: Harbor Build Control (crane) ==="

        # Install crane
        curl -sL https://github.com/google/go-containerregistry/releases/download/v0.20.1/go-containerregistry_Linux_x86_64.tar.gz | tar xz -C /tmp crane

        # Get current namespace from service account
        CURRENT_NS=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)

        LOCAL_BASE_IMAGE="local-registry.ab-eval-flow.svc.cluster.local:5000/eval-base:latest"
        REGISTRY="$(params.registry-url)"
        NS="${CURRENT_NS}"
        NAME="$(params.submission-name)"
        SHA="$(echo '$(params.commit-sha)' | tr '/' '-')"
        IMAGE_TAG="${REGISTRY}/${NS}/${NAME}:control-${SHA}"
        CONTEXT="$(workspaces.source.path)/tasks-control/${NAME}/environment"
        
        # Create tar layer from scaffolded files
        echo "Creating layer from: $CONTEXT"
        tar -cvf /tmp/layer.tar -C "$CONTEXT" .
        
        # Login to destination registry
        mkdir -p ~/.docker
        TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
        AUTH=$(echo -n "serviceaccount:${TOKEN}" | base64 -w0)
        cat > ~/.docker/config.json <<DOCKERCFG
        {"auths":{"${REGISTRY}":{"auth":"${AUTH}"}}}
        DOCKERCFG
        
        # Append layer and push
        echo "Appending layer to base image..."
        /tmp/crane append \
          --base="${LOCAL_BASE_IMAGE}" \
          --new_layer=/tmp/layer.tar \
          --new_tag="${IMAGE_TAG}" \
          --insecure 2>&1 | tee /tmp/crane-output.txt
        
        FULL_REF=$(tail -1 /tmp/crane-output.txt)
        echo "$FULL_REF" > "$(workspaces.source.path)/_eval_tmp/control-image-ref"
        echo "Control image: $FULL_REF"

    # Step 5: Harbor - Run Evaluation (uses pre-built image with Harbor installed)
    - name: harbor-eval
      when:
        - input: "$(params.eval-engine)"
          operator: in
          values: ["harbor", "both"]
      image: registry.access.redhat.com/ubi9/python-311:9.6
      computeResources:
        requests:
          memory: 512Mi
        limits:
          memory: 1Gi
      env:
        - name: HOME
          value: /tmp/openshell-home
        - name: XDG_CONFIG_HOME
          value: /tmp/openshell-home/.config
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        
        EVAL_ENGINE="$(params.eval-engine)"
        if [ "$EVAL_ENGINE" != "harbor" ] && [ "$EVAL_ENGINE" != "both" ]; then
          exit 0
        fi
        
        echo "=== EVALUATE PHASE: Harbor Evaluation ==="
        
        # Check if Harbor is pre-installed (saves ~10 min)
        if python -c "import harbor" 2>/dev/null; then
          echo "Harbor already installed in base image"
        else
          echo "Installing Harbor from git..."
          pip install --quiet --no-cache-dir \
            "git+$(params.harbor-fork-url)@$(params.harbor-fork-revision)" \
            "kubernetes>=32.0.0" \
            pydantic pyyaml
        fi
        
        PIPELINE_DIR="$(workspaces.source.path)/_pipeline"
        SUBMISSION_PATH="$(workspaces.source.path)/submissions/$(params.submission-dir)"
        RESULTS_DIR="$(workspaces.source.path)/eval-results/$(params.submission-name)"
        CONFIG_DIR="$(workspaces.source.path)/_eval-configs"
        NAME="$(params.submission-name)"
        
        cd "$PIPELINE_DIR"
        export PYTHONPATH="$PIPELINE_DIR"
        
        TREATMENT_REF=$(cat "$(workspaces.source.path)/_eval_tmp/treatment-image-ref" 2>/dev/null || echo "")
        CONTROL_REF=$(cat "$(workspaces.source.path)/_eval_tmp/control-image-ref" 2>/dev/null || echo "")
        
        python scripts/generate_eval_config.py \
          --submission-dir "$SUBMISSION_PATH" \
          --treatment-task-dir "$(workspaces.source.path)/tasks-treatment/${NAME}" \
          --control-task-dir "$(workspaces.source.path)/tasks-control/${NAME}" \
          --output-dir "$CONFIG_DIR" \
          --eval-mode "$(params.eval-mode)" \
          --results-base-dir "$RESULTS_DIR" \
          --treatment-image-ref "$TREATMENT_REF" \
          --control-image-ref "$CONTROL_REF" \
          --llm-model "$(params.llm-model)" \
          --llm-api-base "$(params.llm-api-base)" \
          --llm-api-key "$(params.llm-api-key)"
        
        mkdir -p "$RESULTS_DIR/treatment" "$RESULTS_DIR/control"
        
        # Export LLM config for claude-code agent (Harbor reads from os.environ)
        export ANTHROPIC_API_KEY="$(params.llm-api-key)"
        export ANTHROPIC_BASE_URL="$(params.llm-api-base)"
        
        echo "=== Running treatment evaluation ==="
        harbor run -c "$CONFIG_DIR/treatment-config.yaml" -y
        
        echo "=== Running control evaluation ==="
        harbor run -c "$CONFIG_DIR/control-config.yaml" -y
        
        # Compute mean rewards from trial results (report generated by analyze task)
        python3 - "$RESULTS_DIR" "$(workspaces.source.path)/_eval_tmp" <<'COMPUTE_REWARDS'
        import json
        import sys
        from pathlib import Path
        
        results_dir = Path(sys.argv[1])
        output_dir = Path(sys.argv[2])
        
        def compute_mean_reward(variant_dir: Path) -> float:
            if not variant_dir.is_dir():
                return 0.0
            rewards = []
            for result_file in sorted(variant_dir.rglob("result.json")):
                try:
                    data = json.loads(result_file.read_text())
                    vr = data.get("verifier_result") or {}
                    rw = vr.get("rewards") or {}
                    reward = rw.get("reward") or vr.get("reward")
                    if reward is not None:
                        rewards.append(float(reward))
                except (json.JSONDecodeError, ValueError, TypeError):
                    pass
            return sum(rewards) / len(rewards) if rewards else 0.0
        
        t_mean = compute_mean_reward(results_dir / "treatment")
        c_mean = compute_mean_reward(results_dir / "control")
        rec = "pass" if t_mean >= c_mean else "fail"
        
        output_dir.mkdir(parents=True, exist_ok=True)
        (output_dir / "treatment-reward").write_text(f"{t_mean:.4f}")
        (output_dir / "control-reward").write_text(f"{c_mean:.4f}")
        (output_dir / "recommendation").write_text(rec)
        
        print(f"Treatment mean reward: {t_mean:.4f}")
        print(f"Control mean reward:   {c_mean:.4f}")
        print(f"Recommendation: {rec}")
        COMPUTE_REWARDS

    # Step 5b: Generate edge case evals from SKILL.md via LLM
    - name: generate-edge-case-evals
      when:
        - input: "$(params.eval-engine)"
          operator: in
          values: ["harbor", "both"]
      image: registry.access.redhat.com/ubi9/python-311:9.6
      env:
        - name: LLM_BASE_URL
          value: "$(params.llm-api-base)"
        - name: LLM_API_KEY
          value: "$(params.llm-api-key)"
        - name: LLM_MODEL
          value: "$(params.llm-model)"
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        EVAL_ENGINE="$(params.eval-engine)"
        if [ "$EVAL_ENGINE" != "harbor" ] && [ "$EVAL_ENGINE" != "ase" ] && [ "$EVAL_ENGINE" != "both" ]; then
          echo "Skipping edge case generation (eval-engine=$EVAL_ENGINE)"
          exit 0
        fi

        echo "=== EVALUATE PHASE: Generate Edge Case Evals ==="
        PIPELINE_DIR="$(workspaces.source.path)/_pipeline"
        SUBMISSION_PATH="$(workspaces.source.path)/submissions/$(params.submission-dir)"
        EDGE_EVALS_DIR="$(workspaces.source.path)/_eval_tmp/edge-case-evals"
        mkdir -p "$EDGE_EVALS_DIR"

        cd "$PIPELINE_DIR"
        export PYTHONPATH="$PIPELINE_DIR"
        pip install --quiet --no-cache-dir pyyaml pydantic openai 2>/dev/null || true

        # Generate skill-specific edge cases: try cache first, fall back to LLM generation
        python scripts/generate_edge_case_evals.py \
          --submission-dir "$SUBMISSION_PATH" \
          --output-dir "$EDGE_EVALS_DIR" \
          --generate-from-skill \
          --cache-dir "$PIPELINE_DIR/config/edge-case-cache" \
          || echo "WARNING: LLM edge case generation failed, falling back to submitter-provided only"

        # Also generate evals from submitter-provided edge_cases/*.md (if any)
        EDGE_CASES_DIR="$SUBMISSION_PATH/edge_cases"
        if [ -d "$EDGE_CASES_DIR" ]; then
          for MD_FILE in "$EDGE_CASES_DIR"/*.md; do
            [ -f "$MD_FILE" ] || continue
            EDGE_NAME=$(basename "$MD_FILE" .md)
            python scripts/generate_edge_case_evals.py \
              --submission-dir "$SUBMISSION_PATH" \
              --output-dir "$EDGE_EVALS_DIR/submitter_$EDGE_NAME" \
              --edge-case-file "$MD_FILE"
          done
        fi

        echo "Edge case evals generated at $EDGE_EVALS_DIR"
        ls -la "$EDGE_EVALS_DIR/" 2>/dev/null || true

    # Step 5c: ASE - Run Edge Case Evaluations (one ASE run per edge case)
    - name: ase-eval-edge-cases
      when:
        - input: "$(params.eval-engine)"
          operator: in
          values: ["harbor", "both"]
      image: registry.access.redhat.com/ubi9/nodejs-20:latest
      env:
        - name: OPENAI_API_KEY
          value: "$(params.llm-api-key)"
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        EVAL_ENGINE="$(params.eval-engine)"
        if [ "$EVAL_ENGINE" != "harbor" ] && [ "$EVAL_ENGINE" != "ase" ] && [ "$EVAL_ENGINE" != "both" ]; then
          echo "Skipping edge case eval (eval-engine=$EVAL_ENGINE)"
          exit 0
        fi

        SUBMISSION_PATH="$(workspaces.source.path)/submissions/$(params.submission-dir)"
        PIPELINE_DIR="$(workspaces.source.path)/_pipeline"
        EDGE_EVALS_DIR="$(workspaces.source.path)/_eval_tmp/edge-case-evals"

        # Check if any edge case evals were generated
        if [ ! -d "$EDGE_EVALS_DIR" ] || [ -z "$(find "$EDGE_EVALS_DIR" -name '*.json' -print -quit 2>/dev/null)" ]; then
          echo "No edge case evals generated — skipping"
          exit 0
        fi

        echo "=== EVALUATE PHASE: ASE Edge Case Evaluation ==="
        RESULTS_BASE="$(workspaces.source.path)/eval-results/$(params.submission-name)/edge-cases"
        mkdir -p "$RESULTS_BASE"

        # Find SKILL.md
        SKILL_MD=""
        if [ -f "$SUBMISSION_PATH/skills/SKILL.md" ]; then
          SKILL_MD="$SUBMISSION_PATH/skills/SKILL.md"
        else
          for dir in "$SUBMISSION_PATH"/skills/*/; do
            if [ -f "${dir}SKILL.md" ]; then
              SKILL_MD="${dir}SKILL.md"
              break
            fi
          done
        fi

        if [ -z "$SKILL_MD" ]; then
          echo "WARNING: No SKILL.md found — edge case evaluation skipped"
          exit 0
        fi

        # Install ASE once
        npm install --global agent-skills-eval 2>&1 | tail -3

        LLM_MODEL="$(params.llm-model)"
        BASE_URL="$(params.llm-api-base)"
        JUDGE_MODEL="$(params.ase-judge-model)"
        [ -z "$JUDGE_MODEL" ] && JUDGE_MODEL="$LLM_MODEL"
        [[ "$BASE_URL" != */v1 ]] && BASE_URL="${BASE_URL}/v1"

        # Run ASE for each pre-generated edge case eval
        # The main evals.json contains all LLM-generated edge cases
        MAIN_EVALS="$EDGE_EVALS_DIR/edge-case-evals.json"
        if [ -f "$MAIN_EVALS" ]; then
          EVAL_COUNT=$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).evals.length)" "$MAIN_EVALS")
          echo "Running $EVAL_COUNT LLM-generated edge cases"

          for i in $(seq 0 $((EVAL_COUNT - 1))); do
            EDGE_ID=$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).evals[$i].id)" "$MAIN_EVALS")
            EDGE_NAME=$(echo "$EDGE_ID" | sed 's/^edge-//')
            echo "--- LLM-generated edge case: $EDGE_NAME ---"

            EDGE_SKILL_DIR="$(workspaces.source.path)/_eval_tmp/edge-case-$EDGE_NAME"
            rm -rf "$EDGE_SKILL_DIR"
            mkdir -p "$EDGE_SKILL_DIR/evals"
            cp "$SKILL_MD" "$EDGE_SKILL_DIR/SKILL.md"

            # Extract single eval entry into its own evals.json
            node -e "
              const fs = require('fs');
              const all = JSON.parse(fs.readFileSync(process.argv[1], 'utf8'));
              const single = { skill_name: all.skill_name, evals: [all.evals[$i]] };
              fs.writeFileSync(process.argv[2], JSON.stringify(single, null, 2));
            " "$MAIN_EVALS" "$EDGE_SKILL_DIR/evals/evals.json"

            # Run ASE for this single edge case
            EDGE_RESULTS="$RESULTS_BASE/$EDGE_NAME"
            mkdir -p "$EDGE_RESULTS"

            agent-skills-eval "$EDGE_SKILL_DIR" --baseline --layout iteration --report \
              --base-url "$BASE_URL" --target "$LLM_MODEL" --judge "$JUDGE_MODEL" \
              --concurrency 1 --workspace "$EDGE_RESULTS/iteration-1" \
              --api-key-env OPENAI_API_KEY || true

            echo "Edge case '$EDGE_NAME' complete"
          done
        fi

        # Run submitter-provided edge cases (from edge_cases/*.md via pre-generated evals)
        for SUBDIR in "$EDGE_EVALS_DIR"/submitter_*/; do
          [ -d "$SUBDIR" ] || continue
          EVAL_FILE="$SUBDIR/edge-case-evals.json"
          [ -f "$EVAL_FILE" ] || continue
          EDGE_NAME=$(basename "$SUBDIR")
          echo "--- Submitter edge case: $EDGE_NAME ---"

          EDGE_SKILL_DIR="$(workspaces.source.path)/_eval_tmp/edge-case-$EDGE_NAME"
          rm -rf "$EDGE_SKILL_DIR"
          mkdir -p "$EDGE_SKILL_DIR/evals"
          cp "$SKILL_MD" "$EDGE_SKILL_DIR/SKILL.md"
          cp "$EVAL_FILE" "$EDGE_SKILL_DIR/evals/evals.json"

          EDGE_RESULTS="$RESULTS_BASE/$EDGE_NAME"
          mkdir -p "$EDGE_RESULTS"

          agent-skills-eval "$EDGE_SKILL_DIR" --baseline --layout iteration --report \
            --base-url "$BASE_URL" --target "$LLM_MODEL" --judge "$JUDGE_MODEL" \
            --concurrency 1 --workspace "$EDGE_RESULTS/iteration-1" \
            --api-key-env OPENAI_API_KEY || true

          echo "Edge case '$EDGE_NAME' complete"
        done

        echo "All edge case evaluations complete"

    # Step 5d: Aggregate edge case results
    - name: ase-aggregate-edge-cases
      when:
        - input: "$(params.eval-engine)"
          operator: in
          values: ["harbor", "both"]
      image: registry.access.redhat.com/ubi9/python-311:9.6
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        EVAL_ENGINE="$(params.eval-engine)"
        if [ "$EVAL_ENGINE" != "harbor" ] && [ "$EVAL_ENGINE" != "ase" ] && [ "$EVAL_ENGINE" != "both" ]; then
          exit 0
        fi

        RESULTS_DIR="$(workspaces.source.path)/eval-results/$(params.submission-name)/edge-cases"
        REPORTS_DIR="$(workspaces.source.path)/reports/$(params.submission-name)"

        if [ ! -d "$RESULTS_DIR" ]; then
          echo "No edge case results to aggregate"
          exit 0
        fi

        echo "=== EVALUATE PHASE: Aggregate Edge Case Results ==="
        PIPELINE_DIR="$(workspaces.source.path)/_pipeline"
        cd "$PIPELINE_DIR"
        export PYTHONPATH="$PIPELINE_DIR"
        pip install --quiet --no-cache-dir pyyaml pydantic 2>/dev/null || true

        python scripts/aggregate_edge_case_evals.py \
          --results-dir "$RESULTS_DIR" \
          --output-dir "$REPORTS_DIR"

    # Step 6: ASE - Run Evaluation
    - name: ase-eval
      when:
        - input: "$(params.eval-engine)"
          operator: in
          values: ["harbor", "both"]
      image: registry.access.redhat.com/ubi9/nodejs-20:latest
      env:
        - name: OPENAI_API_KEY
          value: "$(params.llm-api-key)"
        - name: PARAM_LLM_MODEL
          value: "$(params.llm-model)"
        - name: PARAM_LLM_API_BASE
          value: "$(params.llm-api-base)"
        - name: PARAM_ASE_ITERATIONS
          value: "$(params.ase-iterations)"
        - name: PARAM_ASE_CONCURRENCY
          value: "$(params.ase-concurrency)"
        - name: PARAM_ASE_JUDGE_MODEL
          value: "$(params.ase-judge-model)"
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        
        EVAL_ENGINE="$(params.eval-engine)"
        if [ "$EVAL_ENGINE" != "ase" ] && [ "$EVAL_ENGINE" != "both" ]; then
          exit 0
        fi
        
        echo "=== EVALUATE PHASE: ASE Evaluation ==="
        npm install --global agent-skills-eval 2>&1 | tail -3
        
        SUBMISSION_PATH="$(workspaces.source.path)/submissions/$(params.submission-dir)"
        METADATA_FILE="$SUBMISSION_PATH/metadata.yaml"
        
        # Base: pipeline params
        ITERATIONS="$PARAM_ASE_ITERATIONS"
        LLM_MODEL="$PARAM_LLM_MODEL"
        BASE_URL="$PARAM_LLM_API_BASE"
        JUDGE_MODEL="${PARAM_ASE_JUDGE_MODEL:-$PARAM_LLM_MODEL}"
        CONCURRENCY="$PARAM_ASE_CONCURRENCY"
        
        # Override from metadata.yaml if present
        if [ -f "$METADATA_FILE" ]; then
          pip install --quiet pyyaml 2>/dev/null || true
          OVERRIDES=$(python3 -c "import yaml,sys;m=yaml.safe_load(open(sys.argv[1]))or{};e=m.get('experiment')or{};l=m.get('llm')or{};e.get('n_trials')and print('ITERATIONS='+str(e['n_trials']));l.get('model')and print('LLM_MODEL='+str(l['model']));l.get('api_base')and print('BASE_URL='+str(l['api_base']));l.get('judge_model')and print('JUDGE_MODEL='+str(l['judge_model']));e.get('concurrency')and print('CONCURRENCY='+str(e['concurrency']))" "$METADATA_FILE" 2>/dev/null || true)
          eval "$OVERRIDES"
        fi
        
        # Apply defaults for any empty values
        ITERATIONS="${ITERATIONS:-5}"
        LLM_MODEL="${LLM_MODEL:-claude-sonnet}"
        BASE_URL="${BASE_URL:-http://litellm.ab-eval-flow.svc:4000}"
        JUDGE_MODEL="${JUDGE_MODEL:-$LLM_MODEL}"
        CONCURRENCY="${CONCURRENCY:-1}"
        
        [[ "$BASE_URL" != */v1 ]] && BASE_URL="${BASE_URL}/v1"
        
        echo "Config from metadata.yaml (with fallbacks):"
        echo "  Iterations: $ITERATIONS"
        echo "  Model: $LLM_MODEL"
        echo "  Judge: $JUDGE_MODEL"
        echo "  API Base: $BASE_URL"
        echo "  Concurrency: $CONCURRENCY"
        
        SKILL_DIR=""
        if [ -f "$SUBMISSION_PATH/skills/SKILL.md" ]; then
          SKILL_DIR="$SUBMISSION_PATH/skills"
        else
          for dir in "$SUBMISSION_PATH"/skills/*/; do
            if [ -f "${dir}SKILL.md" ]; then
              SKILL_DIR="$dir"
              break
            fi
          done
        fi
        
        if [ -z "$SKILL_DIR" ]; then
          echo "ERROR: No SKILL.md found"
          exit 1
        fi
        
        if [ ! -f "$SKILL_DIR/evals/evals.json" ] && [ -f "$SUBMISSION_PATH/evals/evals.json" ]; then
          ln -sf "$SUBMISSION_PATH/evals" "$SKILL_DIR/evals"
        fi
        
        RESULTS_DIR="$(workspaces.source.path)/eval-results/$(params.submission-name)"
        
        for i in $(seq 1 "$ITERATIONS"); do
          echo "--- ASE Iteration $i/$ITERATIONS ---"
          agent-skills-eval "$SKILL_DIR" --baseline --layout iteration --report \
            --base-url "$BASE_URL" --target "$LLM_MODEL" --judge "$JUDGE_MODEL" \
            --concurrency "$CONCURRENCY" --workspace "$RESULTS_DIR/iteration-$i" \
            --api-key-env OPENAI_API_KEY || true
        done

    # Step 7: ASE - Aggregate
    - name: ase-aggregate
      when:
        - input: "$(params.eval-engine)"
          operator: in
          values: ["harbor", "both"]
      image: registry.access.redhat.com/ubi9/python-311:9.6
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        
        EVAL_ENGINE="$(params.eval-engine)"
        if [ "$EVAL_ENGINE" != "ase" ] && [ "$EVAL_ENGINE" != "both" ]; then
          exit 0
        fi
        
        echo "=== EVALUATE PHASE: ASE Aggregation ==="
        PIPELINE_DIR="$(workspaces.source.path)/_pipeline"
        SUBMISSION_PATH="$(workspaces.source.path)/submissions/$(params.submission-dir)"
        pip install --quiet --no-cache-dir pydantic pyyaml scipy
        
        cd "$PIPELINE_DIR"
        export PYTHONPATH="$PIPELINE_DIR"
        
        # Read iterations from metadata.yaml with pipeline param as fallback
        ITERATIONS=$(python3 -c "
        import yaml, sys
        try:
            meta = yaml.safe_load(open('$SUBMISSION_PATH/metadata.yaml'))
            exp = meta.get('experiment', {})
            print(exp.get('n_trials', $(params.ase-iterations)))
        except:
            print($(params.ase-iterations))
        ")
        echo "Using iterations: $ITERATIONS"
        
        RESULTS_DIR="$(workspaces.source.path)/eval-results/$(params.submission-name)"
        REPORT_DIR="$(workspaces.source.path)/reports/$(params.submission-name)"
        
        python3 scripts/aggregate_ase.py \
          --results-dir "$RESULTS_DIR" \
          --output-dir "$REPORT_DIR" \
          --submission-name "$(params.submission-name)" \
          --iterations "$ITERATIONS" \
          --threshold "$(params.uplift-threshold)"
        
        python3 - "$REPORT_DIR/report.json" <<'PARSE'
        import json, sys
        r = json.load(open(sys.argv[1]))
        t = r["summary"]["treatment"].get("mean_reward", 0)
        c = r["summary"]["control"].get("mean_reward", 0)
        rec = r["summary"].get("recommendation", "fail")
        open("$(workspaces.source.path)/_eval_tmp/treatment-reward", "w").write(f"{t:.4f}")
        open("$(workspaces.source.path)/_eval_tmp/control-reward", "w").write(f"{c:.4f}")
        open("$(workspaces.source.path)/_eval_tmp/recommendation", "w").write(rec)
        PARSE

    # Step 8: MCPChecker - Run Evaluation
    - name: mcpchecker-eval
      when:
        - input: "$(params.eval-engine)"
          operator: in
          values: ["harbor", "both"]
      image: registry.access.redhat.com/ubi9/python-311:9.6
      env:
        - name: MCP_URL
          valueFrom:
            secretKeyRef:
              name: $(params.mcp-credentials-secret)
              key: MCP_URL
              optional: true
        - name: MCP_BEARER_TOKEN
          valueFrom:
            secretKeyRef:
              name: $(params.mcp-credentials-secret)
              key: MCP_BEARER_TOKEN
              optional: true
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: llm-credentials
              key: api-key
              optional: true
        - name: LITELLM_PROXY_URL
          value: "http://litellm.ab-eval-flow.svc:4000/v1"
      script: |
        #!/bin/bash
        set -euo pipefail
        
        EVAL_ENGINE="$(params.eval-engine)"
        if [ "$EVAL_ENGINE" != "mcpchecker" ]; then
          exit 0
        fi
        
        echo "=== EVALUATE PHASE: MCPChecker ==="
        
        if [ -z "${MCP_URL:-}" ]; then
          echo "ERROR: MCP_URL not set"
          exit 1
        fi
        
        cd "$(workspaces.source.path)/submissions/$(params.submission-dir)"
        
        # Expand env vars in mcp-config.yaml
        envsubst < mcp-config.yaml > mcp-config-resolved.yaml
        
        if [ -n "$LITELLM_PROXY_URL" ]; then
          export OPENAI_BASE_URL="$LITELLM_PROXY_URL"
        fi
        
        OUTPUT_FILE="/tmp/mcpchecker-out.json"
        RAW_OUTPUT="/tmp/mcpchecker-raw.txt"
        
        mcpchecker check eval.yaml --mcp-config-file mcp-config-resolved.yaml -o json > "$RAW_OUTPUT" 2>&1 || true
        
        # Extract JSON
        if grep -n '^{' "$RAW_OUTPUT" > /dev/null; then
          START_LINE=$(grep -n '^{' "$RAW_OUTPUT" | head -1 | cut -d: -f1)
          tail -n +$START_LINE "$RAW_OUTPUT" > "$OUTPUT_FILE"
        else
          cp "$RAW_OUTPUT" "$OUTPUT_FILE"
        fi
        
        RESULTS_DIR="$(workspaces.source.path)/eval-results/$(params.submission-name)"
        mkdir -p "$RESULTS_DIR"
        cp "$OUTPUT_FILE" "$RESULTS_DIR/mcpchecker-out.json"

    # Step 9: MCPChecker - Aggregate
    - name: mcpchecker-aggregate
      when:
        - input: "$(params.eval-engine)"
          operator: in
          values: ["harbor", "both"]
      image: registry.access.redhat.com/ubi9/python-311:9.6
      script: |
        #!/bin/bash
        set -euo pipefail
        
        EVAL_ENGINE="$(params.eval-engine)"
        if [ "$EVAL_ENGINE" != "mcpchecker" ]; then
          exit 0
        fi
        
        echo "=== EVALUATE PHASE: MCPChecker Aggregation ==="
        PIPELINE_DIR="$(workspaces.source.path)/_pipeline"
        pip install --quiet --no-cache-dir pydantic pyyaml
        
        export PYTHONPATH="$PIPELINE_DIR"
        
        RESULTS_DIR="$(workspaces.source.path)/eval-results/$(params.submission-name)"
        REPORT_DIR="$(workspaces.source.path)/reports/$(params.submission-name)"
        mkdir -p "$REPORT_DIR"
        
        python "$PIPELINE_DIR/scripts/aggregate_mcpchecker.py" \
          --output-json "$RESULTS_DIR/mcpchecker-out.json" \
          --submission-name "$(params.submission-name)" \
          --report-dir "$REPORT_DIR" \
          --pipeline-run-id "$(params.pipeline-run-id)" \
          > /tmp/mcp-result.json
        
        python3 - /tmp/mcp-result.json <<'PARSE'
        import json, sys
        r = json.load(open(sys.argv[1]))
        score = r.get("overall_score", 0)
        rec = r.get("recommendation", "fail")
        open("$(workspaces.source.path)/_eval_tmp/treatment-reward", "w").write(f"{score:.4f}")
        open("$(workspaces.source.path)/_eval_tmp/control-reward", "w").write("0.0000")
        open("$(workspaces.source.path)/_eval_tmp/recommendation", "w").write(rec)
        PARSE

    # Step 10: A2A - Deploy Agent as Deployment+Service (if no endpoint provided)
    - name: a2a-deploy-agent
      when:
        - input: "$(params.eval-engine)"
          operator: in
          values: ["a2a", "both"]
      image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        EVAL_ENGINE="$(params.eval-engine)"
        if [ "$EVAL_ENGINE" != "a2a" ]; then
          echo "Skipping A2A deploy (eval-engine=$EVAL_ENGINE)"
          exit 0
        fi

        AGENT_ENDPOINT="$(params.agent-endpoint)"
        if [ -n "$AGENT_ENDPOINT" ]; then
          echo "Using external agent: $AGENT_ENDPOINT"
          echo "$AGENT_ENDPOINT" > "$(workspaces.source.path)/_eval_tmp/agent-endpoint"
          echo "false" > "$(workspaces.source.path)/_eval_tmp/agent-deployed"
          exit 0
        fi

        # Generate unique name for this evaluation
        RUN_ID=$(echo "$(params.pipeline-run-id)" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | cut -c1-20)
        AGENT_NAME="a2a-agent-${RUN_ID}"
        NAMESPACE=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)
        
        echo "Deploying agent: $AGENT_NAME"
        
        # Create Deployment + Service
        cat <<YAML | oc apply -f -
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: $AGENT_NAME
          namespace: $NAMESPACE
          labels:
            app: $AGENT_NAME
            abevalflow/temp: "true"
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: $AGENT_NAME
          template:
            metadata:
              labels:
                app: $AGENT_NAME
            spec:
              containers:
              - name: redis
                image: redis:7-alpine
                ports:
                - containerPort: 6379
                resources:
                  limits:
                    cpu: 100m
                    memory: 128Mi
              - name: agent
                image: $(params.agent-image):$(params.agent-tag)
                ports:
                - containerPort: 8000
                env:
                - name: LLM_PROVIDER
                  value: "litellm"
                - name: LLM_MODEL
                  value: "openai/$(params.llm-model)"
                - name: LLM_API_BASE
                  value: "$(params.llm-api-base)"
                - name: OPENAI_API_KEY
                  value: "sk-dummy"
                - name: RATE_LIMIT_REDIS_URL
                  value: "redis://localhost:6379/0"
                - name: SKIP_JWT_VALIDATION
                  value: "true"
                - name: SKIP_ORDER_VALIDATION
                  value: "true"
                - name: LOG_LEVEL
                  value: "INFO"
                resources:
                  limits:
                    cpu: 500m
                    memory: 512Mi
        ---
        apiVersion: v1
        kind: Service
        metadata:
          name: $AGENT_NAME
          namespace: $NAMESPACE
          labels:
            abevalflow/temp: "true"
        spec:
          selector:
            app: $AGENT_NAME
          ports:
          - port: 8000
            targetPort: 8000
        YAML
        
        # Wait for deployment to be ready
        printf "Waiting for agent"
        for i in $(seq 1 60); do
          if oc rollout status deployment/$AGENT_NAME --timeout=5s >/dev/null 2>&1; then
            ENDPOINT="http://${AGENT_NAME}.${NAMESPACE}.svc:8000"
            if curl -sf "$ENDPOINT/.well-known/agent.json" > /dev/null 2>&1; then
              echo " ready!"
              echo "$ENDPOINT" > "$(workspaces.source.path)/_eval_tmp/agent-endpoint"
              echo "$AGENT_NAME" > "$(workspaces.source.path)/_eval_tmp/agent-deployed"
              exit 0
            fi
          fi
          printf "."
          sleep 5
        done
        
        echo " FAILED"
        oc delete deployment/$AGENT_NAME service/$AGENT_NAME --ignore-not-found=true
        exit 1

    # Step 10.5: A2A - Pre-flight health check
    - name: a2a-pre-flight
      when:
        - input: "$(params.eval-engine)"
          operator: in
          values: ["a2a", "both"]
      image: registry.access.redhat.com/ubi9/ubi-minimal:latest
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        EVAL_ENGINE="$(params.eval-engine)"
        if [ "$EVAL_ENGINE" != "a2a" ]; then
          echo "Skipping A2A pre-flight (eval-engine=$EVAL_ENGINE)"
          exit 0
        fi

        ENDPOINT_FILE="$(workspaces.source.path)/_eval_tmp/agent-endpoint"
        if [ ! -f "$ENDPOINT_FILE" ]; then
          echo "ERROR: No agent endpoint file found — deploy step may have failed"
          exit 1
        fi

        AGENT_ENDPOINT=$(cat "$ENDPOINT_FILE")
        if [ -z "$AGENT_ENDPOINT" ]; then
          echo "ERROR: Agent endpoint is empty"
          exit 1
        fi

        echo "=== A2A Pre-flight Health Check ==="
        echo "Endpoint: $AGENT_ENDPOINT"

        HEALTH_URL="${AGENT_ENDPOINT}/.well-known/agent.json"
        HTTP_STATUS=$(curl -sf --max-time 15 -o /dev/null -w "%{http_code}" "$HEALTH_URL" 2>/dev/null || echo "000")

        if [ "$HTTP_STATUS" != "200" ]; then
          echo "ERROR: Agent unreachable — /.well-known/agent.json returned HTTP $HTTP_STATUS"
          echo "Agent endpoint: $AGENT_ENDPOINT"
          echo "This will cause the evaluation to fail. Check that the agent is running and accessible."
          exit 1
        fi

        echo "Agent is healthy (HTTP $HTTP_STATUS)"

    # Step 11: A2A Agent Evaluation
    - name: a2a-eval
      when:
        - input: "$(params.eval-engine)"
          operator: in
          values: ["a2a", "both"]
      image: registry.access.redhat.com/ubi9/python-311:9.6
      computeResources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 1Gi
      env:
        - name: HOME
          value: /tmp
        - name: LLM_JUDGE_MODEL
          value: "openai/$(params.llm-model)"
        - name: LLM_BASE_URL
          value: "$(params.llm-api-base)"
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: llm-credentials
              key: api-key
              optional: true
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        
        EVAL_ENGINE="$(params.eval-engine)"
        if [ "$EVAL_ENGINE" != "a2a" ]; then
          echo "Skipping A2A eval (eval-engine=$EVAL_ENGINE)"
          exit 0
        fi
        
        # Read endpoint from deploy step or param
        ENDPOINT_FILE="$(workspaces.source.path)/_eval_tmp/agent-endpoint"
        if [ -f "$ENDPOINT_FILE" ]; then
          AGENT_ENDPOINT=$(cat "$ENDPOINT_FILE")
        else
          AGENT_ENDPOINT="$(params.agent-endpoint)"
        fi
        
        if [ -z "$AGENT_ENDPOINT" ]; then
          echo "ERROR: No agent endpoint available (deploy failed or not provided)"
          exit 1
        fi
        
        echo "=== A2A Evaluation ==="
        
        PIPELINE_DIR="$(workspaces.source.path)/_pipeline"
        SUBMISSION_PATH="$(workspaces.source.path)/submissions/$(params.submission-dir)"
        RESULTS_DIR="$(workspaces.source.path)/eval-results/$(params.submission-name)"
        REPORT_DIR="$(workspaces.source.path)/reports/$(params.submission-name)"
        
        mkdir -p "$RESULTS_DIR" "$REPORT_DIR"
        
        # Harbor (with LocalEnvironment) is pre-installed in eval-base:local-env.
        # Expose abevalflow (A2AAgent adapter) via PYTHONPATH — no install needed,
        # avoids virtualenv --user restrictions and permission conflicts.
        export PYTHONPATH="$PIPELINE_DIR:${PYTHONPATH:-}"
        
        cd "$PIPELINE_DIR"
        
        # Read evaluation config from metadata.yaml
        N_ATTEMPTS=$(python3 -c "
        import yaml, sys
        try:
            meta = yaml.safe_load(open('$SUBMISSION_PATH/metadata.yaml'))
            exp = meta.get('experiment', {})
            print(exp.get('n_trials', 5))
        except:
            print(5)
        ")
        
        # Find task directory (look for task.toml)
        TASK_DIR=""
        if [ -f "$SUBMISSION_PATH/task.toml" ]; then
          TASK_DIR="$SUBMISSION_PATH"
        elif [ -d "$SUBMISSION_PATH/tasks" ]; then
          for subdir in "$SUBMISSION_PATH/tasks"/*/; do
            if [ -f "${subdir}task.toml" ]; then
              TASK_DIR="${subdir%/}"
              break
            fi
          done
        fi
        
        if [ -z "$TASK_DIR" ]; then
          echo "ERROR: No task.toml found in submission"
          exit 1
        fi
        
        TASK_NAME=$(basename "$TASK_DIR")
        echo "Task: $TASK_NAME | Attempts: $N_ATTEMPTS"
        
        # Generate Harbor config YAML
        CONFIG_FILE="$RESULTS_DIR/a2a-config.yaml"
        LLM_API_BASE="$(params.llm-api-base)"
        LLM_MODEL="openai/$(params.llm-model)"
        
        python3 - "$CONFIG_FILE" "$TASK_DIR" "$RESULTS_DIR" "$N_ATTEMPTS" "$AGENT_ENDPOINT" "$(params.agent-timeout)" "$LLM_API_BASE" "$LLM_MODEL" <<'GENCFG'
        import sys
        import yaml
        
        config_file, task_dir, results_dir, n_attempts, endpoint, timeout, llm_api_base, llm_model = sys.argv[1:9]
        
        config = {
            "job_name": "a2a-eval",
            "jobs_dir": results_dir,
            "n_attempts": int(n_attempts),
            "agents": [{
                "import_path": "abevalflow.harbor_agents.a2a_adapter:A2AAgent",
                "kwargs": {
                    "endpoint": endpoint,
                    "timeout": int(timeout)
                }
            }],
            "tasks": [{"path": task_dir}],
            "environment": {
                "type": "local"
            },
            "verifier": {
                "env": {
                    "LLM_JUDGE_MODEL": llm_model,
                    "LLM_API_BASE": llm_api_base,
                    "OPENAI_API_KEY": "sk-dummy"
                }
            }
        }
        
        with open(config_file, "w") as f:
            yaml.dump(config, f, default_flow_style=False)
        GENCFG
        
        # Verify A2A adapter can be imported
        python3 -c "from abevalflow.harbor_agents.a2a_adapter import A2AAgent; print('A2AAgent imported OK')"
        
        # Run Harbor evaluation and capture any errors
        harbor run -c "$CONFIG_FILE" -y 2>&1 || true
        
        # Show exception details if any
        echo "=== Exception details ==="
        find "$RESULTS_DIR" -name "exception.txt" -exec echo "--- {} ---" \; -exec cat {} \; 2>/dev/null || echo "No exception files"
        
        # Compute mean reward from Harbor results
        python3 - "$RESULTS_DIR" "$(workspaces.source.path)/_eval_tmp" <<'COMPUTE_REWARDS'
        import json
        import sys
        from pathlib import Path
        
        results_dir = Path(sys.argv[1])
        output_dir = Path(sys.argv[2])
        
        def compute_mean_reward(base_dir: Path) -> float:
            if not base_dir.is_dir():
                return 0.0
            rewards = []
            for result_file in sorted(base_dir.rglob("result.json")):
                try:
                    data = json.loads(result_file.read_text())
                    vr = data.get("verifier_result") or {}
                    rw = vr.get("rewards") or {}
                    reward = rw.get("reward") or vr.get("reward")
                    if reward is not None:
                        rewards.append(float(reward))
                except (json.JSONDecodeError, ValueError, TypeError):
                    pass
            return sum(rewards) / len(rewards) if rewards else 0.0
        
        mean_reward = compute_mean_reward(results_dir)
        rec = "pass" if (mean_reward is not None and mean_reward >= 0.5) else "fail"
        
        output_dir.mkdir(parents=True, exist_ok=True)
        (output_dir / "treatment-reward").write_text(f"{mean_reward:.4f}")
        (output_dir / "control-reward").write_text("0.0000")
        (output_dir / "recommendation").write_text(rec)
        
        print(f"A2A mean reward: {mean_reward:.4f}")
        print(f"Recommendation: {rec}")
        COMPUTE_REWARDS

    # Step 12: AEH - Agent-Eval-Harness Evaluation (single mode)
    # Depends on: prepare (pipeline clone), validate. Skipped unless eval-engine=aeh
    # and aeh-mode=single. Writes run dirs under reports/<skill>/ for AEH layout,
    # but report.json under reports/<submission-name>/ for analyze/scorecard.
    - name: aeh-eval
      when:
        - input: "$(params.eval-engine)"
          operator: in
          values: ["aeh"]
      image: $(params.aeh-image)
      timeout: "2h"
      computeResources:
        requests:
          cpu: "50m"
          memory: "128Mi"
        limits:
          cpu: "500m"
          memory: "1Gi"
      env:
        - name: HOME
          value: /tmp
        - name: AGENT_EVAL_K8S_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: AGENT_EVAL_K8S_CREDENTIALS_SECRET
          value: llm-credentials
        - name: AGENT_EVAL_RUNS_DIR
          value: $(workspaces.source.path)/reports
        # Forwarded into AEH trial pods via agent_eval.harbor.kubernetes._FORWARD_ENV
        # so Claude Code uses in-cluster LiteLLM (mock key is fine with the proxy).
        - name: ANTHROPIC_BASE_URL
          value: "$(params.llm-api-base)"
        - name: ANTHROPIC_API_KEY
          value: "$(params.llm-api-key)"
        # Set to "1" to keep Harbor trial pods for oc exec diagnostics.
        - name: AGENT_EVAL_K8S_KEEP_RUN
          value: "0"
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        
        EVAL_ENGINE="$(params.eval-engine)"
        AEH_MODE="$(params.aeh-mode)"
        if [ "$EVAL_ENGINE" != "aeh" ] || [ "$AEH_MODE" != "single" ]; then
          echo "Skipping AEH single eval (eval-engine=$EVAL_ENGINE, aeh-mode=$AEH_MODE)"
          exit 0
        fi
        
        echo "=== EVALUATE PHASE: AEH Single Mode ==="
        echo "AGENT_EVAL_K8S_KEEP_RUN=${AGENT_EVAL_K8S_KEEP_RUN:-unset}"
        echo "ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-unset}"
        
        SUBMISSION_DIR="$(workspaces.source.path)/submissions/$(params.submission-dir)"
        SUBMISSION_NAME="$(params.submission-name)"
        RUN_ID="$(params.pipeline-run-id)"
        
        # Reports leaf matches EvalConfig.eval_name(): skill, then name, then submission
        SKILL_NAME=$(python3 -c "
        import yaml
        config = yaml.safe_load(open('$SUBMISSION_DIR/eval.yaml')) or {}
        execb = config.get('execution') or {}
        skill = ''
        if isinstance(execb, dict):
            skill = str(execb.get('skill') or '').strip()
        if not skill:
            skill = str(config.get('skill') or '').strip()
        name = str(config.get('name') or '').strip()
        if skill:
            print(skill)
        elif name:
            s = name.lower().replace(' ', '-')
            s = ''.join(c for c in s if c.isalnum() or c in '._-')
            print(s or '$SUBMISSION_NAME')
        else:
            print('$SUBMISSION_NAME')
        ")
        
        OUT_DIR="$(workspaces.source.path)/reports/${SKILL_NAME}/${RUN_ID}"
        REPORT_JSON="$(workspaces.source.path)/reports/${SUBMISSION_NAME}/report.json"
        
        mkdir -p "$OUT_DIR" \
          "$(workspaces.source.path)/reports/${SUBMISSION_NAME}" \
          "$(workspaces.source.path)/_eval_tmp/aeh-tasks" \
          "$(workspaces.source.path)/_eval_tmp/aeh-jobs"
        
        # --model is required by harbor.run; use override or value from eval.yaml
        MODEL="$(params.aeh-model-override)"
        if [ -z "$MODEL" ]; then
          MODEL=$(python3 -c "
        import yaml
        config = yaml.safe_load(open('$SUBMISSION_DIR/eval.yaml'))
        models = config.get('models', {})
        if isinstance(models, str):
            print(models)
        else:
            print(models.get('skill', 'claude-sonnet'))
        ")
        fi
        
        JUDGE_OVERRIDE="$(params.aeh-judge-model-override)"
        # Default judges to the resolved skill model so LiteLLM aliases stay aligned
        # (eval.yaml may still name a model the proxy does not expose).
        if [ -z "$JUDGE_OVERRIDE" ] && [ -n "$MODEL" ]; then
          JUDGE_OVERRIDE="$MODEL"
        fi
        
        echo "Submission: $SUBMISSION_DIR"
        echo "Output: $OUT_DIR"
        echo "Report: $REPORT_JSON"
        echo "Model: $MODEL"
        echo "Judge override: ${JUDGE_OVERRIDE:-none}"
        echo "Runner: $(params.aeh-runner)"
        
        # Run AEH evaluation via dispatcher (supports harbor/vanilla backends)
        PIPELINE_DIR="$(workspaces.source.path)/_pipeline"
        AEH_IMAGE="$(params.aeh-image)"
        AEH_RUNNER="$(params.aeh-runner)"

        # Add pipeline dir to PYTHONPATH so abevalflow module is importable
        export PYTHONPATH="$PIPELINE_DIR:${PYTHONPATH:-}"

        # Capture exit (harbor rc=1 can be threshold warning) then always aggregate
        # when summary/run_result exist so analyze gets report.json.
        set +e
        python "$PIPELINE_DIR/scripts/run_aeh.py" single \
          --runner "$AEH_RUNNER" \
          --config "$SUBMISSION_DIR/eval.yaml" \
          --output "$OUT_DIR" \
          ${MODEL:+--model "$MODEL"} \
          ${JUDGE_OVERRIDE:+--judge-model "$JUDGE_OVERRIDE"} \
          ${AEH_IMAGE:+--image "$AEH_IMAGE"} \
          --tasks-dir "$(workspaces.source.path)/_eval_tmp/aeh-tasks" \
          --jobs-dir "$(workspaces.source.path)/_eval_tmp/aeh-jobs"
        AEH_EXIT=$?
        set -e
        
        # Aggregate results using our script
        PIPELINE_DIR="$(workspaces.source.path)/_pipeline"
        export PYTHONPATH="$PIPELINE_DIR:${PYTHONPATH:-}"
        pip install --quiet --no-cache-dir pyyaml 2>&1 | tail -1

        AEH_THRESHOLD=$(python3 -c "from pathlib import Path; from abevalflow.aeh_scoring import resolve_evaluation_threshold; print(resolve_evaluation_threshold(Path('$SUBMISSION_DIR') / 'metadata.yaml'))")
        echo "AEH evaluation threshold: $AEH_THRESHOLD"
        
        if [ -f "$OUT_DIR/summary.yaml" ] || [ -f "$OUT_DIR/run_result.json" ]; then
          python "$PIPELINE_DIR/scripts/aggregate_aeh.py" "$OUT_DIR" \
            --submission-name "$SUBMISSION_NAME" \
            --threshold "$AEH_THRESHOLD" \
            --output "$REPORT_JSON"
        else
          echo "ERROR: AEH single produced no summary.yaml or run_result.json in $OUT_DIR"
          exit 1
        fi
        
        # Parse results for finalize step (even when AEH_EXIT != 0)
        python3 - "$OUT_DIR" "$(workspaces.source.path)/_eval_tmp" "$AEH_THRESHOLD" <<'PARSE_AEH'
        import sys
        from pathlib import Path

        from scripts.aggregate_aeh import _extract_mean_reward

        out_dir = Path(sys.argv[1])
        tmp_dir = Path(sys.argv[2])
        threshold = float(sys.argv[3])

        mean_reward = _extract_mean_reward(out_dir)
        rec = "pass" if (mean_reward is not None and mean_reward >= threshold) else "fail"

        tmp_dir.mkdir(parents=True, exist_ok=True)
        reward_str = f"{mean_reward:.4f}" if mean_reward is not None else "N/A"
        (tmp_dir / "treatment-reward").write_text(reward_str)
        (tmp_dir / "control-reward").write_text("N/A")
        (tmp_dir / "recommendation").write_text(rec)

        print(f"AEH mean reward: {reward_str} (threshold={threshold})")
        print(f"Recommendation: {rec}")
        PARSE_AEH

        # Optional MLflow logging (non-blocking).
        # Prefer packages baked into the AEH image; if missing, install to /tmp
        # (image site-packages is read-only under OpenShift SCC).
        if [ "$(params.enable-mlflow)" = "true" ] && [ -n "$(params.mlflow-tracking-uri)" ]; then
          echo "=== AEH MLflow logging ==="
          MLFLOW_PKG_DIR="/tmp/mlflow-pkgs"
          mkdir -p "$MLFLOW_PKG_DIR"
          export PYTHONPATH="${MLFLOW_PKG_DIR}${PYTHONPATH:+:$PYTHONPATH}"
          # pandas is required by AEH log_results.py (mlflow.log_table).
          if python -c "import mlflow, pandas" 2>/dev/null; then
            echo "mlflow/pandas already available (image or prior install); skipping pip"
          else
            echo "Installing mlflow-skinny + pandas into ${MLFLOW_PKG_DIR} (fallback) ..."
            # Do not let pip failure abort the step (set -e / pipefail).
            set +e
            python -m pip install --no-cache-dir --target "$MLFLOW_PKG_DIR" 'mlflow-skinny' 'pandas' 2>&1 | tee /tmp/mlflow-pip.log | tail -30
            PIP_RC=${PIPESTATUS[0]}
            set -e
            if [ "$PIP_RC" -ne 0 ]; then
              echo "WARN: mlflow-skinny/pandas install failed (rc=$PIP_RC)"
              tail -40 /tmp/mlflow-pip.log || true
            fi
          fi
          if python -c "import mlflow, pandas; print('mlflow OK', mlflow.__version__, 'pandas', pandas.__version__)"; then
            export MLFLOW_TRACKING_URI="$(params.mlflow-tracking-uri)"
            # One MLflow experiment per PipelineRun; this AEH run is one MLflow run.
            python "$PIPELINE_DIR/scripts/log_aeh_mlflow.py" \
              --enabled true \
              --tracking-uri "$(params.mlflow-tracking-uri)" \
              --experiment "$RUN_ID" \
              --run-id "$RUN_ID" \
              --config "$SUBMISSION_DIR/eval.yaml" \
              --runs-dir "$(workspaces.source.path)/reports" \
              2>&1 || echo "Warning: MLflow logging failed (non-blocking)"
          else
            echo "Warning: mlflow/pandas not importable; skipping MLflow logging"
          fi
        else
          echo "Skipping AEH MLflow (enable-mlflow=$(params.enable-mlflow), uri set=$([ -n "$(params.mlflow-tracking-uri)" ] && echo yes || echo no))"
        fi

        # Advisory AEH threshold / baseline regression (never fails this step).
        if [ "$(params.enable-aeh-regression-check)" = "true" ]; then
          echo "=== AEH regression check (advisory) ==="
          BASELINE_ARGS=()
          if [ -n "$(params.aeh-baseline-run-id)" ]; then
            BASELINE_ARGS=(--baseline "$(params.aeh-baseline-run-id)")
          fi
          python "$PIPELINE_DIR/scripts/run_aeh_regression.py" \
            --enabled true \
            --run-id "$RUN_ID" \
            --config "$SUBMISSION_DIR/eval.yaml" \
            --runs-dir "$(workspaces.source.path)/reports" \
            --output "$(workspaces.source.path)/reports/${SUBMISSION_NAME}/aeh-regression.txt" \
            "${BASELINE_ARGS[@]}" \
            2>&1 || echo "Warning: AEH regression check failed to run (non-blocking)"
        else
          echo "Skipping AEH regression check (enable-aeh-regression-check=$(params.enable-aeh-regression-check))"
        fi

        if [ "$AEH_EXIT" -ne 0 ]; then
          echo "ERROR: AEH single evaluation exited $AEH_EXIT (report written if outputs existed)"
          exit "$AEH_EXIT"
        fi

    # Step 12b: AEH OpenShell OpenClaw (cluster OpenShell gateway). Not Harbor trial pods.
    - name: aeh-openshell-eval
      when:
        - input: "$(params.eval-engine)"
          operator: in
          values: ["aeh_openshell_openclaw"]
      image: $(params.aeh-openshell-image)
      timeout: "2h"
      computeResources:
        requests:
          cpu: "50m"
          memory: "128Mi"
        limits:
          cpu: "500m"
          memory: "1Gi"
      volumeMounts:
        - name: openshell-mtls
          mountPath: /tmp/.config/openshell
          readOnly: true
        - name: forge-ai-gateway-ca
          mountPath: /tmp/forge-ai-gateway-ca
          readOnly: true
      envFrom:
        # Inject every key from openshell-credentials (M365_*). optional so
        # Crabline OpenShell evals still start when the Secret is absent.
        # File-auth paths (M365_AUTH_HEADER_FILE, M365_GRAPH_CURL) are not
        # Secret keys — AEH writes them in the sandbox from M365_ACCESS_TOKEN.
        - secretRef:
            name: $(params.openshell-credentials-secret)
            optional: true
        - secretRef:
            name: $(params.openshell-oidc-secret)
            optional: true
        - secretRef:
            name: inference
            optional: false
      env:
        - name: HOME
          value: /tmp/openshell-home
        - name: INFERENCE_API_KEY
          valueFrom:
            secretKeyRef:
              name: inference
              key: api_key
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: inference
              key: api_key
        - name: AGENT_EVAL_RUNS_DIR
          value: $(workspaces.source.path)/reports
        - name: OPENSHELL_GATEWAY_ENDPOINT
          value: "$(params.openshell-gateway-endpoint)"
        - name: OPENSHELL_GATEWAY_NAME
          value: "ci-gateway"
        # The SAW Service certificate is issued as openshell-server rather
        # than for its cross-namespace Service DNS name. Keep client mTLS
        # enabled, but skip only server-name verification for this CI path.
        - name: OPENSHELL_GATEWAY_INSECURE
          # The namespace gateway certificate is issued for the VM bridge
          # hostname, while CI reaches the gateway through its Service DNS.
          # Keep mTLS enabled and skip only server-name verification here.
          value: "true"
        - name: AGENT_EVAL_OPENSHELL_IMAGE
          value: "$(params.openshell-sandbox-image)"
        - name: AGENT_EVAL_OPENSHELL_PROVIDER
          value: "$(params.openshell-provider)"
        - name: AGENT_EVAL_FORGE_AI_GATEWAY_CA_FILE
          value: "/tmp/forge-ai-gateway-ca/ca.crt"
        - name: FORGE_SAW_PROFILE
          value: "forge-outlook-slack"
        - name: ANTHROPIC_BASE_URL
          value: "$(params.llm-api-base)"
        - name: ANTHROPIC_API_KEY
          value: "$(params.llm-api-key)"
        # Orchestrator env. AEH OpenShell forwards these into sandbox exec via
        # _FORWARD_ENV and eval.yaml execution.env $M365_* resolution. seed:
        # external — mailbox is pre-seeded; do not populate crabline/smolclaw.
        - name: M365_ACCESS_TOKEN
          valueFrom:
            secretKeyRef:
              name: $(params.openshell-credentials-secret)
              key: M365_ACCESS_TOKEN
              optional: true
        - name: M365_USER
          valueFrom:
            secretKeyRef:
              name: $(params.openshell-credentials-secret)
              key: M365_USER
              optional: true
        - name: M365_TENANT_ID
          valueFrom:
            secretKeyRef:
              name: $(params.openshell-credentials-secret)
              key: M365_TENANT_ID
              optional: true
        - name: M365_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: $(params.openshell-credentials-secret)
              key: M365_CLIENT_ID
              optional: true
        - name: M365_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: $(params.openshell-credentials-secret)
              key: M365_CLIENT_SECRET
              optional: true
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        EVAL_ENGINE="$(params.eval-engine)"
        if [ "$EVAL_ENGINE" != "aeh_openshell_openclaw" ]; then
          echo "Skipping AEH OpenShell eval (eval-engine=$EVAL_ENGINE)"
          exit 0
        fi

        unset ANTHROPIC_VERTEX_PROJECT_ID || true

        # Ensure openshell CLI is available before gateway/OIDC setup.
        if ! command -v openshell >/dev/null 2>&1; then
          echo "Installing openshell CLI v$(params.openshell-cli-version)..."
          mkdir -p /tmp/bin
          OS_ARCH="x86_64-unknown-linux-musl"
          curl -fsSL "https://github.com/NVIDIA/OpenShell/releases/download/v$(params.openshell-cli-version)/openshell-${OS_ARCH}.tar.gz" | tar -xz -C /tmp/bin openshell
          export PATH="/tmp/bin:$PATH"
        fi

        # Materialize the CI client certificate before registering the gateway.
        # gateway add inspects this directory when selecting mTLS transport.
        export XDG_CONFIG_HOME="${HOME}/.config"
        GW_NAME="${OPENSHELL_GATEWAY_NAME:-ci-gateway}"
        MTLS_SRC="/tmp/.config/openshell"
        MTLS_DST="${XDG_CONFIG_HOME}/openshell/gateways/${GW_NAME}/mtls"
        mkdir -p "${XDG_CONFIG_HOME}/openshell"
        if [ -f "$MTLS_SRC/tls.crt" ] && [ -f "$MTLS_SRC/tls.key" ]; then
          mkdir -p "$MTLS_DST"
          cp -f "$MTLS_SRC/ca.crt" "$MTLS_DST/" 2>/dev/null || true
          cp -f "$MTLS_SRC/tls.crt" "$MTLS_DST/"
          cp -f "$MTLS_SRC/tls.key" "$MTLS_DST/"
          chmod 600 "$MTLS_DST"/* 2>/dev/null || true
          echo "OpenShell mTLS material staged before gateway registration"
        else
          echo "ERROR: openshell-mtls client certificate is missing" >&2
          exit 1
        fi

        # Configure the remote SAW gateway with the dedicated CI OIDC client.
        # The client secret is injected from openshell-oidc-credentials and is
        # never printed. The insecure flag is intentionally test-only and is
        # supplied by the Secret until the SAW route has a trusted certificate.
        if [[ "${OPENSHELL_GATEWAY_ENDPOINT}" == *".svc.cluster.local:"* ]] \
          && { [ -z "${OPENSHELL_OIDC_CLIENT_SECRET:-}" ] || \
               [ -z "${OPENSHELL_OIDC_CLIENT_ID:-}" ] || \
               [ -z "${OPENSHELL_OIDC_ISSUER:-}" ]; }; then
          CLI_GATEWAY_ENDPOINT="$OPENSHELL_GATEWAY_ENDPOINT"
          if [[ "$OPENSHELL_GATEWAY_ENDPOINT" == *"openshell-saw-agent-gateway.saw-cchase.svc.cluster.local"* ]]; then
            SAW_IP="$(getent ahostsv4 openshell-saw-agent-gateway.saw-cchase.svc.cluster.local 2>/dev/null | awk 'NR==1 {print $1}')"
            if [ -z "$SAW_IP" ]; then
              echo "ERROR: could not resolve the SAW gateway Service IP" >&2
              exit 1
            fi
            if ! grep -Eq "^[[:space:]]*${SAW_IP}[[:space:]]+openshell\.openshell\.svc\.cluster\.local([[:space:]]|$)" /etc/hosts; then
              printf '%s openshell.openshell.svc.cluster.local\n' "$SAW_IP" >> /etc/hosts
            fi
            CLI_GATEWAY_ENDPOINT="https://openshell.openshell.svc.cluster.local:17670"
            echo "OpenShell mTLS endpoint mapped to certificate-valid hostname: ${CLI_GATEWAY_ENDPOINT}"
          fi
          # Use the CLI's supported local/mTLS registration path. This lets
          # the installed CLI create metadata in the exact shape it expects
          # and associate the staged client bundle with the gateway profile.
          openshell gateway add "$CLI_GATEWAY_ENDPOINT" \
            --local \
            --name "$GW_NAME" \
            >/tmp/openshell-gateway-add.log 2>&1 || {
              grep -vE 'client_secret|token|secret' /tmp/openshell-gateway-add.log || true
              exit 1
            }
          # Some CLI versions recreate the profile directory during gateway
          # registration. Restage the client bundle after registration so the
          # first mTLS request cannot be sent without a certificate.
          POST_ADD_MTLS_DST="${XDG_CONFIG_HOME}/openshell/gateways/${GW_NAME}/mtls"
          mkdir -p "$POST_ADD_MTLS_DST"
          cp -f "$MTLS_SRC/ca.crt" "$POST_ADD_MTLS_DST/"
          cp -f "$MTLS_SRC/tls.crt" "$POST_ADD_MTLS_DST/"
          cp -f "$MTLS_SRC/tls.key" "$POST_ADD_MTLS_DST/"
          chmod 600 "$POST_ADD_MTLS_DST"/*
          echo "OpenShell mTLS material restaged after gateway registration"
          export OPENSHELL_GATEWAY="$GW_NAME"
          export OPENSHELL_GATEWAY_ENDPOINT="$CLI_GATEWAY_ENDPOINT"
          echo "OpenShell mTLS gateway configured: ${GW_NAME}"
        elif [ -n "${OPENSHELL_OIDC_CLIENT_SECRET:-}" ] && [ -n "${OPENSHELL_OIDC_CLIENT_ID:-}" ] \
          && [ -n "${OPENSHELL_OIDC_ISSUER:-}" ]; then
          openshell gateway add "$OPENSHELL_GATEWAY_ENDPOINT" \
            --name "$GW_NAME" \
            --oidc-issuer "$OPENSHELL_OIDC_ISSUER" \
            --oidc-client-id "$OPENSHELL_OIDC_CLIENT_ID" \
            --oidc-audience "${OPENSHELL_OIDC_AUDIENCE:-openshell-cli}" \
            >/tmp/openshell-gateway-add.log 2>&1 || {
              grep -vE 'client.secret|secret|token' /tmp/openshell-gateway-add.log || true
              exit 1
            }
          OPENSHELL_GATEWAY="$GW_NAME" openshell gateway login "$GW_NAME" \
            >/tmp/openshell-gateway-login.log 2>&1 || {
              grep -vE 'client.secret|secret|token' /tmp/openshell-gateway-login.log || true
              exit 1
            }
          export OPENSHELL_GATEWAY="$GW_NAME"
          echo "OpenShell OIDC gateway configured: ${GW_NAME}"
        else
          echo "OpenShell OIDC Secret not configured; using existing gateway auth"
        fi

        # Secret mounts flat at $HOME/.config/openshell. OpenShell CLI expects
        # gateways/<sandbox>/mtls/{ca.crt,tls.crt,tls.key}.
        if [ -f "$MTLS_DST/tls.crt" ] && [ -f "$MTLS_DST/tls.key" ]; then
          echo "OpenShell mTLS profile files:"
          find "$HOME/.config/openshell/gateways/$GW_NAME" -maxdepth 3 -type f -printf '%p %s bytes\n' 2>/dev/null || true
          openssl x509 -in "$MTLS_DST/tls.crt" -noout -subject -issuer -fingerprint -sha256 2>/dev/null || true
          echo "OpenShell profile metadata:"
          sed -E 's/(client_secret|token|secret)[^,}]*/\1=REDACTED/g' "$HOME/.config/openshell/gateways/$GW_NAME/metadata.json" 2>/dev/null || true
          if [ -s "$HOME/.config/openshell/gateways/$GW_NAME/oidc_token.json" ]; then
            echo "OpenShell OIDC token cache: present"
          else
            echo "OpenShell OIDC token cache: missing"
          fi
        fi

        echo "=== EVALUATE PHASE: AEH OpenShell OpenClaw ==="
        echo "Orchestrator image: $(params.aeh-openshell-image)"
        echo "OPENSHELL_GATEWAY_ENDPOINT=${OPENSHELL_GATEWAY_ENDPOINT:-unset}"
        echo "AGENT_EVAL_OPENSHELL_IMAGE=${AGENT_EVAL_OPENSHELL_IMAGE:-unset}"
        echo "ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-unset}"

        PIPELINE_DIR="$(workspaces.source.path)/_pipeline"
        HARNESS_DIR="$(workspaces.source.path)/_harness"
        # Judge scoring (score.py) runs in this UBI orchestrator, not the
        # OpenClaw sandbox. Local .eval-venv has anthropic/jinja2/yaml;
        # install the same packages here so LLM judges can import.
        JUDGE_PKG_DIR="/tmp/aeh-judge-pkgs"
        mkdir -p "$JUDGE_PKG_DIR"
        echo "=== Installing orchestrator judge dependencies ==="
        python3 -m pip install --no-cache-dir --target "$JUDGE_PKG_DIR" \
          'pyyaml>=6.0' 'jinja2>=3.0' 'pydantic' 'anthropic>=0.40' \
          2>&1 | tail -20
        export PYTHONPATH="$JUDGE_PKG_DIR:$PIPELINE_DIR:$HARNESS_DIR:${PYTHONPATH:-}"
        python3 -c "import anthropic, yaml, jinja2; print('judge deps OK', 'anthropic', anthropic.__version__)"

        if ! python3 -c "import agent_eval.openshell.run" 2>/dev/null; then
          echo "Harness not importable after PYTHONPATH setup"
          python3 -c "import sys; print('\\n'.join(sys.path))"
          exit 1
        fi

        # Ensure openshell CLI is available
        if ! command -v openshell >/dev/null 2>&1; then
          echo "Installing openshell CLI v$(params.openshell-cli-version)..."
          mkdir -p /tmp/bin
          OS_ARCH="x86_64-unknown-linux-musl"
          curl -fsSL "https://github.com/NVIDIA/OpenShell/releases/download/v$(params.openshell-cli-version)/openshell-${OS_ARCH}.tar.gz" | tar -xz -C /tmp/bin openshell
          export PATH="/tmp/bin:$PATH"
        fi

        if ! python3 -c "import agent_eval.openshell.run"; then
          echo "ERROR: image $(params.aeh-openshell-image) cannot import agent_eval.openshell."
          echo "PYTHONPATH: $PYTHONPATH"
          exit 1
        fi

        echo "=== OpenShell gateway preflight ==="
        python3 - <<'PREFLIGHT'
        import os, socket, sys, urllib.parse
        url = os.environ.get("OPENSHELL_GATEWAY_ENDPOINT", "")
        if not url:
            print("ERROR: OPENSHELL_GATEWAY_ENDPOINT is empty", file=sys.stderr)
            sys.exit(1)
        parsed = urllib.parse.urlparse(url)
        host = parsed.hostname
        port = parsed.port or (443 if parsed.scheme == "https" else 8080)
        if not host:
            print(f"ERROR: cannot parse host from {url!r}", file=sys.stderr)
            sys.exit(1)
        try:
            sock = socket.create_connection((host, port), timeout=15)
            sock.close()
        except OSError as exc:
            print(
                f"ERROR: OpenShell gateway unreachable at {host}:{port} ({exc}). "
                "Expected the cluster Helm gateway at "
                "http://openshell.openshell.svc.cluster.local:8080.",
                file=sys.stderr,
            )
            sys.exit(1)
        print(f"gateway reachable {host}:{port}")
        PREFLIGHT

        if command -v openshell >/dev/null 2>&1; then
          openshell -g "${OPENSHELL_GATEWAY_NAME:-ci-gateway}" sandbox list \
            || echo "WARN: openshell sandbox list failed (mTLS/OIDC?); continuing to run"
        else
          echo "WARN: openshell CLI not on PATH in orchestrator image"
        fi

        SUBMISSION_DIR="$(workspaces.source.path)/submissions/$(params.submission-dir)"
        SUBMISSION_NAME="$(params.submission-name)"
        RUN_ID="$(params.pipeline-run-id)"

        echo "=== M365 Graph credentials preflight ==="
        python3 - "$SUBMISSION_DIR" <<'M365PRE'
        import os, sys
        from pathlib import Path

        try:
            import yaml
        except ImportError:
            print("WARN: pyyaml missing; skipping M365 eval.yaml inspection")
            sys.exit(0)

        def usable(value):
            if not value or not str(value).strip():
                return False
            low = str(value).strip().lower()
            return not any(
                marker in low
                for marker in ("<replace-with", "changeme", "placeholder")
            )

        sub = Path(sys.argv[1])
        eval_path = sub / "eval.yaml"
        if not eval_path.is_file():
            print(f"WARN: {eval_path} missing; skipping M365 preflight")
            sys.exit(0)
        cfg = yaml.safe_load(eval_path.read_text()) or {}
        exec_env = (cfg.get("execution") or {}).get("env") or {}
        needed = []
        if any(str(k).startswith("M365_") for k in exec_env):
            needed.extend(["M365_ACCESS_TOKEN", "M365_USER"])
        scene_name = cfg.get("scene")
        if scene_name:
            scene_path = sub / "scenes" / f"{scene_name}.yaml"
            if scene_path.is_file():
                scene = yaml.safe_load(scene_path.read_text()) or {}
                m365 = scene.get("m365") or {}
                user = m365.get("user")
                if user and not usable(os.environ.get("M365_USER")):
                    os.environ["M365_USER"] = str(user)
                    print(f"M365_USER defaulted from scene ({user})")
                if str(m365.get("seed") or "") == "external":
                    for key in ("M365_ACCESS_TOKEN", "M365_USER"):
                        if key not in needed:
                            needed.append(key)
        if not needed:
            print("M365 not required for this submission")
            sys.exit(0)
        saw_profile = os.environ.get("FORGE_SAW_PROFILE", "").strip()
        if saw_profile:
            print(
                f"M365 access delegated to SAW profile {saw_profile}; "
                "Graph token Secret is not required"
            )
            sys.exit(0)
        missing = [k for k in needed if not usable(os.environ.get(k))]
        if missing:
            secret = os.environ.get(
                "OPENSHELL_CREDENTIALS_SECRET", "openshell-credentials"
            )
            print(
                "ERROR: OpenClaw Forge needs live Microsoft Graph credentials, "
                f"but these were unset or placeholders: {', '.join(missing)}.",
                file=sys.stderr,
            )
            print(
                "Create Secret openshell-credentials in the PipelineRun namespace "
                "(do not apply the placeholder template, do not commit tokens):",
                file=sys.stderr,
            )
            print(
                "  oc create secret generic openshell-credentials "
                "-n guy-ziv-evalflow \\\n"
                "    --from-literal=M365_ACCESS_TOKEN=... \\\n"
                "    --from-literal=M365_USER=... \\\n"
                "    --from-literal=M365_TENANT_ID=... \\\n"
                "    --from-literal=M365_CLIENT_ID=... \\\n"
                "    --from-literal=M365_CLIENT_SECRET=...",
                file=sys.stderr,
            )
            print(
                "Required keys: M365_ACCESS_TOKEN, M365_USER. "
                "Optional: M365_TENANT_ID, M365_CLIENT_ID, M365_CLIENT_SECRET. "
                "M365_AUTH_HEADER_FILE and M365_GRAPH_CURL are created in the "
                "sandbox from M365_ACCESS_TOKEN — they are not Secret keys. "
                f"Expected Secret name: {secret}",
                file=sys.stderr,
            )
            sys.exit(1)
        print("M365 Graph credentials present:", ", ".join(needed))
        M365PRE
        echo "M365_ACCESS_TOKEN: ${M365_ACCESS_TOKEN:+present}"
        echo "M365_USER: ${M365_USER:+present}"
        echo "M365_TENANT_ID: ${M365_TENANT_ID:+present}"
        echo "M365_CLIENT_ID: ${M365_CLIENT_ID:+present}"
        echo "M365_CLIENT_SECRET: ${M365_CLIENT_SECRET:+present}"

        # Reports leaf matches EvalConfig.eval_name(): skill, then name, then submission
        SKILL_NAME=$(python3 -c "
        import yaml
        config = yaml.safe_load(open('$SUBMISSION_DIR/eval.yaml')) or {}
        execb = config.get('execution') or {}
        skill = ''
        if isinstance(execb, dict):
            skill = str(execb.get('skill') or '').strip()
        if not skill:
            skill = str(config.get('skill') or '').strip()
        name = str(config.get('name') or '').strip()
        if skill:
            print(skill)
        elif name:
            s = name.lower().replace(' ', '-')
            s = ''.join(c for c in s if c.isalnum() or c in '._-')
            print(s or '$SUBMISSION_NAME')
        else:
            print('$SUBMISSION_NAME')
        ")

        OUT_DIR="$(workspaces.source.path)/reports/${SKILL_NAME}/${RUN_ID}"
        REPORT_JSON="$(workspaces.source.path)/reports/${SUBMISSION_NAME}/report.json"

        mkdir -p "$OUT_DIR" "$(workspaces.source.path)/reports/${SUBMISSION_NAME}"

        MODEL="$(params.aeh-model-override)"
        if [ -z "$MODEL" ]; then
          MODEL=$(python3 -c "
        import yaml
        config = yaml.safe_load(open('$SUBMISSION_DIR/eval.yaml'))
        models = config.get('models', {})
        if isinstance(models, str):
            print(models)
        else:
            print(models.get('skill', 'claude-sonnet'))
        ")
        fi

        JUDGE_OVERRIDE="$(params.aeh-judge-model-override)"
        if [ -z "$JUDGE_OVERRIDE" ] && [ -n "$MODEL" ]; then
          JUDGE_OVERRIDE="$MODEL"
        fi

        echo "Submission: $SUBMISSION_DIR"
        echo "Output: $OUT_DIR"
        echo "Model: $MODEL"

        export AGENT_EVAL_HARNESS_ROOT="$HARNESS_DIR"
        if [ "$(params.enable-mlflow)" = "true" ] && [ -n "$(params.mlflow-tracking-uri)" ]; then
          export MLFLOW_TRACKING_URI="$(params.mlflow-tracking-uri)"
          echo "MLFLOW_TRACKING_URI set for AEH harness + CI logger"
        fi

        set +e
        python "$PIPELINE_DIR/scripts/run_aeh.py" single \
          --runner openshell \
          --config "$SUBMISSION_DIR/eval.yaml" \
          --output "$OUT_DIR" \
          --run-id "$RUN_ID" \
          ${MODEL:+--model "$MODEL"} \
          ${JUDGE_OVERRIDE:+--judge-model "$JUDGE_OVERRIDE"}
        AEH_EXIT=$?
        set -e

        # Keep JUDGE_PKG_DIR on PYTHONPATH; UBI site-packages is not writable.
        export PYTHONPATH="$PIPELINE_DIR:${PYTHONPATH:-}"

        AEH_THRESHOLD=$(python3 -c "from pathlib import Path; from abevalflow.aeh_scoring import resolve_evaluation_threshold; print(resolve_evaluation_threshold(Path('$SUBMISSION_DIR') / 'metadata.yaml'))")
        echo "AEH evaluation threshold: $AEH_THRESHOLD"

        REPORTS_ROOT="$(workspaces.source.path)/reports"
        if [ ! -f "$OUT_DIR/summary.yaml" ] && [ ! -f "$OUT_DIR/run_result.json" ]; then
          FOUND=""
          for cand in "$REPORTS_ROOT/${SKILL_NAME}/${RUN_ID}" "$REPORTS_ROOT/${SUBMISSION_NAME}/${RUN_ID}"; do
            if [ -f "$cand/summary.yaml" ] || [ -f "$cand/run_result.json" ]; then
              FOUND="$cand"
              break
            fi
          done
          if [ -z "$FOUND" ]; then
            shopt -s nullglob
            for cand in "$REPORTS_ROOT"/*/"$RUN_ID"; do
              if [ -f "$cand/summary.yaml" ] || [ -f "$cand/run_result.json" ]; then
                FOUND="$cand"
                break
              fi
            done
            shopt -u nullglob
          fi
          if [ -n "$FOUND" ]; then
            echo "WARN: OpenShell AEH results at $FOUND (expected $OUT_DIR); using found path"
            OUT_DIR="$FOUND"
          fi
        fi

        if [ -f "$OUT_DIR/summary.yaml" ] || [ -f "$OUT_DIR/run_result.json" ]; then
          python "$PIPELINE_DIR/scripts/aggregate_aeh.py" "$OUT_DIR" \
            --submission-name "$SUBMISSION_NAME" \
            --threshold "$AEH_THRESHOLD" \
            --eval-engine aeh_openshell_openclaw \
            --output "$REPORT_JSON"
        else
          echo "ERROR: OpenShell AEH produced no summary.yaml or run_result.json in $OUT_DIR"
          echo "Looked under $REPORTS_ROOT/<eval-name|submission>/$RUN_ID"
          ls -la "$REPORTS_ROOT" 2>/dev/null || true
          ls -la "$REPORTS_ROOT"/*/"$RUN_ID" 2>/dev/null || true
          exit 1
        fi

        python3 - "$OUT_DIR" "$(workspaces.source.path)/_eval_tmp" "$AEH_THRESHOLD" <<'PARSE_AEH'
        import sys
        from pathlib import Path

        from scripts.aggregate_aeh import _extract_mean_reward

        out_dir = Path(sys.argv[1])
        tmp_dir = Path(sys.argv[2])
        threshold = float(sys.argv[3])

        mean_reward = _extract_mean_reward(out_dir)
        rec = "pass" if (mean_reward is not None and mean_reward >= threshold) else "fail"

        tmp_dir.mkdir(parents=True, exist_ok=True)
        reward_str = f"{mean_reward:.4f}" if mean_reward is not None else "N/A"
        (tmp_dir / "treatment-reward").write_text(reward_str)
        (tmp_dir / "control-reward").write_text("N/A")
        (tmp_dir / "recommendation").write_text(rec)

        print(f"AEH OpenShell mean reward: {reward_str} (threshold={threshold})")
        print(f"Recommendation: {rec}")
        PARSE_AEH

        # Same opt-in MLflow path as Harbor AEH single-run (aeh-eval).
        # OpenShell reports live under reports/<eval-name>/<pipeline-run-id>/.
        # Calls AEH skills/eval-mlflow/log_results.py (harness clone), then
        # CI fallback metrics if that no-ops.
        if [ "$(params.enable-mlflow)" = "true" ] && [ -n "$(params.mlflow-tracking-uri)" ]; then
          echo "=== AEH OpenShell MLflow logging ==="
          MLFLOW_PKG_DIR="/tmp/mlflow-pkgs"
          mkdir -p "$MLFLOW_PKG_DIR"
          export PYTHONPATH="${MLFLOW_PKG_DIR}${PYTHONPATH:+:$PYTHONPATH}"
          if python -c "import mlflow, pandas" 2>/dev/null; then
            echo "mlflow/pandas already available (image or prior install); skipping pip"
          else
            echo "Installing mlflow-skinny + pandas into ${MLFLOW_PKG_DIR} (fallback) ..."
            set +e
            python -m pip install --no-cache-dir --target "$MLFLOW_PKG_DIR" 'mlflow-skinny' 'pandas' 'boto3' 2>&1 | tee /tmp/mlflow-pip.log | tail -30
            PIP_RC=${PIPESTATUS[0]}
            set -e
            if [ "$PIP_RC" -ne 0 ]; then
              echo "WARN: mlflow-skinny/pandas install failed (rc=$PIP_RC)"
              tail -40 /tmp/mlflow-pip.log || true
            fi
          fi
          if python -c "import mlflow, pandas; print('mlflow OK', mlflow.__version__, 'pandas', pandas.__version__)"; then
            export MLFLOW_TRACKING_URI="$(params.mlflow-tracking-uri)"
            python "$PIPELINE_DIR/scripts/log_aeh_mlflow.py" \
              --enabled true \
              --tracking-uri "$(params.mlflow-tracking-uri)" \
              --experiment "$RUN_ID" \
              --run-id "$RUN_ID" \
              --config "$SUBMISSION_DIR/eval.yaml" \
              --runs-dir "$(workspaces.source.path)/reports" \
              2>&1 || echo "Warning: MLflow logging failed (non-blocking)"
          else
            echo "Warning: mlflow/pandas not importable; skipping MLflow logging"
          fi
        else
          echo "Skipping AEH OpenShell MLflow (enable-mlflow=$(params.enable-mlflow), uri set=$([ -n "$(params.mlflow-tracking-uri)" ] && echo yes || echo no))"
        fi

        if [ "$AEH_EXIT" -ne 0 ]; then
          echo "ERROR: AEH OpenShell evaluation exited $AEH_EXIT (report written if outputs existed)"
          exit "$AEH_EXIT"
        fi

    # Step 13: AEH - Pairwise A/B Evaluation (consolidated)
    # Depends on: prepare, validate. Skipped unless eval-engine=aeh and aeh-mode=pairwise.
    # Run dirs stay under reports/<skill>/ for score.py; report.json uses submission-name.
    - name: aeh-pairwise
      when:
        - input: "$(params.eval-engine)"
          operator: in
          values: ["aeh"]
      image: $(params.aeh-image)
      timeout: "4h"
      computeResources:
        requests:
          cpu: "50m"
          memory: "128Mi"
        limits:
          cpu: "500m"
          memory: "1Gi"
      env:
        - name: HOME
          value: /tmp
        - name: AGENT_EVAL_K8S_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: AGENT_EVAL_K8S_CREDENTIALS_SECRET
          value: llm-credentials
        - name: AGENT_EVAL_RUNS_DIR
          value: $(workspaces.source.path)/reports
        # Forwarded into AEH trial pods via agent_eval.harbor.kubernetes._FORWARD_ENV
        - name: ANTHROPIC_BASE_URL
          value: "$(params.llm-api-base)"
        - name: ANTHROPIC_API_KEY
          value: "$(params.llm-api-key)"
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        EVAL_ENGINE="$(params.eval-engine)"
        AEH_MODE="$(params.aeh-mode)"
        if [ "$EVAL_ENGINE" != "aeh" ] || [ "$AEH_MODE" != "pairwise" ]; then
          echo "Skipping AEH pairwise (eval-engine=$EVAL_ENGINE, aeh-mode=$AEH_MODE)"
          exit 0
        fi
        
        echo "=== EVALUATE PHASE: AEH Pairwise A/B Evaluation ==="
        echo "ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-unset}"
        
        SUBMISSION_DIR="$(workspaces.source.path)/submissions/$(params.submission-dir)"
        SUBMISSION_NAME="$(params.submission-name)"
        PIPELINE_DIR="$(workspaces.source.path)/_pipeline"
        RUN_ID="$(params.pipeline-run-id)"
        CONTROL_CONFIG="$(params.aeh-control-config)"
        TREATMENT_CONFIG="$(params.aeh-treatment-config)"
        REPORTS_DIR="$(workspaces.source.path)/reports"
        
        # Get model from treatment config or override
        MODEL="$(params.aeh-model-override)"
        if [ -z "$MODEL" ]; then
          MODEL=$(python3 -c "
        import yaml
        config = yaml.safe_load(open('$SUBMISSION_DIR/$TREATMENT_CONFIG'))
        models = config.get('models', {})
        if isinstance(models, str):
            print(models)
        else:
            print(models.get('skill', 'claude-sonnet'))
        ")
        fi
        
        JUDGE_OVERRIDE="$(params.aeh-judge-model-override)"
        if [ -z "$JUDGE_OVERRIDE" ] && [ -n "$MODEL" ]; then
          JUDGE_OVERRIDE="$MODEL"
        fi
        AEH_IMAGE="$(params.aeh-image)"
        AEH_RUNNER="$(params.aeh-runner)"
        
        # Create base tmp dir for tasks/jobs (dispatcher creates separate control/treatment subdirs)
        EVAL_TMP="$(workspaces.source.path)/_eval_tmp"
        mkdir -p "$EVAL_TMP" "$REPORTS_DIR/${SUBMISSION_NAME}"
        
        echo "Submission: $SUBMISSION_DIR"
        echo "Control config: $CONTROL_CONFIG"
        echo "Treatment config: $TREATMENT_CONFIG"
        echo "Model: $MODEL"
        echo "Judge override: ${JUDGE_OVERRIDE:-none}"
        echo "Runner: $AEH_RUNNER"

        # Add pipeline dir to PYTHONPATH so abevalflow module is importable
        export PYTHONPATH="$PIPELINE_DIR:${PYTHONPATH:-}"

        # Run pairwise evaluation via dispatcher
        # This handles: control run -> treatment run -> score.py pairwise comparison
        # Dispatcher creates separate control/treatment tasks/jobs subdirs automatically
        set +e
        python "$PIPELINE_DIR/scripts/run_aeh.py" pairwise \
          --runner "$AEH_RUNNER" \
          --control-config "$SUBMISSION_DIR/$CONTROL_CONFIG" \
          --treatment-config "$SUBMISSION_DIR/$TREATMENT_CONFIG" \
          --output "$REPORTS_DIR" \
          --run-id "$RUN_ID" \
          --model "$MODEL" \
          ${JUDGE_OVERRIDE:+--judge-model "$JUDGE_OVERRIDE"} \
          ${AEH_IMAGE:+--image "$AEH_IMAGE"} \
          --tasks-dir "$EVAL_TMP/aeh-tasks" \
          --jobs-dir "$EVAL_TMP/aeh-jobs" \
          --judge pairwise
        PAIRWISE_EXIT=$?
        set -e
        
        # Skill namespaced run dirs (score.py); report.json uses submission-name
        SKILL_NAME=$(python3 -c "
        import yaml
        config = yaml.safe_load(open('$SUBMISSION_DIR/$TREATMENT_CONFIG')) or {}
        execb = config.get('execution') or {}
        skill = ''
        if isinstance(execb, dict):
            skill = str(execb.get('skill') or '').strip()
        if not skill:
            skill = str(config.get('skill') or '').strip()
        name = str(config.get('name') or '').strip()
        if skill:
            print(skill)
        elif name:
            s = name.lower().replace(' ', '-')
            s = ''.join(c for c in s if c.isalnum() or c in '._-')
            print(s or '$SUBMISSION_NAME')
        else:
            print('$SUBMISSION_NAME')
        ")
        
        CONTROL_DIR="$REPORTS_DIR/$SKILL_NAME/control-$RUN_ID"
        TREATMENT_DIR="$REPORTS_DIR/$SKILL_NAME/treatment-$RUN_ID"
        REPORT_JSON="$REPORTS_DIR/${SUBMISSION_NAME}/report.json"
        
        # Verify outputs exist before aggregate
        if [ ! -f "$CONTROL_DIR/summary.yaml" ]; then
          echo "ERROR: Control run failed - no summary.yaml in $CONTROL_DIR"
          exit 1
        fi
        if [ ! -f "$TREATMENT_DIR/summary.yaml" ]; then
          echo "ERROR: Treatment run failed - no summary.yaml in $TREATMENT_DIR"
          exit 1
        fi

        # Aggregate even when PAIRWISE_EXIT != 0 so analyze gets report.json
        export PYTHONPATH="$PIPELINE_DIR:${PYTHONPATH:-}"
        pip install --quiet --no-cache-dir pyyaml 2>&1 | tail -1

        AEH_THRESHOLD=$(python3 -c "from pathlib import Path; from abevalflow.aeh_scoring import resolve_evaluation_threshold; print(resolve_evaluation_threshold(Path('$SUBMISSION_DIR') / 'metadata.yaml'))")
        echo "AEH evaluation threshold: $AEH_THRESHOLD"
        
        python "$PIPELINE_DIR/scripts/aggregate_aeh.py" "$TREATMENT_DIR" \
          --mode pairwise \
          --control-dir "$CONTROL_DIR" \
          --submission-name "$SUBMISSION_NAME" \
          --threshold "$AEH_THRESHOLD" \
          --output "$REPORT_JSON"

        # score.py pairwise must have merged a pairwise: section into treatment summary
        if ! python3 -c "
        import sys, yaml
        from pathlib import Path
        s = yaml.safe_load(Path(sys.argv[1]).read_text()) or {}
        sys.exit(0 if isinstance(s.get('pairwise'), dict) else 1)
        " "$TREATMENT_DIR/summary.yaml"; then
          echo "ERROR: treatment summary.yaml missing pairwise: section (LLM judge did not run)"
          exit 1
        fi
        echo "Pairwise section present in treatment summary.yaml"
        
        # Parse results for finalize step (shared pairwise_outcome helper)
        python3 - "$TREATMENT_DIR" "$CONTROL_DIR" "$(workspaces.source.path)/_eval_tmp" "$AEH_THRESHOLD" <<'PARSE_PAIRWISE'
        import json, sys, yaml
        from pathlib import Path

        from abevalflow.aeh_scoring import pairwise_outcome
        
        treatment_dir = Path(sys.argv[1])
        control_dir = Path(sys.argv[2])
        tmp_dir = Path(sys.argv[3])
        threshold = float(sys.argv[4])
        
        def mean_reward(run_dir: Path) -> float:
            # Harbor writes mean_reward to run_result.json; summary.yaml often omits it.
            for name in ("run_result.json", "summary.yaml"):
                path = run_dir / name
                if not path.is_file():
                    continue
                try:
                    data = json.loads(path.read_text()) if name.endswith(".json") else yaml.safe_load(path.read_text())
                except Exception:
                    continue
                if isinstance(data, dict) and data.get("mean_reward") is not None:
                    return float(data["mean_reward"])
            return 0.0
        
        t_reward = mean_reward(treatment_dir)
        c_reward = mean_reward(control_dir)
        outcome = {
            "wins_a": 0,
            "wins_b": 0,
            "ties": 0,
            "errors": 0,
            "win_rate": 0.0,
            "recommendation": "fail",
        }
        
        summary_path = treatment_dir / "summary.yaml"
        if summary_path.exists():
            summary = yaml.safe_load(summary_path.read_text()) or {}
            pairwise = summary.get("pairwise", {}) or {}
            outcome = pairwise_outcome(
                pairwise.get("wins_a", 0),
                pairwise.get("wins_b", 0),
                pairwise.get("ties", 0),
                pairwise.get("errors", 0),
                threshold=threshold,
            )
        
        rec = outcome["recommendation"]
        win_rate = outcome["win_rate"]
        wins_a = outcome["wins_a"]
        wins_b = outcome["wins_b"]
        ties = outcome["ties"]
        errors = outcome["errors"]
        
        tmp_dir.mkdir(parents=True, exist_ok=True)
        (tmp_dir / "treatment-reward").write_text(f"{t_reward:.4f}")
        (tmp_dir / "control-reward").write_text(f"{c_reward:.4f}")
        (tmp_dir / "recommendation").write_text(rec)
        
        print(f"AEH Pairwise Results:")
        print(f"  Treatment mean reward: {t_reward:.4f}")
        print(f"  Control mean reward: {c_reward:.4f}")
        print(f"  Pairwise: A(wins)={wins_a} B(wins)={wins_b} ties={ties} errors={errors}")
        print(f"  Treatment win rate: {win_rate:.2%} (threshold={threshold})")
        print(f"  Recommendation: {rec}")
        PARSE_PAIRWISE

        # Optional MLflow logging for control + treatment (non-blocking).
        # Prefer packages baked into the AEH image; if missing, install to /tmp.
        if [ "$(params.enable-mlflow)" = "true" ] && [ -n "$(params.mlflow-tracking-uri)" ]; then
          echo "=== AEH MLflow logging (pairwise) ==="
          MLFLOW_PKG_DIR="/tmp/mlflow-pkgs"
          mkdir -p "$MLFLOW_PKG_DIR"
          export PYTHONPATH="${MLFLOW_PKG_DIR}${PYTHONPATH:+:$PYTHONPATH}"
          # pandas is required by AEH log_results.py (mlflow.log_table).
          if python -c "import mlflow, pandas" 2>/dev/null; then
            echo "mlflow/pandas already available (image or prior install); skipping pip"
          else
            echo "Installing mlflow-skinny + pandas into ${MLFLOW_PKG_DIR} (fallback) ..."
            set +e
            python -m pip install --no-cache-dir --target "$MLFLOW_PKG_DIR" 'mlflow-skinny' 'pandas' 'boto3' 2>&1 | tee /tmp/mlflow-pip.log | tail -30
            PIP_RC=${PIPESTATUS[0]}
            set -e
            if [ "$PIP_RC" -ne 0 ]; then
              echo "WARN: mlflow-skinny/pandas install failed (rc=$PIP_RC)"
              tail -40 /tmp/mlflow-pip.log || true
            fi
          fi
          if python -c "import mlflow, pandas; print('mlflow OK', mlflow.__version__, 'pandas', pandas.__version__)"; then
            export MLFLOW_TRACKING_URI="$(params.mlflow-tracking-uri)"
            # One MLflow experiment per PipelineRun; control/treatment are runs under it.
            for VARIANT_RUN in "control-$RUN_ID" "treatment-$RUN_ID"; do
              CFG="$SUBMISSION_DIR/$TREATMENT_CONFIG"
              if [[ "$VARIANT_RUN" == control-* ]]; then
                CFG="$SUBMISSION_DIR/$CONTROL_CONFIG"
              fi
              # sync-dataset once (first variant); later variants only log + feedback.
              ACTIONS="log-results,push-feedback,sync-dataset"
              if [[ "$VARIANT_RUN" != control-* ]]; then
                ACTIONS="log-results,push-feedback"
              fi
              python "$PIPELINE_DIR/scripts/log_aeh_mlflow.py" \
                --enabled true \
                --tracking-uri "$(params.mlflow-tracking-uri)" \
                --experiment "$RUN_ID" \
                --run-id "$VARIANT_RUN" \
                --config "$CFG" \
                --runs-dir "$REPORTS_DIR" \
                --actions "$ACTIONS" \
                2>&1 || echo "Warning: MLflow logging failed for $VARIANT_RUN (non-blocking)"
            done
          else
            echo "Warning: mlflow/pandas not importable; skipping MLflow logging"
          fi
        else
          echo "Skipping AEH MLflow (enable-mlflow=$(params.enable-mlflow))"
        fi

        # Advisory AEH threshold / baseline regression on treatment run.
        if [ "$(params.enable-aeh-regression-check)" = "true" ]; then
          echo "=== AEH regression check (advisory, pairwise treatment) ==="
          BASELINE_ARGS=()
          if [ -n "$(params.aeh-baseline-run-id)" ]; then
            BASELINE_ARGS=(--baseline "$(params.aeh-baseline-run-id)")
          fi
          python "$PIPELINE_DIR/scripts/run_aeh_regression.py" \
            --enabled true \
            --run-id "treatment-$RUN_ID" \
            --config "$SUBMISSION_DIR/$TREATMENT_CONFIG" \
            --runs-dir "$REPORTS_DIR" \
            --output "$REPORTS_DIR/${SUBMISSION_NAME}/aeh-regression.txt" \
            "${BASELINE_ARGS[@]}" \
            2>&1 || echo "Warning: AEH regression check failed to run (non-blocking)"
        else
          echo "Skipping AEH regression check (enable-aeh-regression-check=$(params.enable-aeh-regression-check))"
        fi

        if [ "$PAIRWISE_EXIT" -ne 0 ]; then
          echo "ERROR: pairwise evaluation exited $PAIRWISE_EXIT (report written if outputs existed)"
          exit "$PAIRWISE_EXIT"
        fi

    # Step 15: Evaluate-time MinIO debug save (disabled — store/publish handles it)
    - name: save-harbor-debug
      when:
        - input: "$(params.eval-engine)"
          operator: in
          # Disabled: dual prefixes + tar uploads. Debug is uploaded at store time
          # as individual files under prepare's report-prefix (see publish.py).
          values: ["__disabled__"]
      onError: continue
      image: registry.access.redhat.com/ubi9/python-311:9.6
      script: |
        #!/usr/bin/env bash
        echo "Evaluate-time Harbor debug save is disabled; store task uploads debug/"
        exit 0

    # Step 16: Finalize results
    - name: finalize
      image: registry.access.redhat.com/ubi9/python-311:9.6
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        echo "=== EVALUATE PHASE: Finalize ==="
        
        # Read results from temp files
        EVAL_TMP="$(workspaces.source.path)/_eval_tmp"
        T_REWARD=$(cat "$EVAL_TMP/treatment-reward" 2>/dev/null || echo "0.0")
        C_REWARD=$(cat "$EVAL_TMP/control-reward" 2>/dev/null || echo "0.0")
        REC=$(cat "$EVAL_TMP/recommendation" 2>/dev/null || echo "fail")
        
        echo -n "$T_REWARD" > "$(results.treatment-mean-reward.path)"
        echo -n "$C_REWARD" > "$(results.control-mean-reward.path)"
        echo -n "$REC" > "$(results.recommendation.path)"

        # AEH Harbor jobs live under _eval_tmp/:
        #   single:    aeh-jobs/YYYY-MM-DD__…
        #   pairwise:  aeh-control-jobs-<run>/… and aeh-treatment-jobs-<run>/…
        # Point store at _eval_tmp so publish.py can discover both layouts.
        # OpenShell writes under reports/<skill>/<run-id>/ — keep reports, not _eval_tmp.
        if [ "$(params.eval-engine)" = "aeh" ]; then
          echo -n "$EVAL_TMP" > "$(results.results-dir.path)"
          echo "AEH results-dir: $EVAL_TMP"
          ls -la "$EVAL_TMP" 2>/dev/null | head -40 || true
        elif [ "$(params.eval-engine)" = "aeh_openshell_openclaw" ]; then
          REPORTS="$(workspaces.source.path)/reports/$(params.submission-name)"
          echo -n "$REPORTS" > "$(results.results-dir.path)"
          echo "OpenShell AEH results-dir: $REPORTS"
        fi
        
        echo "Treatment reward: $T_REWARD"
        echo "Control reward: $C_REWARD"
        echo "Recommendation: $REC"
        echo "Results: $(cat "$(results.results-dir.path)")"

    # Step 17: Cleanup A2A agent deployment (always runs)
    - name: a2a-cleanup
      image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
      script: |
        #!/usr/bin/env bash
        
        EVAL_ENGINE="$(params.eval-engine)"
        if [ "$EVAL_ENGINE" != "a2a" ]; then
          exit 0
        fi
        
        DEPLOYED_FILE="$(workspaces.source.path)/_eval_tmp/agent-deployed"
        if [ ! -f "$DEPLOYED_FILE" ] || [ "$(cat "$DEPLOYED_FILE")" = "false" ]; then
          echo "No agent to cleanup (external endpoint used)"
          exit 0
        fi
        
        AGENT_NAME=$(cat "$DEPLOYED_FILE")
        echo "Cleaning up agent: $AGENT_NAME"
        oc delete deployment/$AGENT_NAME service/$AGENT_NAME --ignore-not-found=true
        echo "Cleanup complete"
