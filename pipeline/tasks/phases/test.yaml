apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: test
  namespace: ab-eval-flow
  labels:
    app.kubernetes.io/name: abevalflow
    app.kubernetes.io/component: phase
spec:
  description: >-
    Testing phase: runs security scanning (Cisco skill-scanner) and quality
    review checks. Results are persisted immediately to MinIO/DB after each
    check completes. Identical for harbor, ASE, and AEH family
    (aeh, aeh_openshell_openclaw); skipped for MCPChecker.
  params:
    - name: submission-dir
      type: string
      description: Submission directory name under submissions/
    - name: submission-name
      type: string
      description: Validated submission name from metadata.yaml
    - name: eval-engine
      type: string
      description: Evaluation engine (harbor, ase, mcpchecker, a2a, aeh, aeh_openshell_openclaw, both)
    - name: report-prefix
      type: string
      description: MinIO report prefix (timestamp_name_runid)
    - name: pipeline-run-name
      type: string
      description: PipelineRun name for DB records
    - name: pipeline-repo-url
      type: string
      default: "https://github.com/RHEcosystemAppEng/agentic_eval_flow.git"
    - name: pipeline-repo-revision
      type: string
      default: "main"
    - name: security-scan-mode
      type: string
      default: ""
      description: Pipeline-level security scan mode override
    - name: submission-security-scan
      type: string
      default: "warn"
      description: Submission's preferred scan mode from metadata.yaml
    - name: security-scan-use-llm
      type: string
      default: "true"
    - name: enable-quality-review
      type: string
      default: "true"
    - name: submission-skip-quality-review
      type: string
      default: "false"
      description: Submission's skip_quality_review setting from metadata.yaml
    - name: enable-aeh-eval-check
      type: string
      default: "false"
      description: >-
        When true and eval-engine is aeh or aeh_openshell_openclaw, run AEH
        harness inventory (advisory — does not fail the test phase). Defaults
        off to avoid an extra AEH image pull in the test phase; set true to
        opt in.
    - name: aeh-image
      type: string
      default: "quay.io/aipcc/base-images/agentic/openclaw:latest"
      description: AEH image providing skills/eval-check/scripts/harness_inventory.py
    - name: llm-base-url
      type: string
      default: "http://litellm.ab-eval-flow.svc:4000/v1"
    - name: llm-model
      type: string
      default: "claude-sonnet"
    - name: llm-api-key
      type: string
      default: ""
    - name: harness-eval-version
      type: string
      default: "7.9.0"
      description: >-
        Pinned harness-eval version for deterministic submission scanning.
        Bump this when a new harness-eval release is tested and ready.
    - name: minio-endpoint
      type: string
      default: "minio.ab-eval-flow.svc:9000"
    - name: minio-bucket
      type: string
      default: "ab-eval-reports"
  workspaces:
    - name: source
      description: Workspace containing the cloned submissions repository
  results:
    - name: security-passed
      description: Whether security scan passed
    - name: security-mode
      description: Effective security scan mode used
    - name: security-findings
      description: Number of security findings
    - name: quality-passed
      description: Whether quality review passed
    - name: tests-passed
      description: Overall tests passed (all checks)
  steps:
    # Step 1: Clone pipeline repo (if not already)
    - name: setup
      image: registry.access.redhat.com/ubi9/python-311:9.6
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        echo "=== TEST PHASE: Setup ==="
        
        EVAL_ENGINE="$(params.eval-engine)"
        
        # MCPChecker has no skill submission layout to scan
        if [ "$EVAL_ENGINE" = "mcpchecker" ]; then
          echo "Skipping test phase for eval-engine=$EVAL_ENGINE"
          echo -n "true" > "$(results.security-passed.path)"
          echo -n "disabled" > "$(results.security-mode.path)"
          echo -n "0" > "$(results.security-findings.path)"
          echo -n "true" > "$(results.quality-passed.path)"
          echo -n "true" > "$(results.tests-passed.path)"
          exit 0
        fi
        
        PIPELINE_DIR="$(workspaces.source.path)/_pipeline"
        if [ -d "$PIPELINE_DIR/.git" ]; then
          echo "Pipeline repo exists, updating..."
          cd "$PIPELINE_DIR"
          git fetch origin "$(params.pipeline-repo-revision)" 2>/dev/null || true
          git reset --hard FETCH_HEAD 2>/dev/null || true
        else
          git clone --depth 1 --branch "$(params.pipeline-repo-revision)" \
            "$(params.pipeline-repo-url)" "$PIPELINE_DIR"
        fi
        echo "Pipeline repo ready"
        
        # Initialize results with defaults (will be overwritten)
        echo -n "true" > "$(results.security-passed.path)"
        echo -n "warn" > "$(results.security-mode.path)"
        echo -n "0" > "$(results.security-findings.path)"
        echo -n "true" > "$(results.quality-passed.path)"
        echo -n "true" > "$(results.tests-passed.path)"

    # Step 2: Security scan with immediate persistence
    - name: security-scan
      image: registry.access.redhat.com/ubi9/python-311:9.6
      env:
        - name: MINIO_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: minio-credentials
              key: root-user
        - name: MINIO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: minio-credentials
              key: root-password
        - name: DB_URL
          valueFrom:
            secretKeyRef:
              name: ab-eval-db-credentials
              key: database-url
              optional: true
        - name: LLM_API_KEY
          value: "$(params.llm-api-key)"
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        echo "=== TEST PHASE: Security Scan ==="
        
        EVAL_ENGINE="$(params.eval-engine)"
        if [ "$EVAL_ENGINE" = "mcpchecker" ]; then
          echo "Skipping security scan for eval-engine=$EVAL_ENGINE"
          exit 0
        fi
        
        # Determine scan mode
        PIPELINE_MODE="$(params.security-scan-mode)"
        SUBMISSION_MODE="$(params.submission-security-scan)"
        SCAN_MODE="${PIPELINE_MODE:-$SUBMISSION_MODE}"
        echo -n "$SCAN_MODE" > "$(results.security-mode.path)"
        
        if [ "$SCAN_MODE" = "disabled" ]; then
          echo "Security scanning disabled"
          echo -n "true" > "$(results.security-passed.path)"
          echo -n "0" > "$(results.security-findings.path)"
          exit 0
        fi
        
        SUBMISSION_PATH="$(workspaces.source.path)/submissions/$(params.submission-dir)"
        SUBMISSION_NAME="$(params.submission-name)"
        REPORT_DIR="$(workspaces.source.path)/reports/$SUBMISSION_NAME"
        JSON_PATH="$REPORT_DIR/security-scan.json"
        SARIF_PATH="$REPORT_DIR/security-scan.sarif"
        mkdir -p "$REPORT_DIR"
        
        # Point Cisco at the skill package root that contains SKILL.md:
        # - ASE flat: skills/SKILL.md → scan skills/
        # - AEH nested: skills/<name>/SKILL.md → scan skills/<name>/
        # skill-scanner scan expects a skill dir, not the whole submission tree.
        if [ -f "$SUBMISSION_PATH/skills/SKILL.md" ]; then
          SUBMISSION_PATH="$SUBMISSION_PATH/skills"
        else
          SKILL_MD=$(find "$SUBMISSION_PATH" -name 'SKILL.md' -type f 2>/dev/null | head -1 || true)
          if [ -n "$SKILL_MD" ]; then
            SUBMISSION_PATH="$(dirname "$SKILL_MD")"
            echo "Using nested skill package for Cisco scan: $SUBMISSION_PATH"
          else
            echo "WARN: SKILL.md was not found in submission; skipping Cisco security scan"
            echo -n "true" > "$(results.security-passed.path)"
            echo -n "0" > "$(results.security-findings.path)"
            exit 0
          fi
        fi
        
        # Install scanner
        pip install --quiet --no-cache-dir 'cisco-ai-skill-scanner==2.0.11' minio sqlalchemy 'psycopg[binary]' 2>&1 | tail -3
        
        # Build scanner command
        SCANNER_CMD=(skill-scanner scan "$SUBMISSION_PATH" --format json --output-json "$JSON_PATH" --output-sarif "$SARIF_PATH" --lenient --verbose)
        
        if [ "$SCAN_MODE" = "block" ]; then
          SCANNER_CMD+=(--fail-on-severity high)
        fi
        
        USE_LLM="$(params.security-scan-use-llm)"
        if [ "$USE_LLM" = "true" ]; then
          SCANNER_CMD+=(--use-llm)
          export SKILL_SCANNER_LLM_MODEL="openai/$(params.llm-model)"
          export SKILL_SCANNER_LLM_API_KEY="${LLM_API_KEY:-}"
          export OPENAI_API_KEY="${LLM_API_KEY:-}"
          export OPENAI_BASE_URL="$(params.llm-base-url)"
        fi
        
        # Run scanner
        set +e
        "${SCANNER_CMD[@]}" 2>&1 | tee /tmp/scan-output.txt
        SCAN_EXIT=$?
        set -e
        
        # Parse results
        FINDINGS_COUNT=0
        CRITICAL_COUNT=0
        HIGH_COUNT=0
        PASSED="true"
        
        if [ -f "$JSON_PATH" ]; then
          FINDINGS_COUNT=$(python3 -c "import json; print(len(json.load(open('$JSON_PATH')).get('findings', [])))" 2>/dev/null || echo "0")
          CRITICAL_COUNT=$(python3 -c "import json; print(sum(1 for f in json.load(open('$JSON_PATH')).get('findings', []) if f.get('severity','').lower()=='critical'))" 2>/dev/null || echo "0")
          HIGH_COUNT=$(python3 -c "import json; print(sum(1 for f in json.load(open('$JSON_PATH')).get('findings', []) if f.get('severity','').lower()=='high'))" 2>/dev/null || echo "0")
        else
          PASSED="false"
        fi
        
        if [ "$SCAN_MODE" = "block" ] && [ "$SCAN_EXIT" -ne 0 ]; then
          PASSED="false"
        fi
        
        echo -n "$PASSED" > "$(results.security-passed.path)"
        echo -n "$FINDINGS_COUNT" > "$(results.security-findings.path)"
        
        echo "Security scan: $FINDINGS_COUNT findings (critical: $CRITICAL_COUNT, high: $HIGH_COUNT)"
        echo "Mode: $SCAN_MODE, Passed: $PASSED"
        
        # Immediate persistence to MinIO
        echo "Uploading to MinIO..."
        REPORT_PREFIX="$(params.report-prefix)"
        python3 - "$JSON_PATH" "$SARIF_PATH" "$REPORT_PREFIX" "$(params.minio-endpoint)" "$(params.minio-bucket)" <<'UPLOAD'
        import os, sys
        from minio import Minio
        
        json_path, sarif_path, prefix, endpoint, bucket = sys.argv[1:6]
        client = Minio(endpoint, access_key=os.environ["MINIO_ACCESS_KEY"], secret_key=os.environ["MINIO_SECRET_KEY"], secure=False)
        
        for path, name in [(json_path, "security-scan.json"), (sarif_path, "security-scan.sarif")]:
            if os.path.isfile(path):
                obj = f"{prefix}/security_scans/{name}"
                client.fput_object(bucket, obj, path)
                print(f"Uploaded: {obj}")
        UPLOAD
        
        # Immediate persistence to DB
        if [ -n "${DB_URL:-}" ]; then
          echo "Writing to DB..."
          python3 - "$JSON_PATH" "$(params.submission-name)" "$(params.pipeline-run-name)" "$SCAN_MODE" "$PASSED" <<'WRITE_DB'
        import os, sys, json, uuid
        from sqlalchemy import create_engine, text
        
        json_path, sub_name, run_id, mode, passed = sys.argv[1:6]
        db_url = os.environ.get("DB_URL", "")
        if not db_url:
            sys.exit(0)
        
        # Column is NOT NULL — use empty list when the scanner produced no JSON.
        findings_json = "[]"
        counts = {"total": 0, "critical": 0, "high": 0}
        if os.path.isfile(json_path):
            with open(json_path) as f:
                data = json.load(f)
            findings_json = json.dumps(data)
            for f in data.get("findings", []):
                counts["total"] += 1
                sev = f.get("severity", "").lower()
                if sev in counts:
                    counts[sev] += 1
        
        engine = create_engine(db_url)
        with engine.connect() as conn:
            conn.execute(text("""
                INSERT INTO security_scans (id, pipeline_run_id, submission_name, scanner, scan_mode, passed, findings_count, critical_count, high_count, findings_json, created_at)
                VALUES (:id, :run, :name, 'cisco', :mode, :passed, :total, :critical, :high, :json, NOW())
                ON CONFLICT (pipeline_run_id) DO UPDATE SET findings_count=EXCLUDED.findings_count, critical_count=EXCLUDED.critical_count, high_count=EXCLUDED.high_count, passed=EXCLUDED.passed, findings_json=EXCLUDED.findings_json
            """), {"id": str(uuid.uuid4()), "run": run_id, "name": sub_name, "mode": mode, "passed": passed == "true", "total": counts["total"], "critical": counts["critical"], "high": counts["high"], "json": findings_json})
            conn.commit()
        print("DB record written")
        WRITE_DB
        fi
        
        echo "Security scan complete"

    # Step 3: SKILL.md security + quality scan (harness-eval deterministic + optional LLM)
    - name: skillmd-scan
      image: registry.access.redhat.com/ubi9/python-311:9.6
      env:
        - name: LLM_API_KEY
          value: "$(params.llm-api-key)"
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        echo "=== TEST PHASE: SKILL.md Scan (harness-eval) ==="

        EVAL_ENGINE="$(params.eval-engine)"
        if [ "$EVAL_ENGINE" = "mcpchecker" ]; then
          echo "MCPChecker mode: SKILL.md scan skipped"
          exit 0
        fi

        PIPELINE_MODE="$(params.security-scan-mode)"
        SUBMISSION_MODE="$(params.submission-security-scan)"
        SCAN_MODE="${PIPELINE_MODE:-$SUBMISSION_MODE}"

        SUBMISSION_PATH="$(workspaces.source.path)/submissions/$(params.submission-dir)"
        SUBMISSION_NAME="$(params.submission-name)"
        REPORT_DIR="$(workspaces.source.path)/reports/$SUBMISSION_NAME"
        WORKSPACE_ROOT="$(workspaces.source.path)"
        SECURITY_JSON="$REPORT_DIR/skillmd-security-scan.json"
        QUALITY_JSON="$WORKSPACE_ROOT/skillmd-quality-scan.json"
        mkdir -p "$REPORT_DIR"

        HARNESS_VERSION="$(params.harness-eval-version)"
        pip install --quiet --no-cache-dir "harness-eval==$HARNESS_VERSION" 2>&1 | tail -3

        # Build the scan command. Always produce quality output.
        # Security output is conditional on scan mode.
        SCAN_CMD=(harness-eval skill-submission-scan "$SUBMISSION_PATH"
          --output-quality "$QUALITY_JSON")

        if [ "$SCAN_MODE" != "disabled" ]; then
          SCAN_CMD+=(--output-security "$SECURITY_JSON")
        else
          echo "Security scanning disabled; running quality-only scan"
        fi

        echo "Scanning: $SUBMISSION_PATH (mode=$SCAN_MODE, harness-eval==$HARNESS_VERSION)"
        "${SCAN_CMD[@]}" 2>&1 || true

        # Verify output files were produced (fail-closed: don't silently pass on crash)
        if [ ! -f "$QUALITY_JSON" ]; then
          echo "ERROR: quality scan output not produced ($QUALITY_JSON)"
          echo "The harness-eval CLI may have failed to install or crashed."
          exit 1
        fi
        if [ "$SCAN_MODE" != "disabled" ] && [ ! -f "$SECURITY_JSON" ]; then
          echo "ERROR: security scan output not produced ($SECURITY_JSON)"
          echo "The harness-eval CLI may have failed to install or crashed."
          exit 1
        fi

        # Report finding counts
        for JSON_FILE in "$SECURITY_JSON" "$QUALITY_JSON"; do
          if [ -f "$JSON_FILE" ]; then
            BASENAME=$(basename "$JSON_FILE")
            COUNT=$(python3 -c "import json; print(len(json.load(open('$JSON_FILE')).get('findings', [])))" 2>/dev/null || echo "0")
            echo "$BASENAME: $COUNT findings"
          fi
        done

        # Optional: LLM semantic security review (appends into security JSON)
        USE_LLM="$(params.security-scan-use-llm)"
        if [ "$USE_LLM" = "true" ] && [ "$SCAN_MODE" != "disabled" ]; then
          echo "Running LLM semantic security review..."
          PIPELINE_DIR="$(workspaces.source.path)/_pipeline"
          pip install --quiet --no-cache-dir openai 2>&1 | tail -3
          export PYTHONPATH="$PIPELINE_DIR"
          export LLM_BASE_URL="$(params.llm-base-url)"
          export LLM_MODEL="$(params.llm-model)"

          python3 "$PIPELINE_DIR/scripts/llm_security_review.py" \
            "$SUBMISSION_PATH" --scan-json "$SECURITY_JSON" 2>&1 || true
        fi

        echo "SKILL.md scan complete"

    # Step 5: Quality review (LLM)
    - name: quality-review
      image: registry.access.redhat.com/ubi9/python-311:9.6
      env:
        - name: LLM_API_KEY
          value: "$(params.llm-api-key)"
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        echo "=== TEST PHASE: Quality Review ==="
        
        EVAL_ENGINE="$(params.eval-engine)"
        ENABLE_REVIEW="$(params.enable-quality-review)"
        
        SUBMISSION_SKIP="$(params.submission-skip-quality-review)"
        
        if [ "$EVAL_ENGINE" = "mcpchecker" ]; then
          echo "Skipping quality review for eval-engine=$EVAL_ENGINE"
          exit 0
        fi
        
        if [ "$ENABLE_REVIEW" != "true" ] || [ "$SUBMISSION_SKIP" = "true" ]; then
          echo "Quality review disabled (enable=$ENABLE_REVIEW, submission_skip=$SUBMISSION_SKIP)"
          echo -n "true" > "$(results.quality-passed.path)"
          exit 0
        fi
        
        PIPELINE_DIR="$(workspaces.source.path)/_pipeline"
        SUBMISSION_PATH="$(workspaces.source.path)/submissions/$(params.submission-dir)"
        
        cd "$PIPELINE_DIR"
        pip install --quiet --no-cache-dir pydantic pyyaml openai
        export PYTHONPATH="$PIPELINE_DIR"
        export LLM_BASE_URL="$(params.llm-base-url)"
        export LLM_MODEL="$(params.llm-model)"
        
        set +e
        python scripts/test_quality_review.py "$SUBMISSION_PATH" | tee /tmp/review-output.json
        REVIEW_EXIT=$?
        set -e
        
        # Save to workspace for later use
        cp /tmp/review-output.json "$(workspaces.source.path)/_ai_review.json" 2>/dev/null || true
        
        REC=$(python3 -c "import json; print(json.load(open('/tmp/review-output.json')).get('recommendation', 'warn'))" 2>/dev/null || echo "warn")
        # AEH family quality review is advisory: never fail the test phase on recommendation.
        if [ "$EVAL_ENGINE" = "aeh" ] || [ "$EVAL_ENGINE" = "aeh_openshell_openclaw" ]; then
          echo -n "true" > "$(results.quality-passed.path)"
          echo "Quality review (AEH advisory): recommendation=$REC, quality-passed=true"
        else
          PASSED=$(python3 -c "import json; print(str(json.load(open('/tmp/review-output.json')).get('passed', False)).lower())" 2>/dev/null || echo "true")
          echo -n "$PASSED" > "$(results.quality-passed.path)"
          echo "Quality review: passed=$PASSED recommendation=$REC"
        fi

    # Step 5b: AEH harness inventory (advisory eval-check Step 1)
    - name: aeh-eval-check
      when:
        - input: "$(params.eval-engine)"
          operator: in
          values: ["aeh", "aeh_openshell_openclaw"]
      image: $(params.aeh-image)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        echo "=== TEST PHASE: AEH eval-check (advisory inventory) ==="

        if [ "$(params.enable-aeh-eval-check)" != "true" ]; then
          echo "Skipping AEH eval-check (enable-aeh-eval-check=$(params.enable-aeh-eval-check))"
          exit 0
        fi

        PIPELINE_DIR="$(workspaces.source.path)/_pipeline"
        SUBMISSION_PATH="$(workspaces.source.path)/submissions/$(params.submission-dir)"
        OUT_DIR="$(workspaces.source.path)/reports/$(params.submission-name)"
        mkdir -p "$OUT_DIR"

        export PYTHONPATH="$PIPELINE_DIR:${PYTHONPATH:-}"
        python "$PIPELINE_DIR/scripts/run_aeh_eval_check.py" \
          --enabled true \
          --root "$SUBMISSION_PATH" \
          --output "$OUT_DIR/harness-inventory.yaml" \
          2>&1 || echo "Warning: AEH eval-check failed to run (non-blocking)"

    # Step 6: Finalize results and write metrics checkpoint
    - name: finalize
      image: registry.access.redhat.com/ubi9/python-311:9.6
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        echo "=== TEST PHASE: Finalize ==="

        SECURITY_PASSED=$(cat "$(results.security-passed.path)")
        QUALITY_PASSED=$(cat "$(results.quality-passed.path)")

        # Overall pass if both passed
        if [ "$SECURITY_PASSED" = "true" ] && [ "$QUALITY_PASSED" = "true" ]; then
          echo -n "true" > "$(results.tests-passed.path)"
          echo "All tests PASSED"
        else
          echo -n "false" > "$(results.tests-passed.path)"
          echo "Tests FAILED (security=$SECURITY_PASSED, quality=$QUALITY_PASSED)"
        fi

        # Write metrics checkpoint with token data from quality review
        PIPELINE_DIR="$(workspaces.source.path)/_pipeline"
        REPORT_DIR="$(workspaces.source.path)/reports/$(params.submission-name)"
        REVIEW_FILE="$(workspaces.source.path)/_ai_review.json"
        mkdir -p "$REPORT_DIR"

        pip install --quiet --no-cache-dir pydantic 2>&1 | tail -1
        export PYTHONPATH="$PIPELINE_DIR"

        python3 "$PIPELINE_DIR/scripts/write_metrics_checkpoint.py" \
          --run-id "$(params.pipeline-run-name)" \
          --submission-name "$(params.submission-name)" \
          --report-dir "$REPORT_DIR" \
          --review-file "$REVIEW_FILE" \
          2>&1 || echo "Warning: metrics checkpoint failed (non-blocking)"
