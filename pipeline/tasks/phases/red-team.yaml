apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: red-team
  labels:
    app.kubernetes.io/name: abevalflow
    app.kubernetes.io/component: phase
spec:
  description: >-
    Generic red team evaluation using Promptfoo (broad coverage) plus PyRIT
    Crescendo (adaptive multi-turn) in full mode. Generates domain-aware
    adversarial attacks from submission metadata and scores responses with
    LLM-as-judge. Supports A2A agents (JSON-RPC) and generic HTTP endpoints.
    Two modes: "smoke" (~25 Promptfoo tests, basic strategy, no Crescendo);
    "full" (comprehensive Promptfoo + PyRIT Crescendo after Promptfoo).
  params:
    - name: eval-engine
      type: string
      description: "Evaluation engine: a2a, mcpchecker, harbor, http"
    - name: submission-dir
      type: string
      description: Submission directory name under submissions/
    - name: submission-name
      type: string
      description: Validated submission name from prepare task
    - name: agent-endpoint
      type: string
      default: ""
      description: Target endpoint URL (A2A agent, MCP server, or HTTP API)
    - name: red-team-mode
      type: string
      default: "smoke"
      description: >-
        "smoke" generates a quick Promptfoo suite (~25 tests, basic strategy, ~2 min).
        "full" runs comprehensive Promptfoo then PyRIT Crescendo (~90+ min).
    - name: llm-api-base
      type: string
      default: ""
      description: LLM proxy base URL for the grading judge (e.g. http://litellm.ns.svc:4000)
    - name: llm-model
      type: string
      default: "claude-sonnet"
      description: Model name for the LLM-as-judge grader
    - name: llm-api-key
      type: string
      default: "sk-dummy"
    - name: pipeline-run-id
      type: string
      default: ""
    - name: pipeline-repo-url
      type: string
      default: "https://github.com/RHEcosystemAppEng/agentic_eval_flow.git"
    - name: pipeline-repo-revision
      type: string
      default: "main"
    - name: concurrency
      type: string
      default: "12"
      description: Number of parallel Promptfoo test evaluations
    - name: crescendo-max-turns
      type: string
      default: "7"
      description: Max turns per PyRIT Crescendo objective (full mode only)
  workspaces:
    - name: source
      description: Shared workspace with cloned submission and pipeline repos
  results:
    - name: redteam-passed
      description: "true if no vulnerabilities found, false otherwise"
    - name: redteam-findings
      description: Number of red team findings (failed tests indicating vulnerabilities)
  steps:
    - name: setup
      image: registry.access.redhat.com/ubi9/python-311:9.6
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        echo "=== RED TEAM: Setup ==="

        EVAL_ENGINE="$(params.eval-engine)"

        if [ "$EVAL_ENGINE" = "ase" ]; then
          echo "Skipping: eval-engine=ase has no live endpoint to red-team"
          echo -n "true" > "$(results.redteam-passed.path)"
          echo -n "0" > "$(results.redteam-findings.path)"
          exit 0
        fi

        ENDPOINT="$(params.agent-endpoint)"
        if [ -z "$ENDPOINT" ]; then
          echo "Skipping: no agent-endpoint provided"
          echo -n "true" > "$(results.redteam-passed.path)"
          echo -n "0" > "$(results.redteam-findings.path)"
          exit 0
        fi

        PIPELINE_DIR="$(workspaces.source.path)/_pipeline"
        if [ -d "$PIPELINE_DIR/.git" ]; then
          cd "$PIPELINE_DIR"
          git fetch origin "$(params.pipeline-repo-revision)" 2>/dev/null || true
          git reset --hard FETCH_HEAD 2>/dev/null || true
        else
          git clone --depth 1 --branch "$(params.pipeline-repo-revision)" \
            "$(params.pipeline-repo-url)" "$PIPELINE_DIR"
        fi

        echo -n "true" > "$(results.redteam-passed.path)"
        echo -n "0" > "$(results.redteam-findings.path)"
        echo "Setup complete (engine=$EVAL_ENGINE, endpoint=$ENDPOINT)"

    - name: generate-config
      image: registry.access.redhat.com/ubi9/python-311:9.6
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        echo "=== RED TEAM: Generate Config ==="

        EVAL_ENGINE="$(params.eval-engine)"
        if [ "$EVAL_ENGINE" = "ase" ]; then
          echo "Skipped"
          exit 0
        fi

        ENDPOINT="$(params.agent-endpoint)"
        if [ -z "$ENDPOINT" ]; then
          echo "Skipped (no endpoint)"
          exit 0
        fi

        PIPELINE_DIR="$(workspaces.source.path)/_pipeline"
        SUBMISSION_PATH="$(workspaces.source.path)/submissions/$(params.submission-dir)"
        CONFIG_DIR="$(workspaces.source.path)/_redteam"
        mkdir -p "$CONFIG_DIR"

        pip install --quiet --no-cache-dir pyyaml 2>&1 | tail -3

        MODE="$(params.red-team-mode)"

        python3 "$PIPELINE_DIR/scripts/generate_redteam_config.py" \
          --submission-path "$SUBMISSION_PATH" \
          --eval-engine "$EVAL_ENGINE" \
          --target-url "$ENDPOINT" \
          --llm-base-url "$(params.llm-api-base)" \
          --llm-model "$(params.llm-model)" \
          --llm-api-key "$(params.llm-api-key)" \
          --mode "$MODE" \
          --output "$CONFIG_DIR/promptfooconfig.yaml"

        echo "Config generated at $CONFIG_DIR/promptfooconfig.yaml"

    - name: run-redteam
      image: quay.io/rh-ee-ikrispin/abevalflow-redteam:latest
      env:
        - name: CI
          value: "true"
        - name: PROMPTFOO_DISABLE_TELEMETRY
          value: "1"
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        echo "=== RED TEAM: Run Promptfoo ==="

        EVAL_ENGINE="$(params.eval-engine)"
        if [ "$EVAL_ENGINE" = "ase" ]; then
          echo "Skipped"
          exit 0
        fi

        ENDPOINT="$(params.agent-endpoint)"
        if [ -z "$ENDPOINT" ]; then
          echo "Skipped (no endpoint)"
          exit 0
        fi

        CONFIG_DIR="$(workspaces.source.path)/_redteam"
        REPORT_DIR="$(workspaces.source.path)/reports/$(params.submission-name)"
        mkdir -p "$REPORT_DIR" "$CONFIG_DIR"

        if [ ! -f "$CONFIG_DIR/promptfooconfig.yaml" ]; then
          echo "ERROR: Config not found at $CONFIG_DIR/promptfooconfig.yaml"
          exit 0
        fi

        cd "$CONFIG_DIR"
        cp /app/responseParser.js . 2>/dev/null || true

        MODE="$(params.red-team-mode)"
        CONCURRENCY="$(params.concurrency)"

        if [ "$MODE" = "full" ]; then
          echo "Mode: full (comprehensive attacks; Crescendo via PyRIT step)"
        else
          echo "Mode: smoke (quick coverage, basic strategy)"
        fi

        echo "Generating and evaluating attacks..."
        set +e
        promptfoo redteam generate \
          -c promptfooconfig.yaml \
          --no-cache \
          -o redteam-generated.yaml \
          2>&1 | tail -20

        promptfoo eval \
          -c redteam-generated.yaml \
          --no-cache \
          -j "$CONCURRENCY" \
          -o "$REPORT_DIR/redteam-results.json" \
          2>&1
        EVAL_EXIT=$?
        set -e

        FINDINGS=0
        PASSED="true"

        if [ -f "$REPORT_DIR/redteam-results.json" ]; then
          FINDINGS=$(node -e "
            const fs=require('fs');
            const d=JSON.parse(fs.readFileSync('$REPORT_DIR/redteam-results.json','utf8'));
            const r=d.results?.results||[];
            const failed=r.filter(t=>t.gradingResult&&!t.gradingResult.pass&&!(t.gradingResult.reason||'').includes('fetch failed'));
            console.log(failed.length);
          " 2>/dev/null || echo "0")
        fi

        if [ "$FINDINGS" -gt "0" ]; then
          PASSED="false"
        fi

        # Stash Promptfoo findings for the Crescendo merge step
        echo -n "$FINDINGS" > "$REPORT_DIR/.promptfoo-findings"
        echo -n "$PASSED" > "$(results.redteam-passed.path)"
        echo -n "$FINDINGS" > "$(results.redteam-findings.path)"

        echo ""
        echo "Promptfoo complete: $FINDINGS findings, passed=$PASSED"

    - name: run-crescendo
      image: quay.io/rh-ee-ikrispin/abevalflow-pyrit:0.1
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        echo "=== RED TEAM: PyRIT Crescendo ==="

        EVAL_ENGINE="$(params.eval-engine)"
        if [ "$EVAL_ENGINE" = "ase" ]; then
          echo "Skipped (ase)"
          exit 0
        fi

        ENDPOINT="$(params.agent-endpoint)"
        if [ -z "$ENDPOINT" ]; then
          echo "Skipped (no endpoint)"
          exit 0
        fi

        MODE="$(params.red-team-mode)"
        if [ "$MODE" != "full" ]; then
          echo "Skipped (Crescendo runs only in full mode; mode=$MODE)"
          exit 0
        fi

        REPORT_DIR="$(workspaces.source.path)/reports/$(params.submission-name)"
        SUBMISSION_PATH="$(workspaces.source.path)/submissions/$(params.submission-dir)"
        # Prefer workspace pipeline clone (has scripts); fall back to image-baked copy
        PIPELINE_DIR="$(workspaces.source.path)/_pipeline"
        if [ -d "$PIPELINE_DIR/scripts/pyrit_crescendo" ]; then
          CRESCENDO_DIR="$PIPELINE_DIR/scripts/pyrit_crescendo"
        else
          CRESCENDO_DIR="/app/pyrit_crescendo"
        fi
        mkdir -p "$REPORT_DIR"

        echo "Running Crescendo from $CRESCENDO_DIR"
        set +e
        python "$CRESCENDO_DIR/run_crescendo.py" \
          --endpoint "$ENDPOINT" \
          --eval-engine "$EVAL_ENGINE" \
          --submission-path "$SUBMISSION_PATH" \
          --llm-api-base "$(params.llm-api-base)" \
          --llm-model "$(params.llm-model)" \
          --llm-api-key "$(params.llm-api-key)" \
          --max-turns "$(params.crescendo-max-turns)" \
          --output "$REPORT_DIR/pyrit-crescendo-results.json"
        CRESCENDO_EXIT=$?
        set -e

        if [ "$CRESCENDO_EXIT" -ne 0 ]; then
          echo "WARNING: Crescendo exited with code $CRESCENDO_EXIT"
          if [ ! -f "$REPORT_DIR/pyrit-crescendo-results.json" ]; then
            echo "ERROR: Crescendo failed and produced no results"
            echo -n "false" > "$(results.redteam-passed.path)"
            echo -n "0" > "$(results.redteam-findings.path)"
            exit 1
          fi
        fi

        PF_FINDINGS=0
        if [ -f "$REPORT_DIR/.promptfoo-findings" ]; then
          PF_FINDINGS=$(cat "$REPORT_DIR/.promptfoo-findings")
        fi

        CRESCENDO_FINDINGS=0
        if [ -f "$REPORT_DIR/pyrit-crescendo-results.json" ]; then
          CRESCENDO_FINDINGS=$(python -c "import json;d=json.load(open('$REPORT_DIR/pyrit-crescendo-results.json'));print(int(d.get('summary',{}).get('achieved',0)))" 2>/dev/null || echo "0")
        fi

        TOTAL=$((PF_FINDINGS + CRESCENDO_FINDINGS))
        PASSED="true"
        if [ "$TOTAL" -gt "0" ]; then
          PASSED="false"
        fi

        echo -n "$PASSED" > "$(results.redteam-passed.path)"
        echo -n "$TOTAL" > "$(results.redteam-findings.path)"

        echo ""
        echo "Crescendo exit=$CRESCENDO_EXIT findings=$CRESCENDO_FINDINGS"
        echo "Combined red-team: promptfoo=$PF_FINDINGS crescendo=$CRESCENDO_FINDINGS total=$TOTAL passed=$PASSED"
